<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">해경 설치는 함대사령관 사전 협의 / 합동검문소 설치·폐쇄는 본부장 사전 보고·통보</text>
