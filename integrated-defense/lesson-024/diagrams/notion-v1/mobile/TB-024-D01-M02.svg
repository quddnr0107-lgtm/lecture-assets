<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-024-D01 · 문책요구와 조치 결과 통보</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 24강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">문책요구와 조치 결과 통보</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">본부장의 조사·심의·결정과 소속기관 또는 직장의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">조치를 구분</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">② 심의·결정·통보 (계속)</text>
<path d="M80 433L596.15625 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">명단 통보</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">본부장이 소속 기관 또는 직장의 장에게 해당자 명단</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통보 가능</text>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">③ 소속기관·직장 조치</text>
<path d="M80 729L534.0 729" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 770L80 945" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="805" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">징계 등 조치</text>
<text x="104" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">특별한 사유가 없으면 징계 등 적절한 조치를 하여야</text>
<text x="104" y="928" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">함</text>
<path d="M80 976L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1011" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">결과 통보</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">조치 결과를 통합방위본부장에게 통보하여야 함</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1170L314.21875 1170" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1224" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">조사 결과 → 실무위원회 심의 → 본부장 결정 →</text>
<text x="80" y="1285" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">소속기관 조치 → 본부장에 결과 통보</text>
<text x="80" y="1372" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1382L285.046875 1382" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1456" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장이 직접 징계를 한다는 구조가</text>
<text x="80" y="1517" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">아니다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제23조 · TB-024-D01 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
