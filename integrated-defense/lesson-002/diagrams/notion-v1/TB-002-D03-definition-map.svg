<title id="title">TB-002-D03 · 용어를 관계와 기준으로 구분</title><desc id="desc">방위체계 · 적의 행동 · 보호 기능을 나누어 읽기 방위체계：통합방위 적의 침투·도발·위협에 대응해 국가방위요소를 통합하고 지휘체계를 일원화하여 국가를 방위；통합방위작전 사태 선포지역에서 법 제15조에 따라 국가방위요소를 통합·지휘·통제하는 작전；지역군사령관 본부장이 관할구역 군부대의 장성급 지휘관 중 정함. 필요시 대령급 가능 적의 행동과 상태：침투 특정 임무 수행을 위하여 대한민국 영역을 침범한 상태；도발 특정 임무 수행을 위하여 국민 또는 영역에 위해를 가하는 모든 행위；위협 대한민국 침투·도발이 예상되는 적의 능력과 기도가 드러난 상태 보호 기능과 중요시설：방호 적의 도발·위협으로부터 인원·시설·장비의 피해를 방지하고 모든 기능을 정상 유지하도록 보호；국가중요시설 적에 의해 점령·파괴·기능마비될 경우 국가안보와 국민생활에 심각한 영향을 주는 시설 각 용어의 구별 기준을 정리했으며 법 제2조의 모든 정의를 나열한 도식은 아니다. 통합방위작전 지휘자는 본부장·지역군사령관·함대사령관 또는 시·도경찰청장이다. 지역군사령관의 지정 주체인 본부장은 통합방위본부장을 말한다.</desc>
