<title id="title">병역변경 통지의 대상</title><desc id="desc">병역준비역 편입: 통지 주체 지방병무청장·병무지청장; 통지 내용 편입 사실과 현역·보충역·대체역 복무, 병역판정검사, 연기 등의 절차; 통지 제외 국외 거주·행방불명 등으로 통지가 불가능한 경우 / 예비역 편입 등: 통지 주체 병무청장 또는 지방병무청장·병무지청장; 대상·내용 대통령령이 정한 예비역 편입자·복무완료자 등에게 편입 사실과 동원·병역처분 변경 등의 절차 통지; 통지 제외 국외 거주·행방불명 등으로 통지가 불가능한 경우</desc>
