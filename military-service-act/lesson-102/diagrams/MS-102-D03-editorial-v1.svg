<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무 소집 대상자의 변경</title><desc id="desc">국외 왕래 선원: 3년 이상 연기 사회복무 소집 대상 보충역 중 법정 기산일부터 3년 이상 소집이 연기된 국외 왕래 선박 선원.; 군사교육소집 지방병무청장이 군사교육소집을 하며, 마치면 사회복무요원 복무를 마친 것으로 본다. / 수급·학력 변화: 배정인원보다 많음 학력·보충역 편입연도 등을 고려해 대통령령상 기준에 따라 일부를 전시근로역에 편입할 수 있다.; 학력 변동 법정 기간 내 학력이 변동되면 그 해 병역처분기준에 따라 병역처분을 변경할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-102</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   03 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">사회복무 소집 대상자의 변경</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">선원·배정 초과·학력 변동의 갈래</text>
