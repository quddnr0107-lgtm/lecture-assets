<text x="1102.6666666666665" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">방호</text>
<text x="1102.6666666666665" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">적의 도발·위협으로부터</text>
<text x="1102.6666666666665" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">인원·시설·장비의 피해를</text>
<text x="1102.6666666666665" y="573" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">방지하고 모든 기능을 정상</text>
<text x="1102.6666666666665" y="615" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">유지하도록 보호</text>
<text x="1102.6666666666665" y="712" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">국가중요시설</text>
<text x="1102.6666666666665" y="760" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">적에 의해 점령·파괴·기능마비될</text>
<text x="1102.6666666666665" y="802" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">경우 국가안보와 국민생활에</text>
<text x="1102.6666666666665" y="844" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">심각한 영향을 주는 시설</text>
<path d="M80 894 L1520 894" fill="none" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">통합방위는 국가방위요소의 통합과 지휘체계의 일원화를 함께 요구한다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">각 용어의 구별 기준을 정리했으며 법 제2조의 모든 정의를 나열한 도식은 아니다. 통합방위작전 지휘자는 본부장·지역군사령관·함대사령관 또는</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">시·도경찰청장이다. 지역군사령관의 지정 주체인 본부장은 통합방위본부장을 말한다.</text>
