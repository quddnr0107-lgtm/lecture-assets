<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전시근로소집의 복무 특례</title><desc id="desc">준용되는 절차: 법 제45~48조 대상자 지정·소집·입영신체검사·귀가·복무 등은 병력동원소집 규정을 준용한다.; 용어의 치환 병력동원소집·병력동원소집 복무를 전시근로소집·전시근로소집 복무로 본다. / 별도로 정한 특례: 대체역의 제한 국방부장관은 대체역에서 소집된 사람에게 대체역법 제16조제2항의 행위를 시켜서는 안 된다.; 군부대 밖 거주 국방부장관은 부대 밖 거주를 허용할 수 있고 예산 범위에서 급식·실비 등을 지급할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
