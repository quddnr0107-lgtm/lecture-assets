<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">군복무 중 원격수업과 학점</title><desc id="desc">학교의 장: 대상 학교 고등학교 및 동등 학력 인정 교육시설은 제외; 등록 허용 입영·복무로 휴학 중이면 학칙에 따라 원격수업 등록을 허용할 수 있음 / 입영부대·복무기관: 수강 보장 징집·지원 복무로 휴학 중이고 등록이 허용되면, 복무에 지장 없는 범위에서 수강하도록 함; 시설 마련 원격수업에 필요한 통신장비·시설을 갖추도록 노력하여야 함</desc>
