<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">군의관 파견의 요청과 의무</title><desc id="desc">파견 요청 요건: 업무 수행 곤란 병역판정검사전담의사·전문의사만으로 신체검사업무 등을 수행하기 어렵다고 병무청장이 인정 / 병무청장: 요청할 수 있음 신체검사에 필요한 전문분야별 군의관의 파견을 국방부장관에게 요청 / 국방부장관: 파견하여야 함 요청을 받은 경우 군의관을 파견</desc>
