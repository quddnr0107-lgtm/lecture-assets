<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-002-D02 · 갑종·을종·병종을 구분하는 기준</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 02강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">갑종·을종·병종을 구분하는 기준</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사태별 발생 요건과 지휘·통제 주체를 함께 비교</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">병종사태</text>
<path d="M80 372L256.625 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">발생 요건</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적의 침투·도발 위협이 예상되거나 소규모의 적이</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">침투</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">치안 회복</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">단기간 내 치안질서 회복이 가능한 경우</text>
<path d="M80 764L80 878" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="799" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">지휘·통제</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도경찰청장, 지역군사령관 또는 함대사령관</text>
<text x="80" y="948" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 958L314.21875 958" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">을종은 단기간 회복이 어렵고, 병종은 단기간 회복이</text>
<text x="80" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">가능하다.</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1170L285.046875 1170" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1244" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">세 사태의 정의를 비교한 것으로,</text>
<text x="80" y="1305" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">병종→을종→갑종의 자동 전환 절차가 아니다.</text>
<text x="80" y="1386" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지휘·통제 주체의 구체적 관할과 기준은 법</text>
<text x="80" y="1447" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제15조에서 별도로 확인한다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제2조 · TB-002-D02 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
