<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">소대급의 기준은 직장예비군 자원이 있다는 것이며, 설치는 원하는 경우에 가능하다.</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">의무·선택 설치 조건과 구성 관계를 나타내며 순차적 절차가 아니다. 직장협의회의 범위·운영은 법 제6조제2항에 따라 대통령령으로 정한다.</text>
