<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">허가 대상은 허가 금지 / 25세 미만 미소집자는 여행제한 조치</text>
