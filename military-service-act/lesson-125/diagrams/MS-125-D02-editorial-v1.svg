<title id="title">보험료 지원에서 제외되는 기간</title><desc id="desc">상근예비역: 현역복무 상근예비역 소집 전 현역복무기간 제외; 미산입 기간 법 제23조제6항에 따라 복무기간에 산입하지 않는 기간 제외 / 사회·대체복무: 사회복무요원 군사교육소집·복무기간 미산입·분할복무 중단 기간 제외; 대체복무요원 대체역법 제18조제2항의 복무기간 미산입 기간 제외</desc>
