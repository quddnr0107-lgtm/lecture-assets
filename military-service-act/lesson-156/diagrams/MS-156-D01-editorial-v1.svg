<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">예비군대체복무의 복무의무 위반</title><desc id="desc">이탈·업무 불이행: 복무·근무장소 이탈 정당한 사유 없는 복무이탈 또는 허가 없는 무단 근무장소 이탈; 업무 불이행·지연 정당한 사유 없이 맡은 대체업무를 수행하지 않거나 지연 / 방해·정치운동: 근무 방해·태만 선동 다른 사람의 근무를 방해하거나 근무태만 선동; 정치운동 복무 중 조직적인 정치운동에 관여</desc>
