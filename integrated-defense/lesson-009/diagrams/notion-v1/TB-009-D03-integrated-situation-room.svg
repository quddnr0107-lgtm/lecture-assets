<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">종합상황실은 두 상황실의 결합이며, 합동상황실은 설치·운영의 별도 기준을 따른다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">분리 설치 시 군부대 또는 국가경찰관서 중 가장 효과적인 장소를 선택한다. 통합 설치는 하나의 장소에 설치할 수 있다는 허용 규정이다. 화살표는 기타</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">운영사항의 결정 절차를 뜻한다. 나머지 항목은 분류이다.</text>
