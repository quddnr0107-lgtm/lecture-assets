<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">확인신체검사의 대상과 절차</title><desc id="desc">대상 확인: 지방병무청장 질병·심신장애 4~7급 처분자 또는 법정 병역처분변경·면제자 / 사실 조사: 기록·면담 감면 목적 속임수 등 영 제155조의2제1항 사유가 있으면 사실관계 조사 / 검사 실시: 필요 인정 확인신체검사가 필요하다고 인정되면 실시하여야 함 / 판정·소명: 당시 기준 적용 병역처분 당시 신체등급 기준 적용. 의심자에게 소명기회, 인정 시 고발</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-124</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">확인신체검사의 대상과 절차</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">감면 목적의 속임수 등 법정 사유를 조사</text>
