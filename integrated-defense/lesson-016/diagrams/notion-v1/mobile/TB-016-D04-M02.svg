<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-016-D04 · 작전지역 검문의 요건과 설명</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 16강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">작전지역 검문의 요건과 설명</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제15조제5항 · 시행령 제26조 | 작전임무수행자의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정지·질문·동행 요구</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">설명 의무</text>
<path d="M80 433L270.0625 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">질문·동행 때</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">신분·소속·직책·성명을 밝히고 질문·동행의</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">목적과 이유 설명</text>
<path d="M80 680L80 794" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">동행 요구 시</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">동행할 장소를 밝혀야 함</text>
<text x="80" y="864" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 874L314.21875 874" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="928" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">검문에는 대상 요건이 있으며, 질문·동행 요구에는</text>
<text x="80" y="989" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">신분과 목적·이유를 밝히는 의무가 따른다.</text>
<text x="80" y="1076" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1086L285.046875 1086" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제15조제5항에 따른 작전지역 안의 필요한 검문을</text>
<text x="80" y="1221" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">요약한 도식이다.</text>
<text x="80" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">동행 요구 가능이라는 문언을 강제 체포나 임의의</text>
<text x="80" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">구금 권한으로 확대하지 않는다.</text>
<text x="80" y="1444" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">흉기·총기 조사는 질문 시 할 수 있다. 일률적인 모든</text>
<text x="80" y="1505" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">물품 수색으로 표현하지 않는다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제15조 · TB-016-D04 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
