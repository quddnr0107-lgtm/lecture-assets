<title id="title">07 Notion Editorial — 지역협의회 심의사항</title><desc id="desc">Notion 공식 소개 페이지의 문서 중심 구성과 흑백 일러스트에서 해석한 종이 편집형 도식. 통합방위법 제5조제3항의 지역협의회 공통 네 사항과 시·도 협의회에 한정된 두 사항을 비교한 디자인 시안.</desc>
