<text x="520" y="637.6666666666666" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">공익상 필요성·근무조건 등을 조사하여 기관·분야·형태별</text>
<text x="520" y="690.6666666666666" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">배정인원 결정 후 병무청장에게 보고</text>
<rect x="76" y="779.3333333333333" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="816.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">03</text>
<text x="164" y="815.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">4월 20일까지</text>
<text x="1520" y="805.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">영 제49조①</text>
<text x="520" y="805.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">지방병무청장</text>
<text x="520" y="861.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">배정 결과를 복무기관의 장에게 통보</text>
