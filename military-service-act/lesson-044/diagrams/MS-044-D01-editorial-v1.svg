<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무요원 복무기간 기준</title><desc id="desc">기간과 해제 보류: 법정 복무기간 사회복무요원의 복무기간은 2년 2개월; 소집해제 보류 현역병 전역 보류 중 법 제18조제4항제1호의 형사사건 구속 관련 규정을 준용 / 산입하지 않는 일수: 형의 집행일수 징역·금고 또는 구류의 형을 받은 경우 그 집행일수; 복무이탈일수 복무를 이탈한 경우 그 이탈일수</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-044</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">사회복무요원 복무기간 기준</text>
