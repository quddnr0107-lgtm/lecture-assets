<title id="title">신분 박탈 전 청문</title><desc id="desc">판단 대상: 법 제34조의3 병역판정검사전담의사의 신분을 박탈하려는 경우. / 청문 실시: 병무청장 신분을 박탈하려면 청문을 하여야 한다. / 처분 단계: 청문 후 판단 청문을 거쳐 신분 박탈 여부를 판단한다.</desc>
