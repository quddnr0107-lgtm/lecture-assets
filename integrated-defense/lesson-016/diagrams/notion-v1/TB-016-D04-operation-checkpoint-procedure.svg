<path d="M575.3333333333333 378 C620.4692708333332 383 673.1278645833332 375 725.7864583333333 379" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M595.3333333333333 411 Q575.3333333333333 411 575.3333333333333 433 L575.3333333333333 815 Q575.3333333333333 837 595.3333333333333 837" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="607.3333333333333" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">요구 조건</text>
<text x="607.3333333333333" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">현장 질문이 상대에게 불리하거나</text>
<text x="607.3333333333333" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">교통·통합방위작전에 지장을</text>
<text x="607.3333333333333" y="573" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">준다고 인정될 때</text>
<text x="607.3333333333333" y="670" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">동행 장소</text>
<text x="607.3333333333333" y="718" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">질문을 위해 가까운</text>
<text x="607.3333333333333" y="760" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">검문소·군부대·국가경찰관서로</text>
<text x="607.3333333333333" y="802" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">동행 요구 가능</text>
