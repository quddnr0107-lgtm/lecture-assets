<text x="128" y="630" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">학위 취득 후 해당 분야 3년 이상 경력</text>
<circle cx="98" cy="696" r="5" fill="#25241F"/>
<text x="128" y="706" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">중앙행정기관의 장이</text>
<text x="128" y="748" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">임기제공무원으로 임용</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">추천 → 유보 결정</text>
