<text x="80" y="713.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">03</text>
<text x="164" y="712.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">위탁징수</text>
<text x="1520" y="702.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제95조⑦</text>
<text x="520" y="702.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">이의 없이 미납</text>
<text x="520" y="758.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">이의를 제기하지 않고 납부하지 않으면 관할 세무서장에게</text>
<text x="520" y="811.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">위탁하여 징수</text>
