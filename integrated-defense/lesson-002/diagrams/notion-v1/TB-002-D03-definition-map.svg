<text x="112" y="548" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="start">일원화하여 국가를 방위</text>
<text x="112" y="630.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">통합방위작전</text>
<text x="112" y="672.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="start">사태 선포지역에서 법 제15조에 따라</text>
<text x="112" y="707.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="start">국가방위요소를 통합·지휘·통제하는 작전</text>
<text x="112" y="790.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">지역군사령관</text>
<text x="112" y="832.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="start">본부장이 관할구역 군부대의 장성급</text>
<text x="112" y="867.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="start">지휘관 중 정함. 필요시 대령급 가능</text>
