<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">계획감사와 불시감사의 통보</title>
<desc id="desc">RL-030 예비군법 시행령 제30조·제31조와 시행규칙 제30조부터 제38조까지, 예비군 감사와 표창. 시행규칙 제34조제3항·제4항</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F4F4" stroke="none"/>
<rect x="64" y="38" width="7" height="29" rx="3" fill="#275AA3" stroke="none"/>
<text x="87" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#275AA3" text-anchor="start">제80회  ·  예비군법</text>
<text x="1536" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#545860" text-anchor="end">주체·기준 비교</text>
<text x="64" y="142" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="52" font-weight="700" fill="#202124" text-anchor="start">계획감사와 불시감사의 통보</text>
<text x="67" y="190" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#545860" text-anchor="start">시행규칙 제34조제3항·제4항</text>
<rect x="64" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="64" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="64" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="106" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">계획감사</text>
<text x="106" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">사전 통보</text>
<text x="106" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">감사계획을 감사대상기관에 미리 통보하여 수감</text>
<text x="106" y="479" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">준비 후 실시</text>
<line x1="106" y1="513" x2="742" y2="513" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="106" y="555" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">계획 변경</text>
<text x="106" y="601" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">이미 통보한 계획이 바뀌면 변경내용도 미리</text>
<text x="106" y="645" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">통보하여야 함</text>
<rect x="816" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="816" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="816" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="858" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">불시감사</text>
<text x="858" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">통보 여부</text>
<text x="858" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">감사대상기관 및 감사내용을 미리 통보하지 않음</text>
<line x1="858" y1="469" x2="1494" y2="469" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="858" y="511" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">실시 방식</text>
<text x="858" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">불시에 실시</text>
<rect x="64" y="760" width="1472" height="77" rx="12" fill="#E6EDF7" stroke="none"/>
<rect x="64" y="760" width="6" height="77" rx="3" fill="#275AA3" stroke="none"/>
<text x="92" y="807" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#275AA3" text-anchor="start">계획감사는 계획과 변경내용을 미리 알리고, 불시감사는 예고하지 않는다.</text>
<text x="66" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#545860" text-anchor="start">예비군법 시행령 제30조·제31조와 시행규칙 제30조부터 제38조까지</text>
<text x="1536" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#545860" text-anchor="end">RL-030  ·  12 / 17</text>
</svg>
