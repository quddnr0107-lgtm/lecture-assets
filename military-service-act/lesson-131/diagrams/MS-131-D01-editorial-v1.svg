<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">장병내일준비적금의 정부지원</title><desc id="desc">지원 대상·액수: 가입 대상 현역병·상근예비역·사회복무요원·대체복무요원 및 전환복무자; 입금액의 100% 입금일부터 만기일 전날까지 입금액의 100%에 해당하는 재정지원금 / 만기·중도해지: 만기 전 전역 계약 만기 전에 전역하는 경우 복무기간 종료일을 만기일로 봄; 중도해지 계약 만기일 전에 해지하면 재정지원금을 지원하지 않음</desc>
