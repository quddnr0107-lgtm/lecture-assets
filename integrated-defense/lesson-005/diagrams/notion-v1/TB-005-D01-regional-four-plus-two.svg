<text x="981.1666666666666" y="505" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">적이 침투하거나 숨어서 활동하기 쉬운</text>
<text x="981.1666666666666" y="553" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">취약지역의 선정 또는 해제</text>
<text x="981.1666666666666" y="656" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">3호 · 을종·병종</text>
<text x="981.1666666666666" y="710" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">을종사태 및 병종사태의 선포 또는 해제</text>
