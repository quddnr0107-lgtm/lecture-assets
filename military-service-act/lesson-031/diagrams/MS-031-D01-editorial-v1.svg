<text x="888" y="743.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">예비역 부사관</text>
<text x="888" y="799.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">고교 이상 학교의 해군 학군</text>
<text x="888" y="852.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">부사관후보생 과정 수료 후 현역 부사관</text>
<text x="888" y="905.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">병적에 편입되지 않은 사람</text>
