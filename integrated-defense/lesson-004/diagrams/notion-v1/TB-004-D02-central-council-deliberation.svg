<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">중앙협의회의 사태 심의에는 선포와 해제가 모두 포함된다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">오른쪽 3개 사항은 법 제4조제4항제4호를 구체화한 내용이며 법의 별도 제5~7호가 아니다. 심의사항의 포함 관계를 나타내며, 협의회가 직접 사태를</text>
