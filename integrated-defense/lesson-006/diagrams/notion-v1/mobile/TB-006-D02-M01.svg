<path d="M80 1205L80 1380" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1240" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">설치 조건</text>
<text x="104" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">같은 산업단지의 직장예비군 자원을 통합해 예비군</text>
<text x="104" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">부대를 편성하면 설치 가능</text>
<path d="M80 1411L80 1525" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1446" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">의장</text>
<text x="104" y="1508" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해당 산업단지를 관리하는 대표자</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제6조 · TB-006-D02 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
