<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-016-D01 · 관할구역과 작전지휘관</title><desc id="desc">법 제15조 | 통합방위사태 선포 시 즉시 신속하게 작전 수행 지상 · 관할별 기본：경찰관할지역 시도경찰청장；군·특정경비 군관할지역·특정경비지역: 지역군사령관 해상·공중 · 관할별 기본：해상 특정경비해역·일반경비해역: 함대사령관；공중 비행금지공역·일반공역: 공군작전사령관이 통합방위 지원작전 수행 갑·을종 예외와 세부 결정：을종사태 지역군사령관이 통합방위작전 수행；갑종사태 통합방위본부장 또는 지역군사령관이 통합방위작전 수행；세부 구역 범위·시행사항: 실무위원회 심의 → 통합방위본부장이 정함 이 도식은 평시 지휘계통이 아니라 통합방위사태 선포 시 법 제15조제2항의 작전 수행 체계이다. 공군작전사령관의 법정 임무는 통합방위 지원작전으로 표시한다. 세부 구역의 화살표는 심의 후 결정 절차이며, 실무위원회가 최종 결정권자는 아니다.</desc>
