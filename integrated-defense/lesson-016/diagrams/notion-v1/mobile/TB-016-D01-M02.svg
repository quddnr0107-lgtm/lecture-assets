<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-016-D01 · 관할구역과 작전지휘관</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 16강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">관할구역과 작전지휘관</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제15조 | 통합방위사태 선포 시 즉시 신속하게</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전 수행</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">갑·을종 예외와 세부 결정 (계속)</text>
<path d="M80 433L725.78125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">갑종사태</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장 또는 지역군사령관이 통합방위작전</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">수행</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">세부 구역</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">범위·시행사항: 실무위원회 심의 →</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장이 정함</text>
<text x="80" y="925" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 935L314.21875 935" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="989" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">관할별 지휘관을 기본으로 하되, 을종은</text>
<text x="80" y="1050" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">지역군사령관, 갑종은 통합방위본부장 또는</text>
<text x="80" y="1111" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">지역군사령관이다.</text>
<text x="80" y="1198" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1208L285.046875 1208" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1282" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">이 도식은 평시 지휘계통이 아니라 통합방위사태</text>
<text x="80" y="1343" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">선포 시 법 제15조제2항의 작전 수행 체계이다.</text>
<text x="80" y="1424" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">공군작전사령관의 법정 임무는 통합방위</text>
<text x="80" y="1485" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지원작전으로 표시한다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제15조 · TB-016-D01 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
