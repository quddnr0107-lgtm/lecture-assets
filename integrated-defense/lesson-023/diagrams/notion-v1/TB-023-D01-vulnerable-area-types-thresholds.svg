<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-023-D01 · 취약지역 대상과 지형 수치</title><desc id="desc">법률의 선정 대상에 시행령의 지형 기준을 함께 적용 선정 대상 4유형：오지·벽지 교통·통신시설 낙후로 즉각적인 통합방위작전이 어려운 지역；침투·은거 지역 간첩·무장공비 침투 사실이 있거나 숨어 활동하기 쉬운 지역；탁 트인 곳·호수 적의 저공 침투 또는 저속 항공기 착륙이 쉬운 지역；해역·해안·섬 시행령이 추가한, 적의 침투 또는 은거 활동이 쉬운 지역 탁 트인 곳·호수의 공통 규모：폭 30m 이상 폭이 30미터 이상；길이 250m 이상 길이 방향 앞뒤에 장애물이 없으면 200미터 이상 지형별 추가 기준：탁 트인 곳 경사 정방향 12도 이내 / 좌·우측 방향 5도 이내；호수 수심 80센티미터 이상 지형 수치 기준은 법 제22조제1항제3호의 탁 트인 곳·호수에 해당한다.</desc>
