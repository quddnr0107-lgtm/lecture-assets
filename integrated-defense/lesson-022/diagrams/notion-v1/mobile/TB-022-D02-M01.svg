<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-022-D02 · 자체방호와 지원계획의 결합</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 22강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">자체방호와 지원계획의 결합</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관리자·경찰·군은 계획을 세우고 역할을 나누며</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작성·변경 사실을 공유</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">관리자: 자체방호</text>
<path d="M80 433L415.578125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">통합 자원</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">청원경찰·특수경비원·직장예비군·직장민방위대</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">등과 장애물·감시장비</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">교육·훈련</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관리자·특수경비업자 책임의 직무교육 및 개인화기</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">실제 사격훈련 포함</text>
<path d="M80 886L80 1000" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="921" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">상황·통신</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">자체방호를 위한 통합상황실과 지휘·통신망 구성</text>
<text x="80" y="1070" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">경찰·군: 방호지원</text>
<path d="M80 1080L444.0 1080" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1121L80 1235" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1156" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">통합 요소</text>
<text x="104" y="1218" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군·경찰·예비군·민방위대 등 국가방위요소 통합</text>
<path d="M80 1266L80 1380" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1301" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">경찰 계획</text>
<text x="104" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경찰서 단위의 방호지원계획 수립·시행</text>
