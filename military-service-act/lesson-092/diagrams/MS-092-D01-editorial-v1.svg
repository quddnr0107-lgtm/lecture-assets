<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">군사교육소집의 검사와 복무</title><desc id="desc">특정 대상의 검사: 적용 대상 제55조제1항 단서 또는 제2항에 따라 소집된 예비역·보충역·전시근로역.; 병력동원 규정 준용 입영신체검사·귀가에는 법 제47조를 준용한다. / 치환·처우: 7일 이상 치유 준용되는 제47조의 15일 이상 치유기간을 7일 이상 치유기간으로 본다.; 현역과 같이 군사교육소집으로 입영한 사람의 복무와 처우는 현역의 경우와 같이 한다.</desc>
