<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">7개 항목 중 경찰기관은 하나의 항목이며, 직장은 법 제6조의 해당 직장이다.</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">세 묶음은 학습을 위한 편집상 구분이며 법의 별도 분류가 아니다. 구성 관계를 나타내며 조직 간 지휘·보고 관계를 뜻하지 않는다.</text>
