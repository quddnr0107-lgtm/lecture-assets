<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" lang="ko" role="img"><title>37세 허가 간주의 다섯 경우</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-109</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 L1520 105" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">37세 허가 간주의 다섯 경우</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시행령 제149조 · 원고의 법정 사유 요약</text>
<path d="M80 280 L1520 280" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">본인 또는 부모의 자격 등</text>
<path d="M80 389 Q230 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="98" cy="436" r="5" fill="#25241F"/>
<text x="128" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">01  영주권 또는 장기 체류자격</text>
<text x="128" y="488" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">취득 후 계속 거주</text>
<circle cx="98" cy="544" r="5" fill="#25241F"/>
<text x="128" y="554" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">02  일본 특별영주자·영주자 자격</text>
<circle cx="98" cy="620" r="5" fill="#25241F"/>
<text x="128" y="630" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">03  외국 출생 후 해당 국가 국적 취득</text>
<text x="128" y="672" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">부모와 함께 거주</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">이주·부모 동반</text>
<path d="M840 389 Q990 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="858" cy="436" r="5" fill="#25241F"/>
<text x="888" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">04  해외이주법에 따라 이주·거주</text>
<circle cx="858" cy="512" r="5" fill="#25241F"/>
<text x="888" y="522" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">05  18세 전 국외 주재원이 아닌</text>
<text x="888" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">부모와 출국, 그 부모와 계속 거주</text>
<circle cx="858" cy="620" r="5" fill="#25241F"/>
<text x="888" y="630" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">공통</text>
<text x="888" y="672" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">18세 전부터 국외 거주</text>
<text x="888" y="714" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">25세 전에 법정 사유 해당</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">37세까지 허가 간주 / 국외 주재원이 아닌 부모라는 조건에 주의</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
