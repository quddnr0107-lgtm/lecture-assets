<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-004-D02 · 중앙협의회가 심의하는 사항</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 04강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">중앙협의회가 심의하는 사항</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법의 4개 호와, 제4호가 위임한 시행령의 3개 사항</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">시행령 제6조 · 제4호의 내용 (계속)</text>
<path d="M80 372L790.75 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">위원 제출 안건</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">그 밖에 중앙협의회 위원이 제출하는 안건</text>
<text x="80" y="597" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 607L314.21875 607" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="661" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">중앙협의회의 사태 심의에는 선포와 해제가 모두</text>
<text x="80" y="722" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">포함된다.</text>
<text x="80" y="809" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 819L285.046875 819" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="893" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">오른쪽 3개 사항은 법 제4조제4항제4호를 구체화한</text>
<text x="80" y="954" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">내용이며 법의 별도 제5~7호가 아니다.</text>
<text x="80" y="1035" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">심의사항의 포함 관계를 나타내며, 협의회가 직접</text>
<text x="80" y="1096" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사태를 선포한다는 뜻이 아니다.</text>
<text x="80" y="1183" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1193L270.0625 1193" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1267" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제4조제4항</text>
<text x="80" y="1348" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제6조</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제4조 · TB-004-D02 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
