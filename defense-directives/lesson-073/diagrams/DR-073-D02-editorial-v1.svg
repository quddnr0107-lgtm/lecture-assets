<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">예비역 군의관과 의사 출신 보충역을 활용할 수 있다.</text>
