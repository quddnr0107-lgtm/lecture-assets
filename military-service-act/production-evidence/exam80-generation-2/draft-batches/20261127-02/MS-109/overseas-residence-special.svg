Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">37세까지 허가 간주</text><text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">제5호 요건</text><path d="M840 386 Q940 394 1080 384 M865 429 Q849 429 849 451 V885 Q849 909 867 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/><text x="888" y="450" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">18세 전 출국</text><text x="888" y="494" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">주재원 아닌 부모와 동반</text><text x="888" y="570" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">이후</text><text x="888" y="614" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">부모와 계속 동거</text><text x="888" y="690" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">확인</text><text x="888" y="734" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">연금가입 자료 요청 가능</text><text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">영주귀국 등 취소 사유에 해당하면 간주 허가도 취소 가능</text><text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text><text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text></svg>
