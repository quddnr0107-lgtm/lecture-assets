name: Directive diagram targeted render
on:
  push:
    branches: [main]
    paths:
      - 'defense-directives/diagrams/targeted-render-request.json'
permissions:
  contents: write
concurrency:
  group: defense-directives-targeted-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape fonts-noto-cjk
          python -m pip install Pillow
      - name: Render and validate only requested directive diagrams
        run: python tools/render_directive_targeted.py
      - name: Publish validated assets without force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defense-directives
          git diff --cached --quiet && exit 0
          git commit -m 'Render exam80 directive script supplements'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
