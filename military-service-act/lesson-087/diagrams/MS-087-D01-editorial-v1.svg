<text x="164" y="368" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">입영 후 검사</text>
<text x="1520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제51조①</text>
<text x="520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">입영부대의 장</text>
<text x="520" y="414" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">입영한 날부터 2일 이내 신체검사를 하여야 한다.</text>
<rect x="76" y="543.6666666666667" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="580.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">02</text>
<text x="164" y="579.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">귀가 판단</text>
<text x="1520" y="569.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제51조②</text>
<text x="520" y="569.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">훈련 곤란</text>
<text x="520" y="625.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">질병 또는 심신장애로 병력동원훈련이 곤란하다고 인정되면</text>
<text x="520" y="678.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">귀가시킬 수 있다.</text>
<rect x="76" y="808.3333333333335" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="845.3333333333335" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">03</text>
<text x="164" y="844.3333333333335" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">후속 처리</text>
<text x="1520" y="834.3333333333335" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제51조③</text>
<text x="520" y="834.3333333333335" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">지방병무청장</text>
<text x="520" y="890.3333333333335" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">재소집하거나 그 해의 병력동원훈련소집을 면제할 수 있다.</text>
<line x1="80" y1="1052" x2="1520" y2="1052" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
