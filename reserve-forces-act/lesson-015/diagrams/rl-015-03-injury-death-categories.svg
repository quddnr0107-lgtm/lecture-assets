<text x="858" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">순직군경의 유족</text>
<line x1="858" y1="591" x2="1494" y2="591" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="858" y="633" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">직접 관련 없는 임무·훈련</text>
<text x="858" y="679" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">재해사망군경의 유족</text>
