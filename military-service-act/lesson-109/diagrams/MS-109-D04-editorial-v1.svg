<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>국외여행허가 신청 경로</title>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-109</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="62" font-weight="700" fill="#25241F" text-anchor="start">국외여행허가 신청 경로</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">출국 전과 25세 전 출국자</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z M1337 153 L1438 151 L1442 235 L1334 235 Z M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80 284 H1520 M800 334 V920 M80 1047 H1520" stroke="#DFDDD6" stroke-width="2" fill="none"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">출국 예정자</text>
<path d="M80 386 Q180 394 320 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M105 429 Q89 429 89 451 V885 Q89 909 107 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text x="128" y="452" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">출국 예정일 2일 전까지</text>
<text x="128" y="496" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">병무청장에게 신청서 제출</text>
<text x="128" y="536" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">전자문서 포함</text>
<text x="128" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">출국 전 허가기간 변경</text>
<text x="128" y="642" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">지방병무청장에게</text>
<text x="128" y="682" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">국외여행기간 연장허가 신청</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">25세 전에 출국한 사람</text>
<path d="M840 386 Q940 394 1080 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M865 429 Q849 429 849 451 V885 Q849 909 867 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text x="888" y="452" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">25세가 되는 해 1월 15일까지</text>
<text x="888" y="496" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">재외공관의 장을 거쳐</text>
<text x="888" y="536" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">병무청장에게 신청서 제출</text>
<text x="888" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">직접 신청 가능</text>
<text x="888" y="642" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">국외이주·국외취업 외 사유는</text>
<text x="888" y="682" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">재외공관을 거치지 않을 수 있음</text>
<text x="888" y="744" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">허가받은 것으로 보는 경우</text>
<text x="888" y="788" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">병역준비역 편입 전 해외이주신고</text>
<text x="888" y="828" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">후 잠시 귀국했다가 재출국</text>
<path d="M80 958 H1520" stroke="#DFDDD6" stroke-width="2"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">처음 신청 2일 전  /  25세 전 출국자는 1월 15일</text>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
