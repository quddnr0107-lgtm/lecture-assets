<text x="104" y="883" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">본부장에 통보</text>
<text x="104" y="945" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">선정·해제 결과를 통합방위본부장에게 통보하여야</text>
<text x="104" y="1006" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">함</text>
<text x="80" y="1093" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">특례: 통합방위본부장</text>
<path d="M80 1103L503.890625 1103" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1144L80 1319" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1179" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">광역·국가 필요</text>
<text x="104" y="1241" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">둘 이상의 시·도에 걸치거나 국가적 통합방위</text>
<text x="104" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대비책이 필요한 지역</text>
