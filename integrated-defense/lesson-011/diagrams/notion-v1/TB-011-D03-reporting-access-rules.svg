<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">허용지역 안의 취재 보장에도 작전 지장 시 제한 가능이라는 예외가 있다. 대표자 수를 1명으로만 고정하지 않는다. 세 섹션은 상황별 기준이며, 허용지역</text>
