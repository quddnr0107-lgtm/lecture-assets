<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">복직보장의 원칙과 예외</title><desc id="desc">휴직 → 복직: 복무 시작 입영하거나 승선근무예비역·보충역·대체복무요원 복무 시 휴직; 복무 종료 복무를 마치면 복직시켜야 함; 본인의 신고 통지서 수령 및 전역·소집해제·복무만료·면제 시 소속기관 등에 신고 / 적용에서 제외: 재직하며 복무 해당 기관에 재직하면서 승선근무예비역·보충역 복무를 하는 사람; 복무 중 범죄 범죄행위로 제적·전역 또는 소집해제된 경우 복직보장 예외</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-113</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">복직보장의 원칙과 예외</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">국가기관·지방자치단체의 장 또는 고용주</text>
