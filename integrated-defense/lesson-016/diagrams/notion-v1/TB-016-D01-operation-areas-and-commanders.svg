<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">관할별 지휘관을 기본으로 하되, 을종은 지역군사령관, 갑종은 통합방위본부장 또는 지역군사령관이다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">이 도식은 평시 지휘계통이 아니라 통합방위사태 선포 시 법 제15조제2항의 작전 수행 체계이다. 공군작전사령관의 법정 임무는 통합방위 지원작전으로</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">표시한다. 세부 구역의 화살표는 심의 후 결정 절차이며, 실무위원회가 최종 결정권자는 아니다.</text>
