<text x="92" y="807" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#275AA3" text-anchor="start">제9조는 대상자 지위, 제8조의2 관련 금액·절차는 군인 재해보상법을 준거로 한다.</text>
