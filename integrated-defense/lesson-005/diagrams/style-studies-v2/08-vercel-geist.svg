<title id="title">08 Vercel Geist — 지역협의회 심의사항</title><desc id="desc">Geist의 높은 명암 대비, 가는 격자선, 정밀한 모듈 구성에서 착안한 도식. 통합방위법 제5조제3항의 지역협의회 공통 네 사항과 시·도 협의회에 한정된 두 사항을 비교한 디자인 시안.</desc>
