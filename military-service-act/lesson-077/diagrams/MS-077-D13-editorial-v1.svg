<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>편입취소 사유 여덟 가지</title>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-077</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="60" font-weight="700" fill="#25241F" text-anchor="start">편입취소 사유 여덟 가지</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">관할 지방병무청장 · 편입취소 의무</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z M1337 153 L1438 151 L1442 235 L1334 235 Z M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80 284 H1520 M800 334 V920 M80 1047 H1520" stroke="#DFDDD6" stroke-width="2" fill="none"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">부정 · 연령 · 복무</text>
<path d="M80 386 Q255 394 430.99999999999994 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M105 429 Q89 429 89 451 V885 Q89 909 107 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text x="128" y="450" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제1·2호  부정</text>
<text x="128" y="494" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">제38조의2 위반 부정 편입·전직</text>
<text x="128" y="534" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">금품 수수 등 부정 편입·전직</text>
<text x="128" y="574" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">(제1호 해당 제외)</text>
<text x="128" y="640" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제3호  연령</text>
<text x="128" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">35세까지 복무 완료 불가</text>
<text x="128" y="724" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">법정 예외는 37세</text>
<text x="128" y="790" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제4호  신상변동</text>
<text x="128" y="834" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">제40조 제1~4호 및 제7호</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">복무 · 국외</text>
<path d="M840 386 Q952 394 1063 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M865 429 Q849 429 849 451 V885 Q849 909 867 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text x="888" y="450" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제5·6호  복무 불이행</text>
<text x="888" y="494" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">정당한 사유 없는 군사교육 미수</text>
<text x="888" y="534" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">정해진 전직 기간 안에 미전직</text>
<text x="888" y="600" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제7호  국외여행</text>
<text x="888" y="644" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">허가 없이 출국·체재</text>
<text x="888" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">정당한 사유 없이 기간 내 미귀국</text>
<text x="888" y="750" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제8호  귀국명령</text>
<text x="888" y="794" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">귀국명령 위반 후 미귀국</text>
<path d="M80 958 H1520" stroke="#DFDDD6" stroke-width="2"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">해고 다툼의 유보·업체 지시의 연장 예외는 별도 도식과 함께 확인</text>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-077 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
