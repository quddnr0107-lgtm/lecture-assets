<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">현역병 선발과 재외공관 위임</title><desc id="desc">지방병무청장·지청장: 선발 전형 신체·체력검사, 면접·실기·필기·서류심사 등. 선발 결정권은 제외; 그 밖의 위임 선발취소 허가, 국외여행허가, 과태료 부과·징수 등 / 재외공관장: 국외 자원 관리 병역의무자 조사·관리, 연장허가 신청 접수·송부·결과 통보, 귀국조치 등; 병무 담당직원 소속 공무원 중 지정. 지정하거나 교체하면 병무청장에게 통보</desc>
