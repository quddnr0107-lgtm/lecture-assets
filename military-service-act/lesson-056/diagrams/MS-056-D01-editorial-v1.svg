<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">예술·체육요원 편입의 흐름</title><desc id="desc">추천 신청: 희망자 추천원서와 입상 확인서 등 필요한 서류를 문화체육관광부장관에게 제출한다. / 추천 통보: 14일 이내 문화체육관광부장관은 원서를 받은 날부터 14일 이내 추천자 명단을 병무청장에게 통보한다. / 편입 결정: 병무청장 법정 대상자 중 예술·체육 특기를 갖추고 추천받은 사람을 예술·체육요원으로 편입할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-056</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">예술·체육요원 편입의 흐름</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">특기 요건과 추천을 거쳐 병무청장이 편입</text>
