<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-006-D01 · 직장협의회, 언제 두어야 하는가</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 06강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">직장협의회, 언제 두어야 하는가</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의무 설치 2개 유형과 원하는 경우의 설치를 구분</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">두어야 하는 직장</text>
<path d="M80 372L415.96875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">중대급 이상</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">중대급 이상의 예비군 부대가 편성된 직장</text>
<path d="M80 558L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">국가중요시설</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제21조제4항에 따라 지정된 국가중요시설인</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직장</text>
<text x="80" y="803" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">원하면 둘 수 있는 직장</text>
<path d="M80 813L531.15625 813" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 854L80 968" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="889" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">소대급 자원</text>
<text x="104" y="951" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">소대급의 직장예비군 자원이 있는 직장</text>
<text x="80" y="1038" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">의장과 위원</text>
<path d="M80 1048L314.21875 1048" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1089L80 1203" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1124" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">의장</text>
<text x="104" y="1186" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직장의 장</text>
<path d="M80 1234L80 1348" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1269" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">예비군 부대장</text>
<text x="104" y="1331" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해당 직장예비군 부대의 장이 위원이 됨</text>
<path d="M80 1379L80 1493" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1414" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">직장 간부</text>
<text x="104" y="1476" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해당 직장의 간부 중 의장이 지명하는 사람</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제6조 · TB-006-D01 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
