<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-012-D02 · 경계태세별 작전통제와 협조</title><desc id="desc">시행령 제23조 | 1급은 관할별 통제, 2·3급은 상호 협조 1급 · 지상：경찰관할지역 시도경찰청장이 지역군사령관에게 위임받은 군 작전요소 통제；군관할지역 지역군사령관이 시도경찰청장에게 위임받은 경찰 작전요소 통제；특정경비지역 지역군사령관이 해당 지역의 모든 국가방위요소 통제 1급 · 해상·지원：관할해역 함대사령관이 특정·일반 경비해역의 해양경찰 통제；입출항 기관 해안경계 부대장이 입출항 신고기관 근무 해양경찰 통제；지역 지원 지자체장·읍면동장은 각 지원본부를 통해 작전 지원 2·3급과 평시：2·3급 국가방위요소가 상호 협조하여 적의 침투·도발에 대비；평시 계획 지역군·시도경찰·함대·지방해경 지휘관은 연계된 작전계획 수립 이 도식의 통제는 작전통제를 뜻하며, 조직 전체의 일반 행정지휘를 뜻하지 않는다. 평시 계획 수립 주체의 정식 명칭: 지역군사령관, 시도경찰청장, 함대사령관, 지방해양경찰청장. 영 제23조의 경계태세 1급과 영 제25조의 통합방위사태 병종은 통제 대상이 다르다.</desc>
