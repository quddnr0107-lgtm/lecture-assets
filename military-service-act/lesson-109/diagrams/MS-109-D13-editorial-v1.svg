<text x="888" y="554" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">추천자 명단과 임용발령서 사본</text>
<text x="888" y="596" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">재직 분야·임기가 구체적으로 기재</text>
<circle cx="858" cy="652" r="5" fill="#25241F"/>
<text x="888" y="662" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">병무청장이 유보 여부 결정·통보</text>
<circle cx="858" cy="728" r="5" fill="#25241F"/>
<text x="888" y="738" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">재직기간 동안 유보 가능</text>
<text x="888" y="780" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">제147조의2제1항제1호 다~마목 사유</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">경제 또는 과학기술 / 3년 이상 / 14일 / 임용발령서 (재직증명서 아님)</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
