<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">과태료의 부과·징수 절차</title><desc id="desc">부과·징수: 병무청장 대통령령에 따라 과태료를 부과·징수 / 대장 정리: 병무청장 부과하거나 징수한 내용을 과태료 부과 및 징수 대장에 기재·정리 / 위탁징수: 이의 없이 미납 이의를 제기하지 않고 납부하지 않으면 관할 세무서장에게 위탁하여 징수 / 서류 송부: 병무청장 위탁징수 시 관련 사실관계 서류를 관할 세무서장에게 송부</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
