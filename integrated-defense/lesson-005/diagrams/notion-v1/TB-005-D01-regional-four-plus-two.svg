<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">시·군·구의 4개 공통 심의사항에, 시·도는 1호·3호를 더하여 심의한다.</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">시·도만은 두 지역협의회 사이의 구분이다. 각 협의회가 독립적으로 심의한다. 취약지역의 선정·해제와 취약지역 대비책은 서로 다른 심의사항이다.</text>
