<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">공정병역심의위원회</title><desc id="desc">구성·통지: 7명 이내 위원장 1명 포함. 위원장은 병무청 소속 국장급, 위원은 과장급; 7일 전까지 위원장이 회의 일시·장소·안건 통지. 긴급한 경우 제외 / 심의·의결: 심의 사항 대상자 선정, 병역처분·처분과정 적정성 등 공정한 병적 관리; 회의 기준 재적위원 과반수 출석으로 개의, 출석위원 과반수 찬성으로 의결</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
