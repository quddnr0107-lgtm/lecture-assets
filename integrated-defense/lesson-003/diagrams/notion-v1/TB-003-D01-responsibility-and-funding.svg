<text x="1102.6666666666665" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">예비군 급식비</text>
<text x="1102.6666666666665" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">통합방위작전에 동원된 예비군의</text>
<text x="1102.6666666666665" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">급식비</text>
<text x="1102.6666666666665" y="628" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">그 밖의 비용</text>
<text x="1102.6666666666665" y="676" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">중앙협의회에서 의결한 비용</text>
<path d="M80 894 L1520 894" fill="none" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">정부의 동원비용 지원은 예산 범위에서 할 수 있는 지원이다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">중앙관서의 장은 소관업무와 대통령이 정하는 바에 따라 시책을 마련한다(시행령 제2조제1항). 지방자치단체장은 지역군사령관 및 시·도경찰청장 등과</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">협의하여 예규 작성 등 시책을 마련한다(시행령 제2조제2항). 주체별 의무와 지원 조건을 비교하며 시간 순서나 상하 지휘관계를 뜻하지 않는다.</text>
