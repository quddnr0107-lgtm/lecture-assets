<text x="607.3333333333333" y="633.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">시도협의회 심의</text>
<text x="607.3333333333333" y="702.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">해제·공고</text>
<text x="607.3333333333333" y="746.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">시도지사가 지체 없이 해제하고 공고해야 함</text>
<text x="607.3333333333333" y="815.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">해제 보고</text>
<text x="607.3333333333333" y="859.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">행안부장관 및 국방부장관과 국무총리를 거쳐</text>
<text x="607.3333333333333" y="897.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">대통령에게 보고</text>
