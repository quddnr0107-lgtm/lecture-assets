<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">을종은 단기간 회복이 어렵고, 병종은 단기간 회복이 가능하다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">세 사태의 정의를 비교한 것으로, 병종→을종→갑종의 자동 전환 절차가 아니다. 지휘·통제 주체의 구체적 관할과 기준은 법 제15조에서 별도로</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">확인한다.</text>
