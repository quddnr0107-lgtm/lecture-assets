<text x="520" y="752.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">각 군 참모총장</text>
<text x="520" y="808.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">적성에 적합한 병과 부여. 군사특기로 세분할 수 있고</text>
<text x="520" y="861.3333333333333" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">군사특기도 부여</text>
<line x1="80" y1="982" x2="1520" y2="982" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="84" y="1021" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#25241F" text-anchor="start">각 군 참모총장이 특별히 필요하다고 인정하면 병무청장에게 병과·군사특기 부여를 요청할 수 있습니다.</text>
