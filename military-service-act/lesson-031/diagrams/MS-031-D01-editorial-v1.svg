<text x="84" y="1021" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#25241F" text-anchor="start">병무청장은 군 충원에 지장이 없는 범위에서 편입인원과 업체별 배정인원을 결정합니다.</text>
