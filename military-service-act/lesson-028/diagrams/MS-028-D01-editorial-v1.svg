<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">임기제부사관 양성기관</title><desc id="desc">지정과 운영: 지정 대상 특정분야 인재양성 교육을 전문적으로 실시하는 초·중등교육법상 고등학교를 지정 가능; 비용 지원 교육·훈련 등에 필요한 비용의 전부 또는 일부를 지원할 수 있음; 운영성과 평가 대통령령으로 정하는 바에 따라 평가할 수 있음 / 지정 취소: 거짓·부정 지정 지정을 취소하여야 함; 평가 기준 미달 평점평균 2년 연속 80점 미만이고 국방부장관이 사업수행 곤란 판단 시 취소 가능; 청문 의무 지정을 취소하려면 청문을 하여야 함</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-028</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">임기제부사관 양성기관</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">국방부장관의 지정·지원·평가와 지정 취소</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
