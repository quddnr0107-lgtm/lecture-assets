<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-009-D03 · 종합상황실의 구성·설치·운영</title><desc id="desc">시행령 제14조~제16조 | 종합상황실과 군·경합동상황실을 구별 구성·설치：종합상황실 지원본부 상황실 + 군·경합동상황실；설치 원칙 군·경합동상황실은 각 지원본부에 설치；분리 설치 지휘·통신·협조와 지역 특성을 고려한 군부대·경찰관서에 설치；통합 설치 인접 2개 이상 시·군·자치구를 같은 군부대·경찰서가 관할하면 가능 운영：운영 시점 통합방위사태 선포 때 + 통합방위태세 확립을 위한 주요 훈련 때；합동실 책임 지역 작전책임 군부대의 장 또는 해당 지역 국가경찰관서장；기타 운영 지역협의회 심의 → 지역협의회 의장이 정함 분리 설치 시 군부대 또는 국가경찰관서 중 가장 효과적인 장소를 선택한다. 통합 설치는 하나의 장소에 설치할 수 있다는 허용 규정이다. 화살표는 기타 운영사항의 결정 절차를 뜻한다. 나머지 항목은 분류이다.</desc>
