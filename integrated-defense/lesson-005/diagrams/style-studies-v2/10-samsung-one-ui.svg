<title id="title">10 · Samsung One UI — 지역협의회 심의사항</title><desc id="desc">One UI 7의 원 기반 곡선, 선명한 정보 위계, 큼직한 위젯과 캡슐을 참고한 자체 디자인. 통합방위법 제5조제3항의 지역협의회 공통 네 사항과 시·도 협의회에 한정된 두 사항을 비교한 디자인 시안.</desc>
