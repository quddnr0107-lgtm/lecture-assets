<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">중앙·지역·직장협의회는 각각 대통령령 기준에 따라 통합·운영할 수 있다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">대상과 통합 상대의 관계를 나타내며, 모든 협의회를 한 조직으로 합치는 지휘체계도가 아니다. 이 도식은 법 제7조의 대상·상대·위임 구조를 다룬다.</text>
