<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">현역병 징집순서의 결정</title><desc id="desc">지방병무청장: 대상·단위 검사 결과 현역병입영 대상자로 처분된 사람의 징집순서를 시·군·구별로 결정; 명부 작성 징집순서를 정하면 현역병입영 대상자 명부를 작성·보관 / 병무청장: 기준 결정 징집순서 결정의 기준을 정함; 고려 요소 신체등급·학력·연령 등 자질을 고려</desc>
