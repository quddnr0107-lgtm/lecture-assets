<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-007-D01 · 협의회는 기준에 따라 통합·운영 가능</title><desc id="desc">통합 대상 · 상대 협의회 · 적용 기준의 구성 관계 대상 통합방위협의회：중앙협의회 중앙 통합방위협의회；지역협의회 시·도 및 시·군·구 통합방위협의회；직장협의회 직장 통합방위협의회 통합·운영의 상대：방위협의회 「예비군법」 제14조의3제2항에 따른 방위협의회；민방위협의회 「민방위기본법」 제6조 또는 제7조의 중앙·지역민방위협의회 적용 기준：각각 적용 중앙·지역·직장협의회가 각각 통합·운영하는 규정；대통령령 기준 대통령령으로 정하는 기준에 따름；할 수 있다 통합·운영을 허용하는 임의규정 대상과 통합 상대의 관계를 나타내며, 모든 협의회를 한 조직으로 합치는 지휘체계도가 아니다. 이 도식은 법 제7조의 대상·상대·위임 구조를 다룬다. 구체적인 기관별 결합 기준을 추가로 추론하지 않았다.</desc>
