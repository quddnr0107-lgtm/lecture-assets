<text x="84" y="235" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">법 제14조 | 평상 회복 경로와 의회 요구 경로를 구별</text>
