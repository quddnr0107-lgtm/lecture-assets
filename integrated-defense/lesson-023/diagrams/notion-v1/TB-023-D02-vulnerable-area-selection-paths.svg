<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-023-D02 · 취약지역 선정·해제의 두 경로</title><desc id="desc">선정권자·심의기구·결과 통보의 방향이 다름 일반: 시·도지사：연 1회 분석 법정 대상 지역을 연 1회 분석；시·도 협의회 시·도 협의회의 심의를 거침；선정·해제 시·도지사가 취약지역을 선정하거나 해제할 수 있음；본부장에 통보 선정·해제 결과를 통합방위본부장에게 통보하여야 함 특례: 통합방위본부장：광역·국가 필요 둘 이상의 시·도에 걸치거나 국가적 통합방위 대비책이 필요한 지역；실무위원회 통합방위 실무위원회의 심의를 거침；선정·해제 통합방위본부장이 취약지역을 선정하거나 해제할 수 있음；시·도지사 통보 선정·해제 결과를 관할 시·도지사에게 통보하여야 함 지역군사령관·함대사령관·시·도경찰청장은 매년 분석 결과를 시·도지사에게 통보한다. 시·도지사는 통보받은 내용과 자체분석 결과를 고려하여 심의를 거친다.</desc>
