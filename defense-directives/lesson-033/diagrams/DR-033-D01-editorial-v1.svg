<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">거주불명자의 통지 절차</title><desc id="desc">DR-033 · 조직·편성 훈령 제44조. 지역예비군과 직장예비군의 전달 불능 처리 경로를 구분한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-033</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">조직·편성·운영</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">거주불명자의 통지 절차</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">지역예비군과 직장예비군의 전달 불능 처리 경로를 구분한다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="1002" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">지역예비군</text>
<path d="M81 385 C165.017 391 233.841 381 297.422 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">소집통지서 전달이 불가능할 때</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2호가목1)가)</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">지휘관이 해당 읍·면·동장에게 거주불명</text>
<text x="144" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">등록을 의뢰한다.</text>
<text x="144" y="738.4" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2호가목1)가)</text>
<text x="144" y="780.4" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">결과를 관리대대장에게 제출·보고한다.</text>
<path d="M116 459 C96 459 92 466 92 485 L92 790.1 C92 813.1 102 822.1 117 822.1" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">직장예비군</text>
<path d="M844 341 C866 311 1015.2 307 1069.2 331 C1090.2 346 1076.2 381 1047.2 393 C956.602 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">직장 내 전달 불가능 시</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2호가목1)나) · 01</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">대원의 주소지로 등기우편(배달 증명)을</text>
<text x="860" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">보낸다.</text>
<text x="860" y="650.4" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2호가목1)나) · 02</text>
<text x="860" y="692.4" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">등기 송달도 불가능하면 주소지</text>
<text x="860" y="742.1" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">지역예비군지휘관에게 거주사실확인을</text>
<text x="860" y="791.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">의뢰한다.</text>
<text x="860" y="863.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2호가목1)나) · 03</text>
<text x="860" y="905.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">거주불명 결과를 관리대대장에게</text>
<text x="860" y="955.2" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">제출·보고한다.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제44조 · DR-033-D01</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
