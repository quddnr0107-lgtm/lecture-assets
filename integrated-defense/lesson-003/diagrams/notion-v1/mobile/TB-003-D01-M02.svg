<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-003-D01 · 시책·협조는 의무, 비용 지원은 재량</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 03강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">시책·협조는 의무, 비용 지원은 재량</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">책임 주체와 동원비용 지원의 조건·범위를 구분</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지원 비용 · 시행령 제4조 (계속)</text>
<path d="M80 372L718.28125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">그 밖의 비용</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">중앙협의회에서 의결한 비용</text>
<text x="80" y="597" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 607L314.21875 607" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="661" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">정부의 동원비용 지원은 예산 범위에서 할 수 있는</text>
<text x="80" y="722" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">지원이다.</text>
<text x="80" y="809" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 819L285.046875 819" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="893" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">중앙관서의 장은 소관업무와 대통령이 정하는 바에</text>
<text x="80" y="954" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">따라 시책을 마련한다(시행령 제2조제1항).</text>
<text x="80" y="1035" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지방자치단체장은 지역군사령관 및 시·도경찰청장</text>
<text x="80" y="1096" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">등과 협의하여 예규 작성 등 시책을 마련한다(시행령</text>
<text x="80" y="1157" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제2조제2항).</text>
<text x="80" y="1238" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">주체별 의무와 지원 조건을 비교하며 시간 순서나</text>
<text x="80" y="1299" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">상하 지휘관계를 뜻하지 않는다.</text>
<text x="80" y="1386" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1396L270.0625 1396" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1470" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제3조제1항~제4항</text>
<text x="80" y="1551" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제2조·제4조</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제3조 · TB-003-D01 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
