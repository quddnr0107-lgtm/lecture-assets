<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역처분사항 등의 통보</title><desc id="desc">누가 누구에게: 통보 주체 병무청장이 자료를 통보하여야 한다.; 받는 기관 행정안전부장관에게 통보한다. / 무엇을 통보하나: 병역처분사항 최초 처분과 변경처분사항을 모두 포함한다.; 입영·전역·소집해제 주민등록표 정리에 필요한 신상변동사항에 관한 자료를 통보한다.</desc>
