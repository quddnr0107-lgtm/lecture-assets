<title id="title">TB-018-D01 · 대피구역 결정과 명령 집행</title><desc id="desc">통합방위사태가 선포된 때, 작전지역 주민·체류자의 인명·신체 보호 ① 작전지휘관 제청：대피 필요 구역 주민 등의 대피가 필요한 구역을 선정；시·도지사등에 선정한 구역의 대피를 제청 ② 시·도지사등 결정：검토·결정 제청의 적정성을 검토한 뒤 대피구역 결정；명령 공고 방송·확성기·벽보 등 법령이 정한 방법으로 공고；집행 요청 공고 후 작전지휘관에게 대피명령 집행 요청 ③ 작전지휘관 집행：국가방위요소 민·관·경·군 및 예비군 등 국가방위요소를 이용해 대피시킴；주민·체류자 물자·장비의 적 이용 방지 조치 후 지시에 따라 신속히 대피 명령권자: 시·도지사 또는 시장·군수·구청장. 사태 선포 시 즉시 대피를 명할 수 있다.</desc>
