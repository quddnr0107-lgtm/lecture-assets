<text x="1520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">영 제10조①</text>
<text x="520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">각 군 참모총장</text>
<text x="520" y="414" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">다음 다음 해 징집 입영할 사람의 적성별 필요인원을</text>
