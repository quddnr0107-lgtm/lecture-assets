<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-011-D03 · 취재지역별 허용과 제한</title><desc id="desc">시행령 제19조제2항~제4항 | 명단·표지, 허용지역 안, 허용지역 밖 취재 준비：명단 통보 언론기관이 작전지휘관에게 취재기자 명단 통보；식별표지 특별한 사정이 없으면 작전지휘관이 기자에게 제공 허용지역 안：취재 보장 식별표지 착용 기자는 정해진 허용지역 안에서 자유롭게 취재；제한 가능 작전에 지장을 준다고 인정되는 경우 취재활동 제한 가능 허용지역 밖：승인·안내 작전지휘관의 사전 승인 후 제공된 안내요원의 안내에 따라 취재；대표자 한정 선정된 1명 또는 여러 명의 대표자에게만 승인할 수 있음 허용지역 안의 취재 보장에도 작전 지장 시 제한 가능이라는 예외가 있다. 대표자 수를 1명으로만 고정하지 않는다. 세 섹션은 상황별 기준이며, 허용지역 밖으로 반드시 이동하는 순서가 아니다.</desc>
