<text x="164" y="368" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">조정 사유</text>
<text x="1520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제42조①</text>
<text x="520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">병무청장의 요청</text>
<text x="520" y="414" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">현역기간 변경으로 조정 필요, 나쁜 근무조건·환경으로 단축</text>
<text x="520" y="467" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">필요 또는 병역자원 수급계획상 필요.</text>
<rect x="76" y="579.0" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="616.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">02</text>
<text x="164" y="615.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">사전 심의·승인</text>
<text x="1520" y="605.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제42조②</text>
<text x="520" y="605.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">국무회의 → 대통령</text>
<text x="520" y="661.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">미리 국무회의 심의를 거쳐 대통령의 승인을 받아야 한다.</text>
