<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-024-D02 · 문책 사유와 계획 시정요구</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 24강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">문책 사유와 계획 시정요구</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직무를 게을리한 사람에 대한 문책과 방호계획의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시정은 별도 권한</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">국가중요시설 계획 시정 (계속)</text>
<path d="M80 433L683.921875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">필요 요건</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가중요시설의 방호태세 유지를 위하여 필요한</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경우</text>
<path d="M80 680L80 794" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">시정 대상</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가중요시설의 자체방호계획 및 방호지원계획</text>
<text x="80" y="864" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 874L314.21875 874" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="928" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">사람에 대한 문책요구 / 자체방호·방호지원계획에</text>
<text x="80" y="989" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">대한 시정요구</text>
<text x="80" y="1076" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1086L285.046875 1086" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각 문책 사유에는 법령이 정한 행위와 중대한</text>
<text x="80" y="1221" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지장·손실 등 결과 요건이 함께 필요하다.</text>
<text x="80" y="1308" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1318L270.0625 1318" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1392" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제23조제1항·제3항</text>
<text x="80" y="1473" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제37조제1항제1호~제4호</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제23조 · TB-024-D02 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
