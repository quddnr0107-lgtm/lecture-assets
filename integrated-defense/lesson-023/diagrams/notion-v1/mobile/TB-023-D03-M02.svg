<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-023-D03 · 취약지역 대비책과 출입제한</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 23강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">취약지역 대비책과 출입제한</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도지사의 대비책 마련과 지역군사령관의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">차단·출입제한 권한</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지형별 대비 (계속)</text>
<path d="M80 433L449.703125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">호수</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">자체 수상 순찰활동 등 대비책 시행</text>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지역군사령관: 차단·제한</text>
<path d="M80 668L576.46875 668" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 709L80 884" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="744" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">해안·강안</text>
<text x="104" y="806" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">취약지역 중 방호 활동이 필요하다고 인정되는</text>
<text x="104" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해안·강안에 차단시설 설치</text>
<path d="M80 915L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="950" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">사전 통보·표지</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">미리 시·도지사에게 통보 / 차단시설에 300m 이내</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">간격으로 표지 부착</text>
<path d="M80 1121L80 1296" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1156" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">출입 확인</text>
<text x="104" y="1218" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">민간인의 인적사항·출입목적·출입지역 확인 후</text>
<text x="104" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">출입제한 조치 가능</text>
<text x="80" y="1366" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1376L314.21875 1376" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1430" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">대비책은 시·도지사 / 해안·강안의 차단시설과</text>
<text x="80" y="1491" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">민간인 출입제한은 지역군사령관</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제22조 · TB-023-D03 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
