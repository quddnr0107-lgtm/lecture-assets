<path d="M80 1327L80 1441" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">대상 사태</text>
<text x="104" y="1424" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해당 지역의 을종·병종사태</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
