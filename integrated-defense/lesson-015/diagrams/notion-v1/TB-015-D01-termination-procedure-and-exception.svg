<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">평상 회복은 심의 후 해제, 의회 요구는 심의 없이 해제·공고.</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">시·도지사의 대통령 보고 의무는 의회 요구 경로에도 적용된다. 일반 경로는 사전 심의 후 해제하며, 의회 요구 경로는 심의를 생략한다.</text>
