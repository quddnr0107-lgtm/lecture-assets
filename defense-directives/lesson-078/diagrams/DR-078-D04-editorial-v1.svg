<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">보류자 확인과 전출입 서류</title><desc id="desc">DR-078 · 교육훈련 훈령 제23조. 신분 확인은 분기별로, 원서는 새 거주지 부대로 넘긴다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-078</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">교육훈련</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">보류자 확인과 전출입 서류</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">신분 확인은 분기별로, 원서는 새 거주지 부대로 넘긴다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="973" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">신분 유지 확인</text>
<path d="M81 385 C192.363 391 283.324 381 362.531 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제1항제6호가목</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">별도 편성</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">보류자를 따로 편성·관리</text>
<text x="144" y="657.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">분기 1회 이상</text>
<text x="144" y="699.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">등록 후 문자·유무선 등으로 확인·홍보</text>
<text x="144" y="828.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">장기보류</text>
<text x="144" y="870.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">실태조사·근거 유지, 확인책임기관을 통해</text>
<text x="144" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">확인</text>
<path d="M116 459 C96 459 92 466 92 485 L92 933 C92 956 102 965 117 965" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">편성과 전출입</text>
<path d="M844 341 C866 311 1065.61 307 1119.61 331 C1140.61 346 1126.61 381 1097.61 393 C981.805 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제1항제6호나목~라목</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">보류자 소대</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">법규·방침보류자 순; 동원 가용</text>
<text x="860" y="580.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">방침보류자에게 임무 부여</text>
<text x="860" y="683.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">전출부대</text>
<text x="860" y="725.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">신 거주지 부대로 원본 송부(우편·FAX),</text>
<text x="860" y="776.56" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">사본 보관하지 않음</text>
<text x="860" y="879.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">전입부대</text>
<text x="860" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">체계 정리·서류 확인, 미접수 시 재송부 요청</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">필요시 증빙 요구 가능, 연례 요구 금지. 임무는 해당부대 작전계획에 명시된 임무.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">교육훈련 훈령 제23조 · DR-078-D04</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
