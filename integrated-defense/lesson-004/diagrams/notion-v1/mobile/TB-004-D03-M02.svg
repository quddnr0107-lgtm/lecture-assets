<path d="M80 372L328.953125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 832" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">장관 6개</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">고용노동부장관</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">성평등가족부장관</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국토교통부장관</text>
<text x="104" y="693" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해양수산부장관</text>
<text x="104" y="754" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">중소벤처기업부장관</text>
<text x="104" y="815" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">기획예산처장관</text>
<text x="80" y="902" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 912L314.21875 912" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="966" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">중앙협의회 의장은 국무총리이며, 장관·기관장 등이</text>
<text x="80" y="1027" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">위원으로 참여한다.</text>
<text x="80" y="1114" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1124L285.046875 1124" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1198" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">장관 직위의 묶음은 편집상 구분이다. 장관 외 법정</text>
<text x="80" y="1259" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">위원 및 추가 위원은 D04 참조.</text>
<text x="80" y="1346" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
