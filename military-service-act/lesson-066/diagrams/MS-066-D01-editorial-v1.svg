<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">공익법무관의 편입과 복무</title><desc id="desc">편입 판단: 병무청장 법정 대상자인 변호사 자격자가 원하면 공익법무관으로 편입할 수 있다.; 편입 대상 법무장교 미편입 지원자·법무사관후보생 또는 사회복무 소집 대상 보충역 중 법정 요건자. / 기간과 병역: 해당 분야 3년 복무를 마치면 사회복무요원의 복무를 마친 것으로 본다.; 교육기간 불산입 군사교육소집 기간은 복무기간에 포함하지 않는다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-066</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">공익법무관의 편입과 복무</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">변호사 자격과 본인의 희망이 필요</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="800" y1="334" x2="800" y2="936" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">편입 판단</text>
<path d="M80 386 C128.8 393 205.5 380 266.2 386" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105 429 C91 429 89 439 89 453 L89 855.0 C89 872.0 95 878.0 107 878.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="752" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의6①</text>
<text x="128" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">병무청장</text>
<text x="128" y="507" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">법정 대상자인 변호사 자격자가 원하면</text>
<text x="128" y="560" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">공익법무관으로 편입할 수 있다.</text>
<text x="752" y="703" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의6①</text>
<text x="128" y="703" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">편입 대상</text>
<text x="128" y="759" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">법무장교 미편입</text>
<text x="128" y="812" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">지원자·법무사관후보생 또는 사회복무</text>
<text x="128" y="865" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">소집 대상 보충역 중 법정 요건자.</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">기간과 병역</text>
<path d="M825 342 C861.5 315 1016.1 314 1072.7 338 C1098.7 362 1066.7 390 1001.1 397 C891.5 408 812 385 822 357 Z" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M865 429 C851 429 849 439 849 453 L849 802.0 C849 819.0 855 825.0 867 825.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1512" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의6②</text>
<text x="888" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">해당 분야 3년</text>
<text x="888" y="507" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">복무를 마치면 사회복무요원의 복무를</text>
<text x="888" y="560" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">마친 것으로 본다.</text>
<text x="1512" y="703" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의6③</text>
<text x="888" y="703" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">교육기간 불산입</text>
<text x="888" y="759" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">군사교육소집 기간은 복무기간에</text>
<text x="888" y="812" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">포함하지 않는다.</text>
<line x1="80" y1="982" x2="1520" y2="982" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="84" y="1021" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#25241F" text-anchor="start">현역병입영 대상자가 편입되면 보충역에 편입한다.</text>
<line x1="80" y1="1052" x2="1520" y2="1052" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 제34조의6 · MS-066 · 핵심 구조</text>
<text x="1520" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
