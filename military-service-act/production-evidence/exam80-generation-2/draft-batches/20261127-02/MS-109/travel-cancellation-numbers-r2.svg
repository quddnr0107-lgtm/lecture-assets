<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>국외여행허가 취소 기준</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-109</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 L1520 105" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">국외여행허가 취소 기준</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">국외이주 목적과 그 밖의 목적 비교</text>
<path d="M80 280 L1520 280" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">국외이주 목적</text>
<path d="M80 389 Q240 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="128" y="440" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">국내 체류</text>
<circle cx="98" cy="431" r="5" fill="#25241F"/>
<text x="128" y="485" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">1년 중 통틀어 6개월 이상</text>
<text x="128" y="528" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">정해진 사유 60일 이내 제외</text>
<text x="128" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">연기 후 미출국</text>
<circle cx="98" cy="589" r="5" fill="#25241F"/>
<text x="128" y="643" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">연기받은 날부터 1년 6개월</text>
<text x="128" y="686" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">이내 정당한 사유 없이 미출국</text>
<text x="128" y="756" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">취소 유예</text>
<circle cx="98" cy="747" r="5" fill="#25241F"/>
<text x="128" y="801" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">국내 6개월 이상 또는 영리활동</text>
<text x="128" y="844" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">한 번 3개월, 미출국 시 취소</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">그 밖의 목적</text>
<path d="M840 389 Q1000 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="888" y="440" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">미출국</text>
<circle cx="858" cy="431" r="5" fill="#25241F"/>
<text x="888" y="485" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">허가받은 날부터 1년 이내</text>
<text x="888" y="528" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">출국하지 않은 때</text>
<text x="888" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">25세 이상</text>
<circle cx="858" cy="589" r="5" fill="#25241F"/>
<text x="888" y="643" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">허가기간 중 귀국하여</text>
<text x="888" y="686" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">국내 계속 3개월 이상 체류</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">국외이주와 그 밖의 허가는 기산점·기간이 서로 다름</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
