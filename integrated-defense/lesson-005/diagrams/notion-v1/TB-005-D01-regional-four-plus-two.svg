<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-005-D01 · 지역협의회의 심의사항</title><desc id="desc">시·도와 시·군·구 지역협의회 비교 · 각 협의회가 각각 심의 공통 4가지：2호 · 대비책 통합방위 대비책；4호 · 작전·훈련 통합방위작전·훈련의 지원 대책；5호 · 방위요소 국가방위요소의 효율적 육성·운용 및 지원 대책；6호 · 위임사항 그 밖에 통합방위에 관하여 대통령령으로 정하는 사항 시·도만 2가지：1호 · 취약지역 적이 침투하거나 숨어서 활동하기 쉬운 취약지역의 선정 또는 해제；3호 · 을종·병종 을종사태 및 병종사태의 선포 또는 해제 시·도만이라는 제한은 법 제5조의 두 지역협의회 사이의 구분이다. 중앙협의회의 심의 범위를 제한하는 뜻은 아니다. 취약지역의 선정·해제와 취약지역 대비책은 서로 다른 사항이다. 협의회별 심의 권한의 비교이며 상하 지휘관계를 뜻하지 않는다.</desc>
