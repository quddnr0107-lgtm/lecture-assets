<text x="1102.6666666666665" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">방호지원계획</text>
<text x="1102.6666666666665" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시·도경찰청장 또는</text>
<text x="1102.6666666666665" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지역군사령관이 수립·시행</text>
<text x="1102.6666666666665" y="628" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">평시 지도·감독</text>
<text x="1102.6666666666665" y="676" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">관계 행정기관의 장과</text>
