<text x="84" y="1021" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#25241F" text-anchor="start">경찰대학 졸업예정자로 의무경찰대에 복무할 사람의 추천 명단은 졸업하는 해 1월 15일까지 송부.</text>
