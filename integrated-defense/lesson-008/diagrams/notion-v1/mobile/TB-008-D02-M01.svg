<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-008-D02 · 통합방위 실무위원회는 무엇을 심의하나</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 08강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">통합방위 실무위원회는 무엇을</text>
<text x="80" y="243" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">심의하나</text>
<text x="80" y="330" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부에 설치 · 의장은 본부 부본부장</text>
<path d="M80 369L1000 369" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="443" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">위원의 구성</text>
<path d="M80 453L314.21875 453" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 494L80 669" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="529" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">합참 장교</text>
<text x="104" y="591" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장이 지명하는 합동참모본부 부장급</text>
<text x="104" y="652" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">장교</text>
<path d="M80 700L80 875" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="735" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">중앙협의회 측</text>
<text x="104" y="797" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각 중앙협의회 위원이 지명하는 소속 국장급 공무원</text>
<text x="104" y="858" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각 1명</text>
<path d="M80 906L80 1081" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="941" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">관계기관 측</text>
<text x="104" y="1003" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각 관계기관장이 지명하는 소속 국장급 공무원 각</text>
<text x="104" y="1064" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">1명</text>
<text x="80" y="1151" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">심의사항 · 4개 호</text>
<path d="M80 1161L436.890625 1161" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1202L80 1316" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1237" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">1 · 대비책</text>
<text x="104" y="1299" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 대비책</text>
<path d="M80 1347L80 1461" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1382" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">2 · 부처 간 조정</text>
<text x="104" y="1444" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정부 각 부처 간 통합방위 업무 조정</text>
<path d="M80 1492L80 1606" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1527" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">3 · 법규 개정</text>
<text x="104" y="1589" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 관련 법규의 개정</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제8조 · TB-008-D02 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
