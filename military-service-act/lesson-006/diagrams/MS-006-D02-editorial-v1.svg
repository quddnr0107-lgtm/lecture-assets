<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">대리 신고의 확인 서류</title><desc id="desc">위임·관계 확인: 본인 서류 병역의무자의 신분증 사본 및 위임장 첨부; 대리인 관계 대리인등임을 증명할 수 있는 서류 첨부 / 사유·신원 확인: 대리 사유 질병 또는 시행령 제3조제1항의 부득이한 사유에 해당함을 증명하는 서류 첨부; 대리인 신원 주민등록증·운전면허증·여권 등 대리인의 신분증 제시</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-006</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   02 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">대리 신고의 확인 서류</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">대리인은 첨부서류와 본인 신분증을 준비</text>
