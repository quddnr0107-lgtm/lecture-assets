<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-011-D02 · 합동보도본부의 설치 기준</title><desc id="desc">시행령 제20조 | 중앙·지역의 설치 기준과 필요 시 현지 설치 중앙 합동보도본부：설치 주체·때 통합방위본부장이 통합방위사태 선포 시 설치；설치 장소 통합방위본부 지역 합동보도본부：설치 주체·때 지역군·함대사령관 또는 시도경찰청장이 선포구역 작전지휘관으로 지정될 때；설치 장소 각 지원본부 또는 통합방위작전 지휘소 인접지역 현지 합동보도본부：설치 조건 필요할 때 설치 가능；설치 장소 취재활동이 쉬운 지역 지역군·함대사령관은 지역군사령관 또는 함대사령관을 줄여 표시한 것이다. 중앙·지역·현지는 설치 기준의 병렬 비교이며 지휘계통을 표시하지 않는다.</desc>
