<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-004-D04 · 중앙협의회 법정 위원과 추가 위원</title><desc id="desc">법 제4조제2항 · 시행령 제5조 법률 직접 열거 · 장관 외：기관장 5개 국무조정실장
법제처장
식품의약품안전처장
국가정보원장
통합방위본부장 대통령령에 따른 추가 위원：제1호 · 지방자치단체장 지방자치단체의 장 중 중앙협의회 의장이 위촉；제2호 · 식견·경험 통합방위에 관한 식견과 경험이 풍부한 사람 중 중앙협의회 의장이 임명하거나 위촉 의장은 국무총리이다. 장관 직위는 D03 참조. 직위 열거와 추가 위원 자격을 구별하며 전체 정원을 고정하지 않는다.</desc>
