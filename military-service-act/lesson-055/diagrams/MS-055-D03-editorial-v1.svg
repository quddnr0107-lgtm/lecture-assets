<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무 교육의 횟수·기간</title><desc id="desc">횟수와 최초교육: 각각 1회 이상 복무기본교육 및 직무교육은 각각 1회 이상 실시하여야 함; 소집일부터 3개월 최초 복무기본교육·직무교육은 사회복무요원 소집일부터 3개월 이내; 군사교육을 했다면 군사교육소집을 한 경우 그 소집을 해제한 날부터 3개월 이내 / 교육기간: 30일 이내 복무기본교육 및 법 제33조의2제2항 본문의 직무교육; 15일 이내 복무지도교육; 복무기간에 산입 각 교육기간은 복무기간에 산입</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
