<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">주요 직위자 임명 절차</title><desc id="desc">DR-011 · 조직·편성 훈령 제11조. 중대장 추천부터 임명결과 안내까지의 흐름이다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-011</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">조직·편성·운영</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">주요 직위자 임명 절차</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">중대장 추천부터 임명결과 안내까지의 흐름이다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="973" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">추천과 임명</text>
<path d="M81 385 C170.188 391 243.198 381 309.734 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제2항제1호~제3호</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">중대장</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">선발 후 지방병무청 후순위 조정 승인 →</text>
<text x="144" y="580.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">정보체계로 관리대대장 추천</text>
<text x="144" y="683.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">관리대대장</text>
<text x="144" y="725.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">적격 확인, 별지 7호 지원서·편성카드 첨부</text>
<text x="144" y="776.56" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">후 임명권자 추천</text>
<text x="144" y="879.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">임명권자</text>
<text x="144" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">인사명령으로 임명·임명장 수여</text>
<path d="M116 459 C96 459 92 466 92 485 L92 933 C92 956 102 965 117 965" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">지원자·결과 처리</text>
<path d="M844 341 C866 311 1129.11 307 1183.11 331 C1204.11 346 1190.11 381 1161.11 393 C1013.55 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제2항제2호·제4호</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">지원자 없음</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">중대장이 소속 대원 중 적합 자원 선발·추천</text>
<text x="860" y="580.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">가능</text>
<text x="860" y="657.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">절차 간소화</text>
<text x="860" y="699.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">정보체계로 추천·인사명령·임명장</text>
<text x="860" y="751" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">생성·발송</text>
<text x="860" y="828.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">최종 확인</text>
<text x="860" y="870.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">중대장이 정보체계로 결과 확인, 임무·역할</text>
<text x="860" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">안내</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">승인 후 추천. 필요 시 관할 관리대대장(지역대장)이 임명장 수여 가능. 결과 확인: 국방동원정보체계.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제11조 · DR-011-D03</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
