<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">승선근무 신상변동 통보</title><desc id="desc">개인 변동: 해고·퇴직 승선하여 복무하던 업체에서 해고되거나 퇴직한 경우; 승선·하선 승선하거나 하선한 경우; 면허 취소·정지 항해사·기관사 면허가 취소되거나 정지된 경우 / 완료기한·업체 변동: 기간 내 완료 불가 편입일부터 5년 이내 또는 30세까지 3년간의 승선근무기간을 마칠 수 없는 경우; 업체 운영 중단 복무업체가 휴업·영업정지·직장폐쇄 또는 폐업한 경우</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-035</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 04</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">승선근무 신상변동 통보</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">업체장은 사유 발생일부터 14일 이내 관할청에 통보</text>
