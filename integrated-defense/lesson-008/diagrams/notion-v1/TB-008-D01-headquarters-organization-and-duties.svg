<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-008-D01 · 통합방위본부의 설치와 5개 사무</title><desc id="desc">합동참모본부에 설치 · 본부장 1명과 부본부장 1명 설치와 본부장：설치 위치 합동참모본부에 통합방위본부를 둠；본부장 합동참모의장；부본부장 합참에서 군사작전 기획 등 작전 업무를 총괄하는 참모 부서의 장 정책·태세·상황：정책 통합방위 정책의 수립 및 조정；대비태세 통합방위 대비태세의 확인 및 감독；작전 상황 통합방위작전 상황의 종합 분석 및 대비책 수립 작전·훈련·기관 협조：지침과 계획 통합방위작전, 훈련지침·계획의 수립 및 그 시행의 조정·통제；관계기관 업무협조 및 사업집행사항의 협의·조정 두 업무 묶음은 학습 편의를 위한 편집상 구분이며 법 제8조제3항의 5개 호를 유지했다. 부본부장을 특정 조직 직함으로 바꾸지 않고 법 제8조제2항의 기능상 지정 기준을 요약했다. 본부 조직과 분장사무의 구성 관계를 나타낸다.</desc>
