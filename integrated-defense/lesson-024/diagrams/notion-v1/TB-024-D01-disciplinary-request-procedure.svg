<text x="607.3333333333333" y="667.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">본부장 결정</text>
<text x="607.3333333333333" y="715.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">해당자에 대한 문책요구 여부 결정</text>
<text x="607.3333333333333" y="806.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">명단 통보</text>
