<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-005-D04 · 지역협의회 위원 구성 ①</title><desc id="desc">시행령 제8조제1항 · 제1호~제7호(제4호의2 포함) 군·정보：1호 해당 지역의 작전책임을 담당하는 군부대의 장；2호 해당 지역 국군방첩부대의 장 또는 그 부대원；3호 국가정보원의 관계자 공소·중대범죄수사：4호 지방공소청장, 지방공소청 지청장 또는 검사；4호의2 지방중대범죄수사청장 또는 그 장이 지명하는 소속 중대범죄수사청수사관 경찰·해경·교정：5호 시·도경찰청장 또는 경찰서장；6호 지방해양경찰청장 또는 해양경찰서장；7호 지방교정청장 또는 교정시설의 장 제4호의2가 추가되었으며 제8호~제14호는 D05에서 확인한다. 세 묶음은 학습용 분류이며 법정 호 번호는 그대로 표시한다.</desc>
