<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">임기제부사관의 선발과 복무</title><desc id="desc">지원·선발: 선발 주체 병무청장이나 각 군 참모총장은 우수 숙련인력 확보에 필요하면 선발 가능; 대상 병역준비역 편입자 또는 현역병 복무 중인 사람; 지원에 의한 선발 본인의 지원에 의하여 선발 / 임기·복무 중단: 임기 4년 범위 현역병 복무를 마친 후 4년의 범위에서 정한 기간을 임기로 부사관 복무; 복무 중단 · 각 군 참모총장 본인이 중단을 원하고, 질병·심신장애 등 법정 사유로 현역복무 부적합을 인정한 경우만 허가 가능; 보수 지급 대통령령으로 정하는 바에 따라 보수 지급</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-027</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">임기제부사관의 선발과 복무</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">본인의 지원으로 현역병 복무를 마친 뒤 복무</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
