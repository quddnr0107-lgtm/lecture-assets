<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>사관후보생 선발 이후 관리</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-094</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 L1520 105" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">사관후보생 선발 이후 관리</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">일반 선발과 군종 선발의 전달 경로</text>
<path d="M80 280 L1520 280" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">선발 명단 전달</text>
<path d="M80 389 Q240 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="128" y="436" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">의무·법무·수의</text>
<circle cx="98" cy="427" r="5" fill="#25241F"/>
<text x="128" y="479" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">병무청장 → 학교·수련기관</text>
<text x="128" y="520" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">및 지방병무청장</text>
<text x="128" y="588" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">군종</text>
<circle cx="98" cy="579" r="5" fill="#25241F"/>
<text x="128" y="631" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">국방부장관 → 병무청장</text>
<text x="128" y="672" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">→ 지방병무청장</text>
<text x="128" y="740" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">병적 편입</text>
<circle cx="98" cy="731" r="5" fill="#25241F"/>
<text x="128" y="783" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">지방병무청장이 처리</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">후보생 계속 관리</text>
<path d="M840 389 Q1000 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="888" y="436" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">과정 완료</text>
<circle cx="858" cy="427" r="5" fill="#25241F"/>
<text x="888" y="479" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">제한연령 전에 과정 이수</text>
<text x="888" y="547" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">자격 미취득</text>
<circle cx="858" cy="538" r="5" fill="#25241F"/>
<text x="888" y="590" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">제한연령에 이를 때까지</text>
<text x="888" y="631" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">후보생으로 관리 가능</text>
<text x="888" y="699" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">선발 사실 통지</text>
<circle cx="858" cy="690" r="5" fill="#25241F"/>
<text x="888" y="742" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">학교·수련기관의 장</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">과정 수료와 자격 취득은 별개의 조건</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-094 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
