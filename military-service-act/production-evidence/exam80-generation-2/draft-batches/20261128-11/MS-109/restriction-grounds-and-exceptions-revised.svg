<circle cx="98" cy="421" r="5" fill="#25241F"/>
<text x="128" y="430" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#77756E" text-anchor="start">검사·입영·소집</text>
<text x="128" y="461" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="400" fill="#25241F" text-anchor="start">기피 중 또는 기피한 사실</text>
<circle cx="98" cy="492" r="5" fill="#25241F"/>
<text x="128" y="501" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#77756E" text-anchor="start">사회복무요원 등의 복무</text>
<text x="128" y="532" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="400" fill="#25241F" text-anchor="start">이탈 중 또는 이탈한 사실</text>
<circle cx="98" cy="563" r="5" fill="#25241F"/>
<text x="128" y="572" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#77756E" text-anchor="start">국외여행허가 의무</text>
<text x="128" y="603" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="400" fill="#25241F" text-anchor="start">위반한 사실</text>
<circle cx="98" cy="634" r="5" fill="#25241F"/>
<text x="128" y="643" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#77756E" text-anchor="start">연기·소집 해제처분</text>
<text x="128" y="674" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="400" fill="#25241F" text-anchor="start">정해진 사유로 취소</text>
