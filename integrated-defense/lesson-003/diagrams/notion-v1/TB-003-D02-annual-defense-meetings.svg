<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-003-D02 · 중앙·지방 통합방위회의는 연 1회 이상</title><desc id="desc">개최 주체와 회의 준비 주체를 나누어 기억 중앙 통합방위회의：개최 주체 중앙협의회 의장인 국무총리；개최 주기 연 1회 이상；회의 준비 통합방위본부장이 의제·참석 대상·일시·장소·주관자를 선정하고 준비 지방 통합방위회의：개최 주체 시·도 협의회 의장인 시·도지사；개최 주기 연 1회 이상；회의 준비 시·도 의장이 지역군사령관·시·도경찰청장·국정원 지부장 등과 협의 통합방위회의는 시책의 국가방위요소별 추진 실적을 평가하고 통합방위태세를 확립하기 위한 회의다. 통합방위본부장은 지방 통합방위회의 준비·개최 지침을 하달한다(시행령 제3조제6항). 참석자 전체 명단은 이 핵심 도식의 범위에서 제외했다.</desc>
