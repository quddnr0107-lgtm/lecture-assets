name: Integrated defense diagram render
on:
  push:
    branches: [main]
    paths:
      - 'integrated-defense/production-queue/render-request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrated-defense-diagrams-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Render approved Exam 80 mobile diagrams
        run: python scripts/notion-diagrams-v1/render_exam80_mobile.py
      - name: Publish without rewriting other subjects
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrated-defense
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render Exam 80 integrated-defense mobile assets for visual review'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
