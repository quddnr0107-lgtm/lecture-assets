<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">상근예비역과 전환복무</title><desc id="desc">상근예비역: 입영·편입 징집으로 현역병 입영 → 일정기간 현역병 복무 → 예비역 편입; 소집 목적 지역방위와 이와 관련된 업무를 지원하기 위하여 소집되어 복무 / 전환복무: 대상 현역병으로 복무 중인 사람; 신분 전환 의무경찰대원 또는 의무소방원의 임무에 복무하도록 군인 신분을 다른 신분으로 전환</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
