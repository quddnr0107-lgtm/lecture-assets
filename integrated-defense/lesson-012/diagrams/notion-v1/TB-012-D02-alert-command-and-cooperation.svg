<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">경계 1급의 군·경 상호통제는 위임받은 작전요소가 기준이며, 특정경비지역은 모든 요소가 대상이다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">이 도식의 통제는 작전통제를 뜻하며, 조직 전체의 일반 행정지휘를 뜻하지 않는다. 평시 계획 수립 주체의 정식 명칭: 지역군사령관, 시도경찰청장,</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">함대사령관, 지방해양경찰청장. 영 제23조의 경계태세 1급과 영 제25조의 통합방위사태 병종은 통제 대상이 다르다.</text>
