<title id="title">TB-017-D02 · 제청과 사전 심의 후 설정</title><desc id="desc">설정 전 절차와 설정 후 알림 의무를 구분 ① 제청·사전 심의：작전지휘관 통제구역 설정을 제청；지역협의회 설정 전에 미리 심의 ② 시·도지사등 설정：설정 원칙 주민 피해를 최소화하고 통합방위작전의 효율성을 보장；설정 대상 교전 위해·교전 예측에 따른 통제 필요·비작전요원 출입에 따른 작전 지장 우려；구체적 명시 기간·구역·사유·금지/제한/퇴거명령 내용·위반 시 벌칙 ③ 통보·공고·보도：서면 통보 관할구역 안의 해당 지방자치단체의 장에게 서면으로 통보；게시판 공고 통제구역이 있는 시·군·자치구·읍·면·동 게시판에 공고；신문·방송 각 신문·방송에 보도되도록 조치 서면 통보·게시판 공고·신문 및 방송 보도는 모두 이행할 사항이다.</desc>
