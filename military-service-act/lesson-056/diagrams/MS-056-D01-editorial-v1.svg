<rect x="76" y="332" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="369" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">01</text>
<text x="164" y="368" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">추천 신청</text>
<text x="1520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">영 제68조의11②</text>
<text x="520" y="358" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">희망자</text>
<text x="520" y="414" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">추천원서와 입상 확인서 등 필요한 서류를</text>
<text x="520" y="467" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">문화체육관광부장관에게 제출한다.</text>
<rect x="76" y="561.3333333333334" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="598.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">02</text>
<text x="164" y="597.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">추천 통보</text>
<text x="1520" y="587.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">영 제68조의11③</text>
<text x="520" y="587.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">14일 이내</text>
<text x="520" y="643.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">문화체육관광부장관은 원서를 받은 날부터 14일 이내 추천자</text>
<text x="520" y="696.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">명단을 병무청장에게 통보한다.</text>
<rect x="76" y="790.6666666666667" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="827.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">03</text>
<text x="164" y="826.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">편입 결정</text>
<text x="1520" y="816.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제33조의7①</text>
<text x="520" y="816.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">병무청장</text>
<text x="520" y="872.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">법정 대상자 중 예술·체육 특기를 갖추고 추천받은 사람을</text>
<text x="520" y="925.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">예술·체육요원으로 편입할 수 있다.</text>
