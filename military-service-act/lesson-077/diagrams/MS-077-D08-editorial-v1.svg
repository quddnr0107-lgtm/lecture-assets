<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>의무복무 중 수학 제한</title>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text id="t1" x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-077</text>
<text id="t2" x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<text id="t3" x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">의무복무 중 수학 제한</text>
<text id="t4" x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시행령 제88조 · 수학 금지의 원칙과 예외</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z M1337 153 L1438 151 L1442 235 L1334 235 Z M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80 284 H1520 M800 334 V920 M80 1047 H1520" stroke="#DFDDD6" stroke-width="2" fill="none"/>
<text id="t5" x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">원칙과 일반 예외</text>
<path d="M80 386 Q180 394 320 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M105 429 Q89 429 89 451 V885 Q89 909 107 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text id="t6" x="128" y="452" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">의무복무기간 중</text>
<text id="t7" x="128" y="496" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">교육기관에서 수학할 수 없다.</text>
<text id="t8" x="128" y="558" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">허용되는 수업</text>
<text id="t9" x="128" y="602" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">야간수업</text>
<text id="t10" x="128" y="642" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">방송통신 수업</text>
<text id="t11" x="128" y="704" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">위반 시</text>
<text id="t12" x="128" y="748" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">해당 분야에 복무하지 아니한</text>
<text id="t13" x="128" y="788" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">것으로 본다.</text>
<text id="t14" x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">전문연구요원 박사과정</text>
<path d="M840 386 Q940 394 1080 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M865 429 Q849 429 849 451 V885 Q849 909 867 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text id="t15" x="888" y="452" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">대상</text>
<text id="t16" x="888" y="496" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">국내교육기관 박사과정</text>
<text id="t17" x="888" y="536" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">35세까지 의무복무 완료 가능자</text>
<text id="t18" x="888" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">수학기간</text>
<text id="t19" x="888" y="642" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">3년 6개월을 넘지 못한다.</text>
<text id="t20" x="888" y="704" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">절차</text>
<text id="t21" x="888" y="748" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">본인 → 업체의 장에게 신청</text>
<text id="t22" x="888" y="788" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">업체의 장이 기간을 정하여</text>
<text id="t23" x="888" y="828" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">신상변동 통보</text>
<path d="M80 958 H1520" stroke="#DFDDD6" stroke-width="2"/>
<text id="t24" x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">야간·방송통신 허용 / 전문연구요원 박사과정은 별도 요건</text>
<text id="t25" x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-077 · 기존 제80회 원고</text>
<text id="t26" x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
