<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-005-D03 · 지역 지원대책, 어디에 속하는가</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 05강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">지역 지원대책, 어디에 속하는가</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 대비책 · 작전·훈련 지원 · 방위요소</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">육성·운용 및 지원의 구별</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 433L285.046875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="507" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">위 항목은 해당 대책에 포함되어야 하는 시행령상</text>
<text x="80" y="568" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사항이다.</text>
<text x="80" y="649" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">취약지역 대비책은 공동 심의사항인 작전·훈련</text>
<text x="80" y="710" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지원대책에 포함되며, 선정·해제와 구별한다.</text>
<text x="80" y="797" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 807L270.0625 807" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="881" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제5조제3항제2호·제4호·제5호</text>
<text x="80" y="968" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 978L270.0625 978" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1052" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제8조제6항~제8항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제5조 · TB-005-D03 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
