<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-005-D01 · 지역협의회의 심의사항</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 05강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">지역협의회의 심의사항</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도와 시·군·구 지역협의회 비교 · 각 협의회가</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각각 심의</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">공통 4가지</text>
<path d="M80 433L295.828125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">2호 · 대비책</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 대비책</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">4호 · 작전·훈련</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전·훈련의 지원 대책</text>
<path d="M80 764L80 878" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="799" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">5호 · 방위요소</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가방위요소의 효율적 육성·운용 및 지원 대책</text>
<path d="M80 909L80 1084" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="944" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">6호 · 위임사항</text>
<text x="104" y="1006" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">그 밖에 통합방위에 관하여 대통령령으로 정하는</text>
<text x="104" y="1067" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사항</text>
<text x="80" y="1154" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">시·도만 2가지</text>
<path d="M80 1164L368.40625 1164" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1205L80 1380" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1240" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">1호 · 취약지역</text>
<text x="104" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적이 침투하거나 숨어서 활동하기 쉬운 취약지역의</text>
<text x="104" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">선정 또는 해제</text>
<path d="M80 1411L80 1525" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1446" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">3호 · 을종·병종</text>
<text x="104" y="1508" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">을종사태 및 병종사태의 선포 또는 해제</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제5조 · TB-005-D01 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
