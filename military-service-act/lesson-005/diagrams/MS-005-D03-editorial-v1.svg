<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">역종별 신분과 병적 관리</title><desc id="desc">역종별 신분: 예비역·보충역 각각 장교·준사관·부사관 또는 병으로 구분; 전시근로역 부사관 또는 병으로 구분; 병적 편입 각각 그 병역의 병적에 편입 / 병적관리기관: 군 입영·상근소집 해당 군 참모총장 — 해병대는 해병대사령관; 전환복무 중 경찰청장·소방청장 또는 해양경찰청장; 그 밖의 해당 역 병역준비역·전시근로역·예비역·보충역·대체역은 거주지 지방병무청장 또는 병무지청장</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-005</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   03 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">역종별 신분과 병적 관리</text>
