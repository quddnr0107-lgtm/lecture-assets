<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">경고처분의 주요 사유</title><desc id="desc">타인·권한 관련: 근무 방해·선동 다른 사람의 근무 방해 또는 근무태만 선동; 정치운동 법 제32조의3의 정치운동 금지 위반; 무권한 정보 검색 정당한 권한 없이 다른 사람의 정보를 검색하거나 열람 / 가혹행위·복무질서: 가혹행위·폭력 다른 요원에 대한 가혹행위 또는 서비스 이용자에 대한 신체적·정서적·성적 폭력이나 가혹행위; 영리·무단 겸직 복무 관련 영리행위 또는 기관장의 허가 없는 다른 직무 겸직</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-054</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   02 / 04</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">경고처분의 주요 사유</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">사회복무요원의 법정 의무위반을 구분</text>
