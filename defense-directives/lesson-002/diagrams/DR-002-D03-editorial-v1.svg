<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">예비군지역대</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">자원관리대대와 중대 사이 중간 지휘제대;</text>
<text x="144" y="577.28" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">예하 예비군부대 지휘관리</text>
<text x="144" y="647.56" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">지역대 본부</text>
<text x="144" y="689.56" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">특별자치시·시·군·자치구청에 설치·운영</text>
