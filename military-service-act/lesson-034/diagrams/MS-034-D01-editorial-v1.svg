<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">승선근무 3년과 편입 후 5년</title><desc id="desc">승선근무 의무: 3년간 복무 항해사·기관사로서 3년간 승선근무하여야 함; 5년 이내 완료 승선근무예비역에 편입된 날부터 5년 이내에 3년간 승선근무; 완료 효과 승선근무기간을 마치면 현역 복무를 마친 것으로 봄 / 요건과 절차: 선박 규모 해운업 분야 총톤수 500톤 이상, 수산업 분야 총톤수 100톤 이상인 법정 업체의 선박; 군사교육 산입 법 제21조의2제1항제2호 편입자의 군사교육소집 기간은 승선근무기간에 산입</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-034</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">승선근무 3년과 편입 후 5년</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">의무복무기간·완료기한·군사교육기간 산입</text>
