<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">본인의 기피와 대리입영</title><desc id="desc">본인의 입영·소집 기피: 행위와 조건 통지서를 받고 정당한 사유 없이 정해진 기간이 지나도 입영·소집에 불응; 법정형 3년 이하의 징역 / 대리입영·대리소집: 처벌 대상 통지서를 받은 사람을 대신하여 입영하거나 소집에 응한 사람; 법정형 1년 이상 3년 이하의 징역</desc>
