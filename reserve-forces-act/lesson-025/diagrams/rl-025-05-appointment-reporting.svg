<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">임명 통보와 분기 보고</title>
<desc id="desc">RL-025 예비군법 제14조의2, 예비군부대 지휘관의 임무 및 결격사유. 시행규칙 제12조제4항·제5항 · 통보와 보고를 구별</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F4F4" stroke="none"/>
<rect x="64" y="38" width="7" height="29" rx="3" fill="#275AA3" stroke="none"/>
<text x="87" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#275AA3" text-anchor="start">제80회  ·  예비군법</text>
<text x="1536" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#545860" text-anchor="end">기한·숫자</text>
<text x="64" y="142" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="52" font-weight="700" fill="#202124" text-anchor="start">임명 통보와 분기 보고</text>
<text x="67" y="190" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#545860" text-anchor="start">시행규칙 제12조제4항·제5항 · 통보와 보고를 구별</text>
<rect x="64" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="64" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="64" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="106" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">5일 이내 통보</text>
<text x="106" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">통보 주체</text>
<text x="106" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">수임군부대의 장</text>
<line x1="106" y1="462.5" x2="742" y2="462.5" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="106" y="504.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">통보 대상</text>
<text x="106" y="550.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">지방병무청장·경찰서장·지역 또는</text>
<text x="106" y="594.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">직장방위협의회 의장</text>
<line x1="106" y1="622.0" x2="742" y2="622.0" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="106" y="664" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">서식</text>
<text x="106" y="710" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">별지 제13호서식으로 임명 사실을 각각 통보</text>
<rect x="816" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="816" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="816" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="858" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">분기 말 기준 보고</text>
<text x="858" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">다음 달 20일까지</text>
<text x="858" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">수임군부대의 장이 소속 각 군 참모총장에게</text>
<text x="858" y="479" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">보고</text>
<line x1="858" y1="513" x2="1494" y2="513" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="858" y="555" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">그 달 말일까지</text>
<text x="858" y="601" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">각 군 참모총장은 종합하여 국방부장관에게 보고</text>
<rect x="64" y="760" width="1472" height="77" rx="12" fill="#E6EDF7" stroke="none"/>
<rect x="64" y="760" width="6" height="77" rx="3" fill="#275AA3" stroke="none"/>
<text x="92" y="807" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#275AA3" text-anchor="start">관계 기관에는 5일 이내 통보, 군 계통에는 다음 달 20일과 그 달 말일 보고</text>
<text x="66" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#545860" text-anchor="start">예비군법 제14조의2</text>
<text x="1536" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#545860" text-anchor="end">RL-025  ·  05 / 13</text>
</svg>
