<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">01 Apple — 지역협의회 심의사항</title><desc id="desc">Apple의 차분한 여백, 큰 타이포그래피와 명확한 콘텐츠 위계를 해석한 자체 도식. 통합방위법 제5조제3항의 지역협의회 공통 네 사항과 시·도 협의회에 한정된 두 사항을 비교한 디자인 시안.</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F5F5F7" />
<defs>
<radialGradient id="ambient"><stop offset="0" stop-color="#D6E7FF" stop-opacity=".62"/><stop offset="1" stop-color="#F5F5F7" stop-opacity="0"/></radialGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1375E5"/><stop offset="1" stop-color="#0049B0"/></linearGradient>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="24" flood-color="#354369" flood-opacity=".08"/></filter>
</defs>
<circle cx="1380" cy="310" r="490" fill="url(#ambient)"/>
<text x="80" y="75" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#0071E3" text-anchor="start">01</text>
<text x="132" y="75" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#6E6E73" text-anchor="start">Apple · 여백과 위계</text>
<text x="1520" y="75" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#86868B" text-anchor="end">무한회독 / 통합방위법</text>
<text x="80" y="183" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="74" font-weight="700" fill="#1D1D1F" text-anchor="start">공통은 4개. 시·도는 2개 더.</text>
<text x="84" y="248" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#6E6E73" text-anchor="start">지역협의회의 심의사항 · 시·도와 시·군·구 지역협의회 비교</text>
<rect x="80" y="318" width="918" height="678" rx="48" fill="#FFFFFF" filter="url(#lift)"/>
<rect x="1030" y="318" width="490" height="678" rx="48" fill="url(#blue)" filter="url(#lift)"/>
<text x="136" y="492" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="144" font-weight="700" fill="#0071E3" text-anchor="start">4</text>
<text x="290" y="415" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="43" font-weight="700" fill="#1D1D1F" text-anchor="start">공통 심의</text>
<text x="290" y="473" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#6E6E73" text-anchor="start">시·도 / 시·군·구</text>
<rect x="786" y="359" width="164" height="44" rx="22" fill="#F5F5F7" />
<text x="868.0" y="388.92" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#6E6E73" text-anchor="middle">각각 심의</text>
<line x1="136" y1="535" x2="942" y2="535" stroke="#E8E8ED" stroke-width="1.5" stroke-linecap="round"/>
<text x="136" y="596" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#86868B" text-anchor="start">제2호</text>
<text x="136" y="653" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">통합방위 대비책</text>
<text x="562" y="596" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#86868B" text-anchor="start">제4호</text>
<text x="562" y="653" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">통합방위작전·훈련의</text>
<text x="562" y="702" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">지원 대책</text>
<text x="136" y="780" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#86868B" text-anchor="start">제5호</text>
<text x="136" y="837" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">국가방위요소의 효율적</text>
<text x="136" y="886" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">육성·운용 및 지원 대책</text>
<text x="562" y="780" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#86868B" text-anchor="start">제6호</text>
<text x="562" y="837" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">그 밖에 통합방위에</text>
<text x="562" y="886" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">관하여 대통령령으로</text>
<text x="562" y="935" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="start">정하는 사항</text>
<text x="1086" y="492" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="144" font-weight="700" fill="#FFFFFF" text-anchor="start">2</text>
<text x="1242" y="415" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">시·도만</text>
<text x="1242" y="470" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#D5E6FF" text-anchor="start">추가 심의</text>
<line x1="1086" y1="535" x2="1464" y2="535" stroke="#8AB7F2" stroke-width="1.5" stroke-linecap="round"/>
<text x="1086" y="596" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#B9D8FF" text-anchor="start">제1호</text>
<text x="1086" y="653" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF" text-anchor="start">취약지역의 선정 또는</text>
<text x="1086" y="706" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF" text-anchor="start">해제</text>
<text x="1086" y="786" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#B9D8FF" text-anchor="start">제3호</text>
<text x="1086" y="843" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF" text-anchor="start">을종사태 및 병종사태의</text>
<text x="1086" y="896" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF" text-anchor="start">선포 또는 해제</text>
<circle cx="1014" cy="655" r="32" fill="#F5F5F7"/>
<text x="1014" y="668" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#6E6E73" text-anchor="middle">+</text>
<text x="80" y="1073" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#86868B" text-anchor="start">통합방위법 제5조제3항 · TB-005 · 디자인 검토용</text>
<text x="1520" y="1073" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#86868B" text-anchor="end">STYLE STUDY 01 / 10</text>
</svg>
