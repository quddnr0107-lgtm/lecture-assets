<path d="M844 341 C866 311 1106.92 307 1160.92 331 C1181.92 346 1167.92 381 1138.92 393 C1002.46 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제2항제1호·제2호</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">훈련부대</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">훈련 당일 결과 입력</text>
<text x="860" y="683.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">2일 이상 훈련</text>
<text x="860" y="725.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">훈련종료일에 참석결과 입력</text>
<text x="860" y="879.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">예비군부대</text>
<text x="860" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">다음 날 국방동원정보체계에서 확인</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">상비예비군훈련의 행정처리는 동원훈련Ⅰ형에 준한다.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">교육훈련 훈령 제18조 · DR-062-D01</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
