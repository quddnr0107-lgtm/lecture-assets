<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-017-D01 · 통제구역 설정의 두 가지 요건</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 17강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">통제구역 설정의 두 가지 요건</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">요건 중 하나 충족 → 설정권자 → 비작전 관련자에</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대한 통제</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">① 두 요건 중 하나</text>
<path d="M80 433L444.140625 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">사태 선포</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위사태가 선포된 경우</text>
<path d="M80 619L80 794" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">경계태세 1급</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적의 침투·도발 징후가 확실하여 경계태세 1급이</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">발령된 경우</text>
<text x="80" y="864" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">② 설정권자·목적</text>
<path d="M80 874L432.25 874" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 915L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="950" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">시·도지사 등</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도지사 또는 시장·군수·구청장이 설정할 수</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">있음</text>
<path d="M80 1121L80 1296" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1156" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">인명·신체 보호</text>
<text x="104" y="1218" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">인명·신체에 대한 위해를 막기 위해 필요한 구역</text>
<text x="104" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">설정</text>
<text x="80" y="1366" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">③ 통제 대상·내용</text>
<path d="M80 1376L445.6875 1376" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1417L80 1592" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1452" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">비작전 관련자</text>
<text x="104" y="1514" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전 또는 경계태세 발령에 따른 군·경</text>
<text x="104" y="1575" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동작전과 무관한 사람</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제16조 · TB-017-D01 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
