<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">재병역판정검사의 시점</title><desc id="desc">병역처분: 해당 대상 현역병입영 대상자 또는 보충역으로 병역처분을 받은 사람 / 다음 해부터 4년: 12월 31일까지 처분 다음 해부터 4년이 되는 해 말까지 징집 또는 소집되지 않은 경우 / 5년이 되는 해: 지방병무청장 재병역판정검사를 실시</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
