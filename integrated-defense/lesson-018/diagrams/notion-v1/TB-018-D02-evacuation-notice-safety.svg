<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-018-D02 · 대피명령 공고와 안전대피</title><desc id="desc">명령을 알리는 수단과 안전하게 이동시키는 조치를 함께 확인 공고 수단：법률의 기본 수단 방송·확성기·벽보；방송·신문 텔레비전·라디오·유선방송 등 / 중앙·지방 일간신문；인터넷·SNS 지자체·정보통신서비스 제공자 홈페이지 / 사회 관계망 서비스；현장·긴급 전달 전단·비상연락망 구두전달·타종·경적·신호기·긴급 문자 작전지휘관의 안전대피 조치：안전대피 지정 통로·시간·방법·구역을 지정；안내 체계 경계선에 안내요원 배치 / 해상은 안내선박 배치 또는 통신망 유지；안전구역 이동 주민·체류자는 안내요원 지시·안내선박 신호·통신 지시에 따름；식별 표지 안내요원·안내선박 식별 표지는 작전지휘관이 정함 공고 방법과 안전대피·실시 절차는 대통령령으로 정하는 사항이다.</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#FFFEFC"/>
