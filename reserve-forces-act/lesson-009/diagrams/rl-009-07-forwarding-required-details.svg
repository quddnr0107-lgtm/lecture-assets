<text x="106" y="511" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">장소</text>
<text x="106" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">훈련장소</text>
<line x1="106" y1="591" x2="742" y2="591" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="106" y="633" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">시간</text>
<text x="106" y="679" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">훈련장소 도착시간</text>
<rect x="816" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="816" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="816" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="858" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">적용되는 전달 방식</text>
<text x="858" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">제4호</text>
<text x="858" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">주요 사항을 문자메시지 등 전자적 방법으로</text>
