<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역의 여섯 가지 종류</title><desc id="desc">현역·예비역·보충역: 현역 징집·지원 입영병 및 병역법·군인사법에 따라 현역으로 임용·선발된 장교·준사관·부사관·군간부후보생; 예비역 현역을 마친 사람 및 그 밖에 병역법에 따라 예비역에 편입된 사람 / 그 밖의 역종: 병역준비역 병역의무자로서 현역·예비역·보충역·전시근로역·대체역이 아닌 사람; 전시근로역 현역·보충역 복무는 불가하나 전시근로소집 군사지원업무를 감당할 수 있다고 결정된 사람 등</desc>
