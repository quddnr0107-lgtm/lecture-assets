<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역의무 기피자 공개 절차</title><desc id="desc">잠정 대상 심의: 공개심의위원회 관할 지방병무청에 두는 위원회가 공개 여부 심의 / 통지·소명: 관할 지방병무청장 잠정 공개 대상자에게 통지하고 소명기회 부여 / 6개월 경과: 위원회 재심의 통지일부터 6개월 후 병역의무 이행 상황을 고려하여 공개 여부 재심의 / 대상 결정: 지방병무청장 재심의 후 공개 대상자 결정</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-135</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병역의무 기피자 공개 절차</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">잠정 대상 통지 후 6개월을 두고 재심의</text>
