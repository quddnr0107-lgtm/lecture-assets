<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">동원훈련 입영검사와 귀가</title><desc id="desc">입영 후 검사: 입영부대의 장 입영한 날부터 2일 이내 신체검사를 하여야 한다. / 귀가 판단: 훈련 곤란 질병 또는 심신장애로 병력동원훈련이 곤란하다고 인정되면 귀가시킬 수 있다. / 후속 처리: 지방병무청장 재소집하거나 그 해의 병력동원훈련소집을 면제할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-087</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">동원훈련 입영검사와 귀가</text>
