<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시행령 제145조 · 제한 사유와 예외의 구분</text>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">제한 사유 6가지</text>
