<text x="106" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">판단 주체</text>
<text x="106" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">각 군 참모총장이 필요하다고 인정할 때</text>
