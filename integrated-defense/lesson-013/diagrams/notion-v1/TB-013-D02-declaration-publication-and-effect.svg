<text x="607.3333333333333" y="438" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">시도지사 보고</text>
<text x="607.3333333333333" y="482" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">지체 없이 행안부장관 및 국방부장관과</text>
<text x="607.3333333333333" y="520" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">국무총리를 거쳐 대통령 보고</text>
<text x="607.3333333333333" y="595.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">통지·공고</text>
<text x="607.3333333333333" y="639.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">관계 지자체장에게 서면통지, 게시판</text>
<text x="607.3333333333333" y="677.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">공고 및 신문·방송 보도</text>
<text x="607.3333333333333" y="753.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">대통령 선포</text>
<text x="607.3333333333333" y="797.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">같은 지역에 대통령이 선포하면</text>
<text x="607.3333333333333" y="835.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">그때부터 시도지사 선포 효력 상실</text>
