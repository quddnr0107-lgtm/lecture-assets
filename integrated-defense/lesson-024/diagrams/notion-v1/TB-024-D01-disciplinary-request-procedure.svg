<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-024-D01 · 문책요구와 조치 결과 통보</title><desc id="desc">본부장의 조사·심의·결정과 소속기관 또는 직장의 조치를 구분 ① 요건 확인·조사：대상자 통합방위 업무 담당 공무원 또는 통합방위작전·훈련 참여자；직무 태만 결과 국가안전보장이나 통합방위 업무에 중대한 지장을 초래；본부장 조사 소속 공무원에게 조사하게 할 수 있음. 필요시 합동조사·자료 요청 가능 ② 심의·결정·통보：실무위원회 조사 결과 등을 보고받은 후 통합방위 실무위원회 심의；본부장 결정 해당자에 대한 문책요구 여부 결정；명단 통보 본부장이 소속 기관 또는 직장의 장에게 해당자 명단 통보 가능 ③ 소속기관·직장 조치：징계 등 조치 특별한 사유가 없으면 징계 등 적절한 조치를 하여야 함；결과 통보 조치 결과를 통합방위본부장에게 통보하여야 함 통합방위본부장이 직접 징계를 한다는 구조가 아니다.</desc>
