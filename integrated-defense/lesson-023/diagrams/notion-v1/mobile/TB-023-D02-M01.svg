<text x="104" y="1385" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">실무위원회</text>
<text x="104" y="1447" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 실무위원회의 심의를 거침</text>
