name: Integrated defense diagram render
on:
  push:
    branches: [main]
    paths:
      - 'integrated-defense/production-queue/render-request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrated-defense-diagrams-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
          npm install --no-save --no-package-lock sharp
      - name: Build independent deliverables
        run: |
          python scripts/notion-diagrams-v1/build_supplements.py
          python scripts/notion-diagrams-v1/build_mobile.py --lessons 1
      - name: Verify actual assets and publish without rewriting other subjects
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          for manifest in ['manifest.json','mobile-manifest.json']:
              data=json.loads((Path('integrated-defense/notion-v1')/manifest).read_text())
              for row in data['items']:
                  for ext,f in row['files'].items():
                      p=Path(f['path']); b=p.read_bytes()
                      assert hashlib.sha256(b).hexdigest()==f['sha256'],str(p)
                      if ext!='svg':
                          with Image.open(p) as im:
                              assert im.size==(f['width'],f['height']),str(p)
                              im.verify()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrated-defense
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render verified integrated-defense supplement and mobile pilot assets'
          # Rebase only on a clean fast-forward remote history. Never force push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
