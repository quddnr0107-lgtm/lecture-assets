<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-003-D03 · 중앙 통합방위회의 참석 대상</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 03강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">중앙 통합방위회의 참석 대상</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제3조제2항 · 법정 열거 1~9호</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">군 지휘관</text>
<path d="M80 372L270.0625 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">8호</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군단장급 이상의 군 지휘관</text>
<path d="M80 558L80 672" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">9호</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역군사령관 및 함대사령관</text>
<text x="80" y="742" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 752L314.21875 752" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="806" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">중앙 통합방위회의 참석 대상과 중앙협의회 위원은</text>
<text x="80" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">동일하지 않다.</text>
<text x="80" y="954" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 964L285.046875 964" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1038" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제10호의 추가 선정 및 지방회의 준비 관계는</text>
<text x="80" y="1099" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">D04에서 확인한다.</text>
<text x="80" y="1180" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">세 묶음은 학습용 편집 구분이며 법정 분류는 호</text>
<text x="80" y="1241" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">번호를 따른다.</text>
<text x="80" y="1328" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1338L270.0625 1338" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1412" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제3조제2항제1호~제9호</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제3조 · TB-003-D03 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
