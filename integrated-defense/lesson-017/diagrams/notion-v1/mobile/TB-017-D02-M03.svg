<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-017-D02 · 제청과 사전 심의 후 설정</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 17강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">제청과 사전 심의 후 설정</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">설정 전 절차와 설정 후 알림 의무를 구분</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 372L314.21875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="426" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">작전지휘관 제청 → 지역협의회 사전 심의 → 설정 →</text>
<text x="80" y="487" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">통보·공고·보도</text>
<text x="80" y="574" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 584L285.046875 584" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">서면 통보·게시판 공고·신문 및 방송 보도는 모두</text>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">이행할 사항이다.</text>
<text x="80" y="806" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
