<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-008-D02 · 통합방위 실무위원회는 무엇을 심의하나</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 08강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">통합방위 실무위원회는 무엇을</text>
<text x="80" y="243" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">심의하나</text>
<text x="80" y="330" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부에 설치 · 의장은 본부 부본부장</text>
<path d="M80 369L1000 369" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="443" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 453L285.046875 453" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="527" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제8조제4항에 따라 정부 내 통합방위 업무 협조와</text>
<text x="80" y="588" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">원활한 업무 수행을 위하여 설치한다.</text>
<text x="80" y="669" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">본부의 사무 수행과 실무위원회의 심의를 서로</text>
<text x="80" y="730" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">바꾸어 읽지 않는다.</text>
<text x="80" y="817" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 827L270.0625 827" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="901" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제8조제4항·제5항</text>
<text x="80" y="982" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제13조</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제8조 · TB-008-D02 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
