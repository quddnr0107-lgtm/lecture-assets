<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko"><title>전담의사의 문서 서식</title><rect width="1600" height="1120" fill="#FFFEFC"/>
