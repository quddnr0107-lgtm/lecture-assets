<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무요원 수사 통보</title><desc id="desc">통보할 때: 수사를 시작한 때 공소청과 수사기관이 해당 범죄에 대한 수사를 시작한 때; 수사를 마친 때 수사를 마친 때 — 공소청은 공소제기 여부를 결정한 때 / 10일 이내: 통보 대상 복무기관의 장 및 지방병무청장·병무지청장에게 해당 사실과 결과를 통보하여야 함; 활용 가능 통보받은 기관장·관할청은 임무부여 등 복무관리에 활용할 수 있음</desc>
