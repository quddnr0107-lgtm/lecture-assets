<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-008-D02 · 통합방위 실무위원회는 무엇을 심의하나</title><desc id="desc">통합방위본부에 설치 · 의장은 본부 부본부장 위원의 구성：합참 장교 통합방위본부장이 지명하는 합동참모본부 부장급 장교；중앙협의회 측 각 중앙협의회 위원이 지명하는 소속 국장급 공무원 각 1명；관계기관 측 각 관계기관장이 지명하는 소속 국장급 공무원 각 1명 심의사항 · 4개 호：1 · 대비책 통합방위 대비책；2 · 부처 간 조정 정부 각 부처 간 통합방위 업무 조정；3 · 법규 개정 통합방위 관련 법규의 개정；4 · 포상·문책 시행령 제12조제2항의 포상 및 법 제23조의 문책요구 회의와 운영：회의 소집 정기: 분기 1회 원칙 / 임시: 의장이 필요하다고 인정할 때；의결 기준 재적위원 과반 출석 + 출석위원 과반 찬성；추가 운영사항 시행령에서 정한 것 외의 조직·운영 사항은 통합방위본부장이 정함 법 제8조제4항에 따라 정부 내 통합방위 업무 협조와 원활한 업무 수행을 위하여 설치한다. 본부의 사무 수행과 실무위원회의 심의를 서로 바꾸어 읽지 않는다.</desc>
