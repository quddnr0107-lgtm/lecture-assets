<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">보상 대상과 임무 중 이동</title><desc id="desc">군복무·동원: 군복무 전사·순직자의 유족과 전상·공상·공무상 질병으로 전역·면제된 사람 등; 동원소집등 임무·훈련 중 부상·사망한 사람 및 가족. 예비군대체복무는 제2항 적용 / 사회·대체복무: 순직·공상 사회복무·대체복무 및 예비군대체복무의 순직 유족·공상 소집해제자 등; 이동 범위 동원소집등·예비군대체복무는 지정장소 이동 중 및 해제 후 귀가 중 포함</desc>
