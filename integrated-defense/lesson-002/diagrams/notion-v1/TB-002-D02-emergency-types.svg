<text x="1102.6666666666665" y="656.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">단기간 내 치안질서 회복이 가능한</text>
<text x="1102.6666666666665" y="698.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">경우</text>
<text x="1102.6666666666665" y="775.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">지휘·통제</text>
<text x="1102.6666666666665" y="823.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시·도경찰청장, 지역군사령관 또는</text>
<text x="1102.6666666666665" y="865.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">함대사령관</text>
