<circle cx="858" cy="436" r="5" fill="#25241F"/>
<text x="888" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">임용 후 14일 이내</text>
<text x="888" y="488" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">중앙행정기관의 장 → 병무청장</text>
