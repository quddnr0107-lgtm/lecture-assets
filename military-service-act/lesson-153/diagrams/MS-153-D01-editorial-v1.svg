<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">복무의무 위반의 경고 누적</title><desc id="desc">2회·4회·3회: 통틀어 2회 이상 정당한 권한 없이 다른 사람의 정보를 검색·열람한 사유의 경고처분; 통틀어 4회 이상 근무방해·정치운동·가혹행위 등 제2호에 열거된 사유의 경고처분; 3회 특례 사회서비스 이용자에게 폭력·가혹행위를 한 경고 사유가 포함되면 3회 / 8회·개별 경고: 통틀어 8회 이상 정당한 사유 없는 지각·허가 없는 조퇴·근무장소 이탈 사유의 경고; 허위 공익복무 실적 예술·체육요원이 허위 공익복무 실적 제출 사유로 경고처분을 받은 경우</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-153</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">복무의무 위반의 경고 누적</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">법 제89조의3의 형은 모두 1년 이하의 징역</text>
