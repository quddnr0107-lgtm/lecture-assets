<text x="84" y="908" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">정보센터는 지역 단위의 비상설 정보지원기구, 조사팀은 중앙·지역 단위의 현지 조사조직이다.</text>
<text x="84" y="964" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">정보센터의 첩보 대상은 적의 침투·도발 및 적정 관련 사항이다. 법 제9조의2제3항은 대통령령에 위임하고, 시행령 제18조의2제3항은 그 밖의</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">세부사항을 대통령이 정하도록 한다. 법문이 정보센터에 명시한 비상설이라는 속성을 조사팀에도 일괄 적용하지 않는다. 두 조직은 병렬 비교이며 상하</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">지휘관계를 뜻하지 않는다.</text>
