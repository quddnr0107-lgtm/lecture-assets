<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">여비의 실비 지급과 반납기한</title><desc id="desc">비용 지급: 실비 기준 여비·병무용진단서·보완서류 발급비용은 예산 범위에서 실비 지급; 전형 응시 여비 지출 규모·전형 횟수 등을 고려하여 지급 횟수 제한 가능 / 환수 통지: 서면 통지 사유·발생사실·금액·반납기한·반납기관·이의신청방법 등 통지; 30일 이상 반납기한은 통지일부터 30일 이상으로 설정</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
