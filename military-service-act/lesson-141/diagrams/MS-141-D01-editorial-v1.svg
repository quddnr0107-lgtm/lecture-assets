<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전시특례의 핵심 연령·기한</title><desc id="desc">국방부장관: 45세까지 현역·예비역·보충역의 병, 전시근로역·대체역의 병역의무기간 연장 가능; 40세 이하 법정 승선근무예비역·특정 산업기능요원 복무완료자 등의 예비역간부 편입 / 병무청장: 7일 이내 거주지이동 신고기간 단축 가능; 18세부터 45세 예비역·보충역·병역준비역·전시근로역·대체역의 국외여행허가 대상 변경; 37세까지 병역판정·재병역판정·확인신체검사 및 현역병입영 의무 연장 가능</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-141</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 04</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">전시특례의 핵심 연령·기한</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">전시·사변 또는 동원령 선포 시의 조치</text>
