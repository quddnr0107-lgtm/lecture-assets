<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">보류해소의 기한과 예외</title><desc id="desc">DR-067 · 교육훈련 훈령 제23조. 14일과 30일의 기산점, 신분별 해소 처리를 구분한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-067</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">교육훈련</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">보류해소의 기한과 예외</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">14일과 30일의 기산점, 신분별 해소 처리를 구분한다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="990" y1="336" x2="990" y2="973" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">신고와 직권해소</text>
<path d="M81 385 C204.195 391 304.734 381 390.703 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">14일 / 30일</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">본인 신고</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">해소일부터 14일 이내: 홈페이지·FAX·소속 예비군지휘관</text>
<text x="144" y="603.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">기관 통보</text>
<text x="144" y="645.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">지체 없이 지휘관 직권해소; 안내받은 날부터 30일 이내</text>
<text x="144" y="692.62" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">신고서 제출</text>
<text x="144" y="767.38" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">전산입력</text>
<text x="144" y="809.38" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">예비군지휘관이 사유 발생 후 14일 이내 전산입력</text>
<text x="144" y="884.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">직권해소</text>
<text x="144" y="926.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">명백한 해소 사유는 근거 기록 후 당사자 통보</text>
<path d="M116 459 C96 459 92 466 92 485 L92 933 C92 956 102 965 117 965" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1030" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">신분별 처리</text>
<path d="M1018 341 C1040 311 1200.97 307 1254.97 331 C1275.97 346 1261.97 381 1232.97 393 C1136.48 413 1040 400 1017 375 C1004 363 1008 349 1018 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1034" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">휴직·휴학·외항선원</text>
<text x="1034" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">휴직 / 휴학</text>
<text x="1034" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">휴직기간 보류 유지 / 학생예비군</text>
<text x="1034" y="575.86" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">휴학 시 보류자 신분 해제</text>
<text x="1034" y="685.57" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">외항선원</text>
<text x="1034" y="727.57" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">하선일부터 90일 되는 날까지</text>
<text x="1034" y="774.43" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">미재승선 시 하선일 기준 해소</text>
<text x="1034" y="884.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">기간 중 훈련</text>
<text x="1034" y="926.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">연기 처리 (이수 아님)</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">귀국자의 보류해소도 14일. 30일은 직권해소 뒤 해소신고서 제출에 적용.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">교육훈련 훈령 제23조 · DR-067-D09</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
