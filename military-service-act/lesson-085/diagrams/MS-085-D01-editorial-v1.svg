<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병력동원훈련소집의 기간</title><desc id="desc">일반 소집: 대상 병력동원소집 대상자에게 실시한다.; 연간 30일 이내 일반 병력동원훈련소집의 법정 기간 한도. / 상비예비군: 선발된 사람 예비군법 제3조의3에 따라 상비예비군으로 선발된 사람.; 연간 180일 이내 상비예비군의 법정 소집기간 한도.</desc>
