<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">간부·공군 병은 제13조제4항에 따라 휴일훈련 대상에서 제외.</text>
