<text x="1102.6666666666665" y="608.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">직급·장소</text>
<text x="1102.6666666666665" y="655.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">5급 이상 공무원을 연락관으로 임명,</text>
<text x="1102.6666666666665" y="696.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">통합방위본부 군사상황실에 상주</text>
<text x="1102.6666666666665" y="777.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">그 밖의 기관</text>
<text x="1102.6666666666665" y="824.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">통합방위본부장이 요청하면 연락관</text>
<text x="1102.6666666666665" y="865.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">파견</text>
