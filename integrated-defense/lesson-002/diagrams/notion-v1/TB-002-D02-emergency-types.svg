<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-002-D02 · 갑종·을종·병종을 구분하는 기준</title><desc id="desc">사태별 발생 요건과 지휘·통제 주체를 함께 비교 갑종사태：적의 조직 일정한 조직체계를 갖춘 적；발생 요건 대규모 병력 침투 또는 대량살상무기 공격 등의 도발로 발생한 비상사태；지휘·통제 통합방위본부장 또는 지역군사령관 을종사태：발생 지역 일부 또는 여러 지역에 적이 침투·도발；치안 회복 단기간 내 치안질서 회복이 어려운 경우；지휘·통제 지역군사령관 병종사태：발생 요건 적의 침투·도발 위협이 예상되거나 소규모의 적이 침투；치안 회복 단기간 내 치안질서 회복이 가능한 경우；지휘·통제 시·도경찰청장, 지역군사령관 또는 함대사령관 세 사태의 정의를 비교한 것으로, 병종→을종→갑종의 자동 전환 절차가 아니다. 지휘·통제 주체의 구체적 관할과 기준은 법 제15조에서 별도로 확인한다.</desc>
