<text id="t7" x="128" y="496" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">35세까지 의무복무기간을</text>
<text id="t8" x="128" y="536" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">마칠 수 없으면 취소</text>
<text id="t9" x="128" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">예외 37세</text>
<text id="t10" x="128" y="642" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">법 제37조제1항제3호 해당자</text>
<text id="t11" x="128" y="682" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">의사·치과의사·한의사 자격 및</text>
