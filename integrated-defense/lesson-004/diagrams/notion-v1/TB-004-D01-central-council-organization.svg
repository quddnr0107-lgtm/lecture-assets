<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-004-D01 · 중앙협의회, 구성과 회의 운영</title><desc id="desc">국무총리 소속 · 국무총리 의장 · 본부 부본부장 간사 설치와 담당자：소속 국무총리 소속으로 설치；의장 국무총리；간사 1명 통합방위본부 부본부장 위원의 구성：법정 위원 법 제4조제2항에 열거된 장관·기관장 및 통합방위본부장；지자체장 위원 지방자치단체장 중 중앙협의회 의장이 위촉；전문인사 위원 통합방위 식견·경험이 풍부한 사람 중 의장이 임명하거나 위촉 소집과 의결 기준：소집 의장이 필요하다고 인정할 때；일반 의결 재적위원 과반 출석 + 출석위원 과반 찬성；선포·해제 심의 재적위원 과반 출석 + 출석위원 3분의 2 이상 찬성 일반 의결은 시행령에 특별한 규정이 없는 경우 적용한다(시행령 제7조제2항). 사태 선포·해제의 특별 정족수는 법 제12조제3항·제5항, 제14조제1항·제4항에 대한 시행령 제24조제1항의 기준이다. 법정 위원의 전체 기관명은 조문에서 확인하며, 이 도식은 구성 방식과 역할을 요약한다. 국회 또는 시·도의회의 해제 요구에 따른 심의 생략은 법 제14조제2항·제5항 단서에 따른다.</desc>
