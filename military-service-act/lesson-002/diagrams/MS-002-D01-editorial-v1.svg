<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">징집·소집·입영의 구별</title><desc id="desc">의무의 부과: 징집 국가가 병역의무자에게 현역에 복무할 의무를 부과; 소집 국가가 예비역·보충역·전시근로역·대체역에 현역 복무 외 군복무의무 또는 공익 분야 복무의무를 부과 / 입영: 계기 징집·소집 또는 지원에 의함; 행위 병역의무자가 군부대에 들어가는 것</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
