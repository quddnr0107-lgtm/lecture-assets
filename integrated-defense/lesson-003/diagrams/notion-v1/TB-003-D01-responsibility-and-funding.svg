<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-003-D01 · 시책·협조는 의무, 비용 지원은 재량</title><desc id="desc">책임 주체와 동원비용 지원의 조건·범위를 구분 하여야 한다 · 법 제3조제1~3항：정부 국가방위요소 육성·통합방위태세 확립 시책을 마련；지방자치단체장 관할구역별 통합방위태세 확립 시책을 마련；행정·군부대장 각급 행정기관 및 군부대의 장은 작전 수행을 위해 서로 지원·협조 지원할 수 있다 · 법 제3조제4항：발생 조건 통합방위사태 선포에 따른 국가방위요소 동원비용；지원 방식 정부가 대통령령에 따라 예산 범위에서 해당 지방자치단체에 지원 지원 비용 · 시행령 제4조：예비군 급식비 통합방위작전에 동원된 예비군의 급식비；그 밖의 비용 중앙협의회에서 의결한 비용 중앙관서의 장은 소관업무와 대통령이 정하는 바에 따라 시책을 마련한다(시행령 제2조제1항). 지방자치단체장은 지역군사령관 및 시·도경찰청장 등과 협의하여 예규 작성 등 시책을 마련한다(시행령 제2조제2항). 주체별 의무와 지원 조건을 비교하며 시간 순서나 상하 지휘관계를 뜻하지 않는다.</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#FFFEFC"/>
<text x="80" y="73" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">무한회독  /  통합방위법</text>
<text x="1520" y="73" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="end">03강   ·   제3조   /   D01</text>
<text x="80" y="177" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="66" font-weight="700" fill="#25241F" text-anchor="start">시책·협조는 의무, 비용 지원은 재량</text>
<text x="84" y="235" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">책임 주체와 동원비용 지원의 조건·범위를 구분</text>
