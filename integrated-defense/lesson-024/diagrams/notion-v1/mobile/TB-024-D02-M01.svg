<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-024-D02 · 문책 사유와 계획 시정요구</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 24강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">문책 사유와 계획 시정요구</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직무를 게을리한 사람에 대한 문책과 방호계획의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시정은 별도 권한</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">문책 대상 4유형</text>
<path d="M80 433L397.578125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">정당 사유 없는 기피</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전·훈련을 정당한 사유 없이 기피하여</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전·훈련에 중대한 지장</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">고의 기피·불복</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">참여자가 고의로 기피하고 통제에 불복하여 중대한</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지장 또는 전투력 손실</text>
<path d="M80 886L80 1061" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="921" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">고의·중과실 대응</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전 참여자의 거짓·지연보고 등 부실 대응으로</text>
<text x="104" y="1044" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전의 지연·변경·실패</text>
<path d="M80 1092L80 1267" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1127" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">담당 공무원 태만</text>
<text x="104" y="1189" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">업무 태만으로 통합방위태세 허점 등 통합방위</text>
<text x="104" y="1250" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">업무에 중대한 지장</text>
<text x="80" y="1337" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">국가중요시설 계획 시정</text>
<path d="M80 1347L548.4375 1347" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1388L80 1502" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">요구 주체</text>
<text x="104" y="1485" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제23조 · TB-024-D02 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
