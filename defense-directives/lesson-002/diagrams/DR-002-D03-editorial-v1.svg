<text x="144" y="872.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">편성 단위</text>
<text x="144" y="914.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">특별자치시·시(구가 있는 시</text>
<text x="144" y="962.4" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">제외)·군·자치구</text>
