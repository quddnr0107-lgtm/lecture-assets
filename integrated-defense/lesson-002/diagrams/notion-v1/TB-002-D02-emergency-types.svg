<text x="607.3333333333333" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">일부 또는 여러 지역에 적이</text>
<text x="607.3333333333333" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">침투·도발</text>
<text x="607.3333333333333" y="628" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">치안 회복</text>
<text x="607.3333333333333" y="676" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">단기간 내 치안질서 회복이 어려운</text>
<text x="607.3333333333333" y="718" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">경우</text>
<text x="607.3333333333333" y="815" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">지휘·통제</text>
<text x="607.3333333333333" y="863" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지역군사령관</text>
