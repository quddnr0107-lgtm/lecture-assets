<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">일반 신상변동</text>
<path d="M80 389 Q240 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="128" y="436" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">학업·자격</text>
<circle cx="98" cy="427" r="5" fill="#25241F"/>
<text x="128" y="479" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">학교·과정 중단</text>
<text x="128" y="520" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">제한연령 내 이수·취득 불가</text>
<text x="128" y="588" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">군전공의</text>
<circle cx="98" cy="579" r="5" fill="#25241F"/>
<text x="128" y="631" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">병무청장 허가 없는 기관·전공 변경</text>
<text x="128" y="672" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">또는 퇴직</text>
<text x="128" y="740" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">그 밖의 경우</text>
<circle cx="98" cy="731" r="5" fill="#25241F"/>
<text x="128" y="783" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">가사사정 해당</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">군종 및 공통</text>
<path d="M840 389 Q1000 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="888" y="436" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">군종</text>
<circle cx="858" cy="427" r="5" fill="#25241F"/>
<text x="888" y="479" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">전학·종교단체 이탈</text>
<text x="888" y="520" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">성직취득 보장 철회</text>
<text x="888" y="588" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">본인 의사</text>
<circle cx="858" cy="579" r="5" fill="#25241F"/>
<text x="888" y="631" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">후보생 신분 포기 희망</text>
<text x="888" y="699" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">학업 일정</text>
<circle cx="858" cy="690" r="5" fill="#25241F"/>
<text x="888" y="742" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#25241F" text-anchor="start">과정을 마치는 연도·월 변경</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">관할 지방병무청장에게 통보 / 군종사관후보생은 국방부장관에게</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-094 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
