<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">대상과 조건</text>
<path d="M80 389 Q230 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="98" cy="436" r="5" fill="#25241F"/>
<text x="128" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">국외이주 목적 허가 후 국외체류</text>
<text x="128" y="488" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">제149조제1항 허가 간주 포함</text>
<circle cx="98" cy="544" r="5" fill="#25241F"/>
<text x="128" y="554" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">경제 또는 과학기술 분야 박사</text>
