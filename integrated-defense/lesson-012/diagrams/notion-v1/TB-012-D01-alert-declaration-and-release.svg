<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">발령은 재량, 상황 종료·지시는 해제 의무, 통합방위사태 선포는 해제 간주.</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">선보고 예외는 통신두절 등 불가피한 사유에 한한다. 경계태세의 3급·2급·1급과 사태의 갑종·을종·병종은 다른 구분이다.</text>
