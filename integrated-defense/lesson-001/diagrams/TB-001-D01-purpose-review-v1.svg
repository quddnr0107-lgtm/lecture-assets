<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">통합방위법의 목적</title><desc id="desc">통합방위법 제1조의 논리 구조. 적의 침투·도발이나 그 위협에 대응하기 위해 국가 총력전의 개념을 바탕으로 국가방위요소를 통합·운용하기 위한 통합방위 대책을 수립·시행하는 데 필요한 사항을 규정한다. 절차 순서를 표현한 도식이 아니다.</desc>
