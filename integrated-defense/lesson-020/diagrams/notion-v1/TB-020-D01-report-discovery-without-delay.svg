<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-020-D01 · 발견한 누구든지, 지체 없이 신고</title><desc id="desc">적의 침투·출현뿐 아니라 그 흔적의 발견도 신고 대상 ① 발견：발견한 사람 누구든지 신고 의무를 부담；발견 대상 적의 침투 또는 출현이나 그러한 흔적 ② 지체 없이 신고：신고 내용 발견한 사실을 신고；신고 시점 지체 없이 신고하여야 함 ③ 둘 중 한 기관：군부대 군부대에 신고；행정기관 또는 행정기관에 신고 신고 수신기관은 “군부대 또는 행정기관”이다.</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#FFFEFC"/>
<text x="80" y="73" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">무한회독  /  통합방위법</text>
<text x="1520" y="73" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="end">20강   ·   제19조   /   D01</text>
