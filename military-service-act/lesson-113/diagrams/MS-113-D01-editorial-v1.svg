<text x="752" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제74조①</text>
<text x="128" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">복무 시작</text>
<text x="128" y="509" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">입영하거나 승선근무예비역·보충역·</text>
<text x="128" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">대체복무요원 복무 시 휴직</text>
<text x="752" y="656.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제74조①</text>
<text x="128" y="656.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">복무 종료</text>
<text x="128" y="714.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">복무를 마치면 복직시켜야 함</text>
<text x="752" y="807.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">영 제150조</text>
<text x="128" y="807.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">본인의 신고</text>
<text x="128" y="865.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">통지서 수령 및</text>
<text x="128" y="920.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">전역·소집해제·복무만료·면제 시</text>
<text x="128" y="975.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">소속기관 등에 신고</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">적용에서 제외</text>
<path d="M825 342 C865.5 315 1049.3 314 1113.2 338 C1139.2 362 1107.2 390 1031.4 397 C901.3 408 812 385 822 357 Z" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M865 429 C851 429 849 439 849 453 L849 865.0 C849 882.0 855 888.0 867 888.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1512" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제74조①</text>
<text x="888" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">재직하며 복무</text>
<text x="888" y="509" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">해당 기관에 재직하면서</text>
<text x="888" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">승선근무예비역·보충역 복무를 하는</text>
<text x="888" y="619" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">사람</text>
<text x="1512" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제74조① 단서</text>
<text x="888" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">복무 중 범죄</text>
<text x="888" y="820" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">범죄행위로 제적·전역 또는</text>
<text x="888" y="875" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">소집해제된 경우 복직보장 예외</text>
<line x1="80" y1="1052" x2="1520" y2="1052" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
