<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">국가방위요소 7개</title><desc id="desc">통합방위법 제2조제2호 가목부터 사목까지의 국가방위요소. 국군, 경찰청·해양경찰청 및 그 소속 기관과 제주특별법상 자치경찰기구, 소방대, 가목부터 다목까지의 경우를 제외한 국가기관 및 지방자치단체, 예비군, 민방위대, 제6조에 따라 통합방위협의회를 두는 직장.</desc>
