<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">예술·체육요원 편입 대상</title><desc id="desc">현역·승선근무 계열: 입영 대상자 현역병입영 대상자.; 복무 중인 사람 현역병(상근예비역·전환복무 포함) 또는 승선근무예비역으로 복무 중인 사람. / 보충역 계열: 소집 대상자 사회복무요원 소집 대상인 보충역.; 복무 중인 보충역 사회복무·공중보건·전담의사·공익법무관·공중방역수의사·전문연구·산업기능요원 복무자.</desc>
