<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역판정검사전담의사의 신분</title><desc id="desc">신분과 감독: 병무청 소속 국가공무원법상 임기제공무원. 군인보수의 범위에서 보수·여비 등을 지급한다.; 병무청장 복무를 지휘·감독하며 허가 또는 정당한 사유 없는 근무지 이탈은 금지된다. / 직무교육·수련: 직무교육 1개월 병무청장은 1개월의 범위에서 직무교육을 실시한다.; 수련 3개월 병역판정검사를 하지 않는 기간 중 3개월 범위에서 군병원·지정병원 수련을 실시할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-062</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
