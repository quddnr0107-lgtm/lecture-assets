<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">예술·체육 특기 요건</title><desc id="desc">체육 분야: 올림픽 3위 이상 입상; 아시아경기대회 1위 입상 / 예술 분야의 기준: 국내 경연 국제대회가 없는 분야의 지정 국내대회에서 1위 중 최고 성적. 동순위 등은 추천기준 적용.; 국가무형유산 지정 분야에서 5년 이상 전수교육을 받고 병무청장이 정하는 분야의 자격 취득.</desc>
