<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-002-D03 · 용어를 관계와 기준으로 구분</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 02강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">용어를 관계와 기준으로 구분</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">방위체계 · 적의 행동 · 보호 기능을 나누어 읽기</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 372L285.046875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="446" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전 지휘자는</text>
<text x="80" y="507" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">본부장·지역군사령관·함대사령관 또는</text>
<text x="80" y="568" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도경찰청장이다.</text>
<text x="80" y="649" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역군사령관의 지정 주체인 본부장은</text>
<text x="80" y="710" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장을 말한다.</text>
<text x="80" y="797" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 807L270.0625 807" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="881" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법</text>
<text x="80" y="942" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제2조제1호·제4호·제5호·제9호~제13호</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제2조 · TB-002-D03 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
