<text x="1512" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제53조①2호의2</text>
<text x="888" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">대체역</text>
<text x="888" y="820" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">대체역 중 대체복무요원은 제외한다.</text>
<line x1="80" y1="982" x2="1520" y2="982" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="84" y="1021" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#25241F" text-anchor="start">전시근로소집에 대비한 점검은 연간 2일 이내로 할 수 있다.</text>
