<title id="title">TB-009-D01 · 지원본부의 설치와 사무</title><desc id="desc">법 제9조 · 시행령 제17조 | 지역별로 설치하고 관할지역의 지원을 담당 설치 주체：시·도 시·도지사 소속으로 시·도 통합방위 지원본부 설치；시·군·구 시장·군수·구청장 소속으로 해당 지원본부 설치；읍·면·동 읍장·면장·동장 소속으로 해당 지원본부 설치 법률상 기본 사무：지원계획 통합방위작전·훈련의 지원계획 수립·시행；종합상황실 통합방위 종합상황실 설치·운영；방위요소 국가방위요소 육성·지원；주민신고 통합방위 취약지역 대상 주민신고 체제 확립 시행령의 추가 사무：동원 지원 통합방위작전 관련 동원 업무 지원；보도본부 지원 지역 합동보도본부 설치 지원；협의회 결정 지역협의회가 심의·의결한 사항 시행 기본 사무 외의 사항은 법 제9조제2항제5호에 따라 대통령령 또는 조례로 정한다. 설치 주체와 지원본부장 직위는 구분한다. 본부장 기준은 D02 참조. 각 섹션은 병렬 분류이며 지휘·보고의 순서를 뜻하지 않는다.</desc>
