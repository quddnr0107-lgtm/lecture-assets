<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">적성 결정과 병과 부여</title><desc id="desc">대상 확인: 신체등급 1~4급 신체검사 결과 1~4급인 사람 — 현역병지원 신체검사 포함 / 적성 분류·결정: 지방병무청장 자격·면허·전공분야 등을 고려하여 군복무에 필요한 적성 결정 / 병과 부여: 각 군 참모총장 적성에 적합한 병과 부여. 군사특기로 세분할 수 있고 군사특기도 부여</desc>
