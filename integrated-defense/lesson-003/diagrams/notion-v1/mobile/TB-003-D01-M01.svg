<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-003-D01 · 시책·협조는 의무, 비용 지원은 재량</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 03강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">시책·협조는 의무, 비용 지원은 재량</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">책임 주체와 동원비용 지원의 조건·범위를 구분</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">하여야 한다 · 법 제3조제1~3항</text>
<path d="M80 372L711.890625 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">정부</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가방위요소 육성·통합방위태세 확립 시책을 마련</text>
<path d="M80 558L80 672" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">지방자치단체장</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관할구역별 통합방위태세 확립 시책을 마련</text>
<path d="M80 703L80 878" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="738" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">행정·군부대장</text>
<text x="104" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각급 행정기관 및 군부대의 장은 작전 수행을 위해</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">서로 지원·협조</text>
<text x="80" y="948" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지원할 수 있다 · 법 제3조제4항</text>
<path d="M80 958L712.859375 958" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 999L80 1113" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1034" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">발생 조건</text>
<text x="104" y="1096" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위사태 선포에 따른 국가방위요소 동원비용</text>
<path d="M80 1144L80 1319" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1179" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">지원 방식</text>
<text x="104" y="1241" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정부가 대통령령에 따라 예산 범위에서 해당</text>
<text x="104" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지방자치단체에 지원</text>
<text x="80" y="1389" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지원 비용 · 시행령 제4조</text>
<path d="M80 1399L582.796875 1399" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1440L80 1554" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1475" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">예비군 급식비</text>
<text x="104" y="1537" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전에 동원된 예비군의 급식비</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제3조 · TB-003-D01 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
