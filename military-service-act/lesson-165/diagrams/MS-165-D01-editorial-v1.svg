<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">양벌규정과 법인의 면책</title><desc id="desc">법인의 업무 관련: 적용 위반 고용주·업체장: 제84조제1항제1호, 제92조제1~3항, 제93조 위반; 공공·사회복지기관장 제84조제1항제2호 또는 제92조의2 위반 / 법인의 형·예외: 법인 벌금 행위자를 벌하는 외에 법인도 300만원 이상 3천만원 이하 벌금; 면책 사유 위반 방지를 위해 해당 업무에 상당한 주의와 감독을 게을리하지 않은 법인</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-165</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">양벌규정과 법인의 면책</text>
