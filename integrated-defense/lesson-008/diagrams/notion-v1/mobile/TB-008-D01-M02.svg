<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-008-D01 · 통합방위본부의 설치와 5개 사무</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 08강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">통합방위본부의 설치와 5개 사무</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동참모본부에 설치 · 본부장 1명과 부본부장 1명</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">작전·훈련·기관 협조</text>
<path d="M80 372L503.53125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">지침과 계획</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전, 훈련지침·계획의 수립 및 그 시행의</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">조정·통제</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">관계기관</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">업무협조 및 사업집행사항의 협의·조정</text>
<text x="80" y="803" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 813L314.21875 813" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">통합방위본부의 법정 사무 5개와 실무위원회의</text>
<text x="80" y="928" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">심의사항을 구별한다.</text>
<text x="80" y="1015" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1025L285.046875 1025" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1099" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">두 업무 묶음은 학습 편의를 위한 편집상 구분이며 법</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제8조제3항의 5개 호를 유지했다.</text>
<text x="80" y="1241" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">부본부장을 특정 조직 직함으로 바꾸지 않고 법</text>
<text x="80" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제8조제2항의 기능상 지정 기준을 요약했다.</text>
<text x="80" y="1383" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">본부 조직과 분장사무의 구성 관계를 나타낸다.</text>
<text x="80" y="1470" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1480L270.0625 1480" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1554" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제8조제1항~제3항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제8조 · TB-008-D01 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
