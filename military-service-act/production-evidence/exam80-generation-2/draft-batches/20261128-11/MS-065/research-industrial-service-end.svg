<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko"><title>복무 관리와 편입취소 유보</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-065</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 H1520 M80 280 H1520 M800 330 V925 M80 950 H1520 M80 1040 H1520" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">복무 관리와 편입취소 유보</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시행규칙 제60·62·64·65·65조의2</text>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">복무 관리</text>
<path d="M80 389 Q240 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="98" cy="421" r="5" fill="#25241F"/>
<text x="128" y="430" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">전직·교육훈련·파견 승인</text>
<text x="128" y="467" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">62호 신청서</text>
<circle cx="98" cy="511" r="5" fill="#25241F"/>
<text x="128" y="520" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">신상변동 통보</text>
<text x="128" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">76호 통보서 → 지방병무청장이</text>
<text x="128" y="594" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">67호 명부 정리</text>
<circle cx="98" cy="638" r="5" fill="#25241F"/>
<text x="128" y="647" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">복무만료 처분</text>
<text x="128" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">75호 / 관할 지방병무청장이</text>
<text x="128" y="721" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">병적기록표·명부 정리</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">해고 다툼 중 유보</text>
<path d="M840 389 Q1000 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="858" cy="421" r="5" fill="#25241F"/>
<text x="888" y="430" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">신청</text>
<text x="888" y="467" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">62호 신청서에 구제신청서 사본</text>
<text x="888" y="504" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">또는 소송서류 사본을 첨부</text>
<circle cx="858" cy="548" r="5" fill="#25241F"/>
<text x="888" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제출</text>
<text x="888" y="594" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">관할 지방병무청장</text>
<circle cx="858" cy="638" r="5" fill="#25241F"/>
<text x="888" y="647" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">유보 이후</text>
<text x="888" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">결과 수시 확인 → 편입취소 여부 결정</text>
<text x="80" y="990" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#25241F" text-anchor="start">해고를 다투는 중이면 편입취소 유보 가능</text>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-065 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>