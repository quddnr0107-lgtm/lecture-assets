<text x="112" y="484" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="start">작전·훈련을 정당한 사유 없이 기피하여 작전·훈련에 중대한 지장</text>
<text x="112" y="556.6666666666666" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">고의 기피·불복</text>
