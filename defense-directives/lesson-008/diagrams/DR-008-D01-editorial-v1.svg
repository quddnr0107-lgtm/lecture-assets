<path d="M844 341 C866 311 1065.61 307 1119.61 331 C1140.61 346 1126.61 381 1097.61 393 C981.805 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제2항</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">사유</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">다른 지역 자원 부족 또는 불가피한 사유</text>
<text x="860" y="690.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">대상·범위</text>
<text x="860" y="732.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">예비역 장교·준사관·부사관인 예비군대원을</text>
<text x="860" y="783.24" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">시·군·자치구 내 인접지역에 확산</text>
