<text x="104" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직장 통합방위협의회</text>
<text x="80" y="887" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">통합·운영의 상대</text>
