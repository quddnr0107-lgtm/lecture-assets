<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-012-D01 · 경계태세의 발령과 해제</title><desc id="desc">법 제11조 · 시행령 제21조·제22조 | 적의 침투·도발 또는 위협이 예상될 때 발령 가능 발령권자·등급：서울 외 군 연대장급 이상 지휘관 / 해·공군은 독립전대장급 이상；서울 외 경찰 경찰서장급 이상 지휘관；서울특별시 대통령이 정하는 군부대의 장；등급 경계태세 3급·2급·1급 / 세부내용·조치는 대통령이 정함 발령·해제 절차：원칙: 선보고 차상급 지휘관 보고 후 발령·해제; 통신두절 등 불가피한 사유는 예외；즉시 통보 관할지역의 모든 국가방위요소에 발령·해제 사실 통보；본부장 보고 통합방위본부장에게 보고하거나 통보 체계 구축·해제：발령 시 해당 지역 국가방위요소의 지휘·협조체계 구축 의무；해제 의무 상황 종료 또는 상급 지휘관 지시가 있으면 발령권자가 해제；해제 간주 법 제12조에 따라 통합방위사태가 선포되면 해제된 것으로 봄 법 제11조는 4개 항으로 구성된다. 발령권자·절차·등급의 세부사항은 시행령 제21조·제22조이다. 선보고 예외는 통신두절 등 불가피한 사유가 있을 때에 한한다. 서울특별시와 그 밖의 지역의 발령권자를 서로 혼합하지 않는다. 경계태세 3급·2급·1급을 통합방위사태 갑종·을종·병종에 일대일 대응시키지 않는다.</desc>
