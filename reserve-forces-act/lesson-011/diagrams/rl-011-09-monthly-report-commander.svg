<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">직장 지휘관의 월별 보고</title>
<desc id="desc">RL-011 예비군법 제7조, 무장. 매월 말일 기준으로 정리하여 다음 달에 보고</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F4F4" stroke="none"/>
<rect x="64" y="38" width="7" height="29" rx="3" fill="#275AA3" stroke="none"/>
<text x="87" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#275AA3" text-anchor="start">제80회  ·  예비군법</text>
<text x="1536" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#545860" text-anchor="end">처리 절차</text>
<text x="64" y="142" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="52" font-weight="700" fill="#202124" text-anchor="start">직장 지휘관의 월별 보고</text>
<text x="67" y="190" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#545860" text-anchor="start">매월 말일 기준으로 정리하여 다음 달에 보고</text>
<rect x="64" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="64" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="64" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="106" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">정리와 입력</text>
<text x="106" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">보고 주체</text>
<text x="106" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">직장예비군부대의 지휘관</text>
<line x1="106" y1="462.5" x2="742" y2="462.5" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="106" y="504.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">기준과 내용</text>
<text x="106" y="550.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">매월 말일 기준 무기·탄약·장비 등의 유지·관리</text>
<text x="106" y="594.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">상황</text>
<line x1="106" y1="622.0" x2="742" y2="622.0" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="106" y="664" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">먼저 입력</text>
<text x="106" y="710" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">예비군업무 통합관리용 전산시스템 양식에 입력</text>
<rect x="816" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="816" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="816" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="858" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">관할 경찰서장에게 보고</text>
<text x="858" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">기한</text>
<text x="858" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">다음 달 5일까지 보고하여야 함</text>
<line x1="858" y1="469" x2="1494" y2="469" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="858" y="511" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">보고 방법</text>
<text x="858" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">서면 또는 전산시스템을 통하여 보고</text>
<rect x="64" y="760" width="1472" height="77" rx="12" fill="#E6EDF7" stroke="none"/>
<rect x="64" y="760" width="6" height="77" rx="3" fill="#275AA3" stroke="none"/>
<text x="92" y="807" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#275AA3" text-anchor="start">월말 기준 → 전산시스템 입력 → 다음 달 5일까지 보고</text>
<text x="66" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#545860" text-anchor="start">예비군법 제7조</text>
<text x="1536" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#545860" text-anchor="end">RL-011  ·  09 / 14</text>
</svg>
