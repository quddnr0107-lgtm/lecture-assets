<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" lang="ko" role="img"><title>국외여행 제한과 예외</title><rect width="1600" height="1120" fill="#FFFEFC"/>
