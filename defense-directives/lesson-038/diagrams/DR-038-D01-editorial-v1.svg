<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">개인피복과 장구류의 확보</title><desc id="desc">DR-038 · 조직·편성 훈령 제49조. 전역 시 지참품목과 저장 보관품목의 지급방식을 구분한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-038</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">조직·편성·운영</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">개인피복과 장구류의 확보</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">전역 시 지참품목과 저장 보관품목의 지급방식을 구분한다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="990" y1="336" x2="990" y2="1002" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">피복·장구류</text>
<path d="M81 385 C175.957 391 253.636 381 323.469 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">확보와 보유</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제1항 · 예비군복</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">전역 시 개인 지참 품목을 활용한다.</text>
<text x="144" y="646.82" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제1항 · 저장 보관품</text>
<text x="144" y="688.82" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">작전소요량에 따라 예비군부대에서 보유하고 대원에게</text>
<text x="144" y="739.94" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">지급한다.</text>
<text x="144" y="857.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2항제1호 · 연차보급</text>
<text x="144" y="899.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">기동대·전방군단 주민이동지역 부대·특전예비군의</text>
<text x="144" y="950.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">완전군장 대상품목을 연차 보급한다.</text>
<path d="M116 459 C96 459 92 466 92 485 L92 962 C92 985 102 994 117 994" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1030" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">추가 획득</text>
<path d="M1018 341 C1040 311 1162.33 307 1216.33 331 C1237.33 346 1223.33 381 1194.33 393 C1117.16 413 1040 400 1017 375 C1004 363 1008 349 1018 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1034" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">별도 소요·기부·자체구입</text>
<text x="1034" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2항제1호 · 특별소요</text>
<text x="1034" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">특별소요에 의한 물자보급은</text>
<text x="1034" y="580.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">별도 방침에 따른다.</text>
<text x="1034" y="741.24" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2항제2호 · 기부 등</text>
<text x="1034" y="783.24" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">기부·자체구입 물자는 예비군</text>
<text x="1034" y="834.36" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">재산으로 등재한 뒤</text>
<text x="1034" y="885.48" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">예비군용으로 사용할 수 있다.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제49조 · DR-038-D01</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
