<text x="112" y="676" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">법 제21조제4항에 따라 지정된</text>
<text x="112" y="718" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">국가중요시설인 직장</text>
<path d="M552.3333333333333 316 L552.3333333333333 897" fill="none" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="575.3333333333333" y="351" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">원하면 둘 수 있는 직장</text>
<path d="M575.3333333333333 378 C682.4755208333332 383 807.4747395833333 375 932.4739583333333 379" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="575.3333333333333" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">소대급 자원</text>
<text x="575.3333333333333" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">소대급의 직장예비군 자원이 있는</text>
<text x="575.3333333333333" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">직장</text>
