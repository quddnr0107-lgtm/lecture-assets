<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-015-D01 · 평상 회복과 의회 요구의 해제</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 15강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">평상 회복과 의회 요구의 해제</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제14조 | 평상 회복 경로와 의회 요구 경로를 구별</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 372L285.046875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="446" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">세 번째 섹션은 첫째·둘째 경로의 심의 단계를</text>
<text x="80" y="507" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">건너뛰는 별도 조건 분기이다.</text>
<text x="80" y="588" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제14조제1항·제4항은 평상상태 회복 또는 해당</text>
<text x="80" y="649" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의회의 해제 요구를 해제 사유로 정한다.</text>
<text x="80" y="730" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해제 건의도 평상상태 회복 시의 의무이며,</text>
<text x="80" y="791" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시도지사의 대통령 보고 의무는 의회 요구 경로에도</text>
<text x="80" y="852" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적용된다.</text>
<text x="80" y="933" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">선포·해제 시 서면통지·게시판 공고·신문방송 보도</text>
<text x="80" y="994" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">방법은 시행령 제24조제2항에 따른다.</text>
<text x="80" y="1081" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1091L270.0625 1091" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1165" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제14조제1항~제6항</text>
<text x="80" y="1246" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제24조제2항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제14조 · TB-015-D01 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
