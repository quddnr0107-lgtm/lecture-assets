<text x="888" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">포함한다.</text>
<text x="1512" y="707" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제69조의2①</text>
<text x="888" y="707" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">입영·전역·소집해제</text>
<text x="888" y="765" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">주민등록표 정리에 필요한</text>
