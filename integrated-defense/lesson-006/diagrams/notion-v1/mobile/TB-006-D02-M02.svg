<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-006-D02 · 직장협의회와 산업단지협의회</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 06강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">직장협의회와 산업단지협의회</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">심의 내용·설치 요건·회의 운영의 비교</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">산업단지협의회 (계속)</text>
<path d="M80 372L524.578125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">심의 사항</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">산업단지 방위대책·지원계획 및 예비군 부대</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">육성·운용·경비</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">운영 규정</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역협의회 또는 직장협의회 관련 규정을 준용</text>
<text x="80" y="803" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 813L314.21875 813" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">산업단지협의회는 같은 산업단지의 직장예비군</text>
<text x="80" y="928" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">자원을 통합 편성한 경우 둘 수 있다.</text>
<text x="80" y="1015" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1025L285.046875 1025" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1099" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">산업단지협의회 위원은 산업단지 예비군 부대장, 방위</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관련 기관 관계관, 기업체 대표 등 의장이 위촉하는</text>
<text x="80" y="1221" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사람이다.</text>
<text x="80" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">산업단지의 법정 범위는 시행령 제11조제1항의</text>
<text x="80" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">자유무역지역·산업단지·산업통상부장관 지정 중요</text>
<text x="80" y="1424" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">산업시설이다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제6조 · TB-006-D02 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
