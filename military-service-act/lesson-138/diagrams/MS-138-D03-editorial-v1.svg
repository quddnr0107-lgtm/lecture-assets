<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역명문가 심사위원회</title><desc id="desc">위원 구성: 5명 이상 7명 이내 위원장 1명을 포함. 위원장은 위원 중에서 호선; 2년 임기 병무청장이 학식·경험 있는 사람을 위촉. 한 차례만 연임 가능 / 운영: 회의 기준 재적위원 과반수 출석, 출석위원 과반수 찬성; 존속기한 2029년 4월 30일까지 존속</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-138</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   03 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병역명문가 심사위원회</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">병무청에 두는 위원회의 구성</text>
