<text x="1102.6666666666665" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">승인·안내</text>
<text x="1102.6666666666665" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">작전지휘관의 사전 승인 후 제공된</text>
<text x="1102.6666666666665" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">안내요원의 안내에 따라 취재</text>
