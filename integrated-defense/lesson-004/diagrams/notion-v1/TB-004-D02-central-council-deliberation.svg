<text x="867.0" y="451" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">업무 조정</text>
<text x="867.0" y="505" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">정부 각 부처 및 관계 기관 간 통합방위 관련</text>
<text x="867.0" y="553" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">업무의 조정</text>
<text x="867.0" y="654.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">동원 비용</text>
<text x="867.0" y="708.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">시행령 제4조에 따른 예비군 급식비 등 동원비용</text>
<text x="867.0" y="809.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">위원 제출 안건</text>
<text x="867.0" y="863.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">그 밖에 중앙협의회 위원이 제출하는 안건</text>
