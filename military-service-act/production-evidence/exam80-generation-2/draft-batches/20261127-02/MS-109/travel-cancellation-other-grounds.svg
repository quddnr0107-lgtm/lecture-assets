<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" lang="ko" role="img"><title>허가 취소의 나머지 사유</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-109</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 L1520 105" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">허가 취소의 나머지 사유</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시행령 제147조의2 · 기간 수치 외의 판단 기준</text>
<path d="M80 280 L1520 280" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">국외이주 목적</text>
<path d="M80 389 Q230 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="98" cy="436" r="5" fill="#25241F"/>
<text x="128" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">영주귀국 신고</text>
<circle cx="98" cy="512" r="5" fill="#25241F"/>
<text x="128" y="522" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">1년 중 국내 체재 통틀어 6개월 이상</text>
<circle cx="98" cy="588" r="5" fill="#25241F"/>
<text x="128" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">병무청장 고시 영리활동 (국내취업 등)</text>
<circle cx="98" cy="664" r="5" fill="#25241F"/>
<text x="128" y="674" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">부모와 거주하는 요건의 허가</text>
<text x="128" y="716" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">부모가 해당 사유에 걸려도 적용</text>
<circle cx="98" cy="772" r="5" fill="#25241F"/>
<text x="128" y="782" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">체재기간 제외</text>
<text x="128" y="824" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">정해진 사유로 60일 이내 머문 기간</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">그 밖의 취소 사유</text>
<path d="M840 389 Q990 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="858" cy="436" r="5" fill="#25241F"/>
<text x="888" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">허가기간 만료 전에 귀국하여</text>
<text x="888" y="488" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">병역의무를 이행하려는 경우</text>
<circle cx="858" cy="544" r="5" fill="#25241F"/>
<text x="888" y="554" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">허가 요건을 유지하지 못한 경우</text>
<circle cx="858" cy="620" r="5" fill="#25241F"/>
<text x="888" y="630" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">본인이 취소를 원하는 경우</text>
<text x="888" y="672" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">지방병무청장에게 신청서 제출</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">취소 및 병역의무 부과 가능 / 기간 수치와 유예는 D07 참조</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
