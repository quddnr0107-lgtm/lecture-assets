<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko"><title>병적기록표와 복무기록표</title><rect width="1600" height="1120" fill="#FFFEFC"/>
