<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-002-D03 · 용어를 관계와 기준으로 구분</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 02강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">용어를 관계와 기준으로 구분</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">방위체계 · 적의 행동 · 보호 기능을 나누어 읽기</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">적의 행동과 상태 (계속)</text>
<path d="M80 372L551.453125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">위협</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대한민국 침투·도발이 예상되는 적의 능력과 기도가</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">드러난 상태</text>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">보호 기능과 중요시설</text>
<path d="M80 668L504.28125 668" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 709L80 884" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="744" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">방호</text>
<text x="104" y="806" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적의 도발·위협으로부터 인원·시설·장비의 피해를</text>
<text x="104" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">방지하고 모든 기능을 정상 유지하도록 보호</text>
<path d="M80 915L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="950" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">국가중요시설</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적에 의해 점령·파괴·기능마비될 경우 국가안보와</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국민생활에 심각한 영향을 주는 시설</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1170L314.21875 1170" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1224" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">통합방위는 국가방위요소의 통합과 지휘체계의</text>
<text x="80" y="1285" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">일원화를 함께 요구한다.</text>
<text x="80" y="1372" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1382L285.046875 1382" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1456" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각 용어의 구별 기준을 정리했으며 법 제2조의 모든</text>
<text x="80" y="1517" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정의를 나열한 도식은 아니다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제2조 · TB-002-D03 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
