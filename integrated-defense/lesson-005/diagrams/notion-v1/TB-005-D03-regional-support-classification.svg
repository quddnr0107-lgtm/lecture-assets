<title id="title">TB-005-D03 · 지역 지원대책, 어디에 속하는가</title><desc id="desc">통합방위 대비책 · 작전·훈련 지원 · 방위요소 육성·운용 및 지원의 구별 대비책 · 제2호：안보교육 지역주민·학생 등에 대한 안보교육과 그 지원 대책 작전·훈련 지원 · 제4호：차량·선박·시설 통합방위작전 수행 시 차량·선박·시설 등의 지원 대책；참여 지원 예비군·민방위대·지역주민 등의 작전·훈련 참여를 위한 홍보·계몽·지원；취약지역 취약지역 대비책；포상 추천 통합방위작전·훈련 유공자에 대한 포상 추천 방위요소 육성·지원 · 제5호：중대 사무실 지역예비군 중대 사무실의 설치 및 유지；사기·유대 작전·훈련 참가 구성원의 사기 앙양 및 민·관·군 간 유대 강화 위 항목은 해당 대책에 포함되어야 하는 시행령상 사항이다. 취약지역 대비책은 공동 심의사항인 작전·훈련 지원대책에 포함되며, 선정·해제와 구별한다.</desc>
