<text x="1102.6666666666665" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">소집 요구</text>
<text x="1102.6666666666665" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">통고할 때 국회 또는 시도의회가</text>
<text x="1102.6666666666665" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">폐회 중이면 소집 요구 의무</text>
<text x="1102.6666666666665" y="628" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">기구 구별</text>
<text x="1102.6666666666665" y="676" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">선포 전: 협의회 심의 / 선포 후:</text>
<text x="1102.6666666666665" y="718" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">국회·시도의회 통고</text>
<path d="M80 894 L1520 894" fill="none" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">대통령은 국회, 시도지사는 시도의회에 통고하며, 해당 의회가 폐회 중이면 소집을 요구한다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">통고를 선포 전 동의·승인 절차로 바꾸어 표시하지 않는다. 협의회와 의회는 서로 다른 기구이다. 대통령의 선포 전 심의에는 국무회의도 포함된다. 두</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">선포권자의 통고 경로는 병렬 관계이다.</text>
