<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">입영·소집 의무면제의 연령</title><desc id="desc">36세부터 면제: 해당 의무 병역판정·재병역판정·확인신체검사, 현역병입영, 사회복무·대체복무 소집 의무.; 전시근로역 편입 의무가 면제되면 전시근로역 편입. 대체복무요원 소집 의무 면제자는 제외한다. / 38세부터 면제: 제1항 단서 대상 기피·행방불명, 법정 편입취소·후보생 제적, 국외체재 연기 등 열거 사유에 해당하는 사람.; 36세 이상 현역 대상 제1항 단서로 현역병 입영을 해야 할 사람 중 36세 이상은 사회복무요원으로 복무하게 할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-110</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">입영·소집 의무면제의 연령</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">원칙 36세, 법정 예외 38세</text>
