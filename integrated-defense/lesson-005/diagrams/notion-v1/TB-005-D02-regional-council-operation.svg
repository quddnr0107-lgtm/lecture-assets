<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">지방 통합방위회의의 연 1회 이상 개최 규정과 구분한다. 시·도의회가 해제를 요구한 경우에는 시·도 협의회의 심의를 생략한다.</text>
