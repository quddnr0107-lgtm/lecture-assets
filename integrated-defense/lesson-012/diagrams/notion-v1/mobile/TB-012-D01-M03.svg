<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-012-D01 · 경계태세의 발령과 해제</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 12강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">경계태세의 발령과 해제</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제11조 · 시행령 제21조·제22조 | 적의 침투·도발</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">또는 위협이 예상될 때 발령 가능</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 433L314.21875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="487" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">발령은 재량, 상황 종료·지시는 해제 의무,</text>
<text x="80" y="548" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">통합방위사태 선포는 해제 간주.</text>
<text x="80" y="635" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 645L285.046875 645" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제11조는 4개 항으로 구성된다.</text>
<text x="80" y="780" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">발령권자·절차·등급의 세부사항은 시행령</text>
<text x="80" y="841" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제21조·제22조이다.</text>
<text x="80" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">선보고 예외는 통신두절 등 불가피한 사유가 있을</text>
<text x="80" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">때에 한한다.</text>
<text x="80" y="1064" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">서울특별시와 그 밖의 지역의 발령권자를 서로</text>
<text x="80" y="1125" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">혼합하지 않는다.</text>
<text x="80" y="1206" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경계태세 3급·2급·1급을 통합방위사태</text>
<text x="80" y="1267" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">갑종·을종·병종에 일대일 대응시키지 않는다.</text>
<text x="80" y="1354" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1364L270.0625 1364" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1438" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제11조제1항~제4항</text>
<text x="80" y="1519" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제21조·제22조</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제11조 · TB-012-D01 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
