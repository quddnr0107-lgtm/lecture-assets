<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">군 필요인원 통보 일정</title><desc id="desc">10월 31일까지: 각 군 참모총장 다음 다음 해 징집 입영할 사람의 적성별 필요인원을 병무청장에게 통보 / 통보를 받은 뒤: 병무청장 다음 해 검사에서 처분할 현역입영·보충역 편입 기준을 결정하고 시·도별·적성별 입영인원 배분 / 12월 31일까지: 병무청장 현역병입영 및 보충역 편입 기준을 각 군 참모총장에게 통보</desc>
