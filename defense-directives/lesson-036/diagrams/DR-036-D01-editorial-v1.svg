<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">통신장비의 보급·관리·정비</title><desc id="desc">DR-036 · 조직·편성 훈령 제47조. 수령과 동시에 재산등록하고, 정비계단을 넘는 고장은 지원시설로 보낸다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-036</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">조직·편성·운영</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">통신장비의 보급·관리·정비</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">수령과 동시에 재산등록하고, 정비계단을 넘는 고장은 지원시설로 보낸다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="990" y1="336" x2="990" y2="1002" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">보급·관리</text>
<path d="M81 385 C158.953 391 222.868 381 282.984 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">예비군 통신장비</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제1항 · 보급과 등록</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">각 군 방침에 따라 보급하며, 수령과 동시에 절차에 따라</text>
<text x="144" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">재산에 등록한다.</text>
<text x="144" y="673.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2항제1호 · 무전기</text>
<text x="144" y="715.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">인가부대에 지급하고 예비군지휘관이 주기적</text>
<text x="144" y="765.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">점검·조작능력을 배양한다.</text>
<text x="144" y="860.6" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2항제2호 · 군용전화</text>
<text x="144" y="902.6" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">가용범위 내에서 체신전화 가설 불가지역·필요지역에</text>
<text x="144" y="952.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">설치·운영할 수 있다.</text>
<path d="M116 459 C96 459 92 466 92 485 L92 962 C92 985 102 994 117 994" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1030" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">정비·보유기준</text>
<path d="M1018 341 C1040 311 1252.7 307 1306.7 331 C1327.7 346 1313.7 381 1284.7 393 C1162.35 413 1040 400 1017 375 C1004 363 1008 349 1018 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1034" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">지원시설과 연계</text>
<text x="1034" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제3항제1호 · 순회정비</text>
<text x="1034" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">이동정비반의 순회정비 지원은</text>
<text x="1034" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">지원시설 계획에 따라 시행한다.</text>
<text x="1034" y="673.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제3항제1호 · 반납</text>
<text x="1034" y="715.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">부대정비 계단을 초과한</text>
<text x="1034" y="765.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">고장장비는 지원시설에 반납한다.</text>
<text x="1034" y="860.6" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제4항 · 기준</text>
<text x="1034" y="902.6" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">통신장비 보유기준은 별표 23을</text>
<text x="1034" y="952.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">확인한다.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제47조 · DR-036-D01</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
