<path d="M595.3333333333333 411 Q575.3333333333333 411 575.3333333333333 433 L575.3333333333333 877 Q575.3333333333333 899 595.3333333333333 899" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="607.3333333333333" y="438" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">해제 건의</text>
<text x="607.3333333333333" y="482" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">시도경찰청장 또는 지역군사령관 또는</text>
<text x="607.3333333333333" y="520" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">함대사령관 → 시도지사</text>
