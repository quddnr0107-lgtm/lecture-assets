<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-016-D04 · 작전지역 검문의 요건과 설명</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 16강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">작전지역 검문의 요건과 설명</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제15조제5항 · 시행령 제26조 | 작전임무수행자의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정지·질문·동행 요구</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">정지·질문과 조사</text>
<path d="M80 433L430.953125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">대상 요건</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">거동이 수상하거나, 주위 사정상 거동이 수상하다고</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의심할 상당한 이유가 있는 사람</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">할 수 있는 일</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대상을 정지시켜 질문하고, 질문 시 흉기·총기 소지</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">여부 조사</text>
<text x="80" y="925" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">동행 요구</text>
<path d="M80 935L270.0625 935" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 976L80 1151" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1011" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">요구 조건</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">현장 질문이 상대에게 불리하거나</text>
<text x="104" y="1134" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">교통·통합방위작전에 지장을 준다고 인정될 때</text>
<path d="M80 1182L80 1357" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1217" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">동행 장소</text>
<text x="104" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">질문을 위해 가까운 검문소·군부대·국가경찰관서로</text>
<text x="104" y="1340" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">동행 요구 가능</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제15조 · TB-016-D04 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
