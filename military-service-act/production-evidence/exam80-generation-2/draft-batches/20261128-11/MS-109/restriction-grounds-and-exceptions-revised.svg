<text x="128" y="714" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#77756E" text-anchor="start">병역 기피·감면 목적</text>
<text x="128" y="745" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="400" fill="#25241F" text-anchor="start">도망·은신·신체손상·속임수</text>
<circle cx="98" cy="776" r="5" fill="#25241F"/>
<text x="128" y="785" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#77756E" text-anchor="start">병역의무부과 통지서</text>
