<title id="title">전시근로소집 대비 점검 불참</title><desc id="desc">점검 불참 요건: 통지서 수령 제53조제2항에 따른 전시근로소집 대비 점검통지서를 받은 사람; 불참 정당한 사유 없이 지정된 일시의 점검에 참석하지 않은 경우 / 법정형: 징역·벌금·구류 6개월 이하의 징역이나 500만원 이하의 벌금 또는 구류</desc>
