<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-016-D04 · 작전지역 검문의 요건과 설명</title><desc id="desc">법 제15조제5항 · 시행령 제26조 | 작전임무수행자의 정지·질문·동행 요구 정지·질문과 조사：대상 요건 거동이 수상하거나, 주위 사정상 거동이 수상하다고 의심할 상당한 이유가 있는 사람；할 수 있는 일 대상을 정지시켜 질문하고, 질문 시 흉기·총기 소지 여부 조사 동행 요구：요구 조건 현장 질문이 상대에게 불리하거나 교통·통합방위작전에 지장을 준다고 인정될 때；동행 장소 질문을 위해 가까운 검문소·군부대·국가경찰관서로 동행 요구 가능 설명 의무：질문·동행 때 신분·소속·직책·성명을 밝히고 질문·동행의 목적과 이유 설명；동행 요구 시 동행할 장소를 밝혀야 함 법 제15조제5항에 따른 작전지역 안의 필요한 검문을 요약한 도식이다. 동행 요구 가능이라는 문언을 강제 체포나 임의의 구금 권한으로 확대하지 않는다. 흉기·총기 조사는 질문 시 할 수 있다. 일률적인 모든 물품 수색으로 표현하지 않는다. 세 섹션은 요건별 체크 항목이며 항상 정지 후 동행해야 한다는 일률적 절차가 아니다.</desc>
