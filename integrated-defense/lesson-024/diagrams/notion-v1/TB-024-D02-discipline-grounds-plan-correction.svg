<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-024-D02 · 문책 사유와 계획 시정요구</title><desc id="desc">직무를 게을리한 사람에 대한 문책과 방호계획의 시정은 별도 권한 문책 대상 4유형：정당 사유 없는 기피 작전·훈련을 정당한 사유 없이 기피하여 작전·훈련에 중대한 지장；고의 기피·불복 참여자가 고의로 기피하고 통제에 불복하여 중대한 지장 또는 전투력 손실；고의·중과실 대응 작전 참여자의 거짓·지연보고 등 부실 대응으로 작전의 지연·변경·실패；담당 공무원 태만 업무 태만으로 통합방위태세 허점 등 통합방위 업무에 중대한 지장 국가중요시설 계획 시정：요구 주체 통합방위본부장；필요 요건 국가중요시설의 방호태세 유지를 위하여 필요한 경우；시정 대상 국가중요시설의 자체방호계획 및 방호지원계획 각 문책 사유에는 법령이 정한 행위와 중대한 지장·손실 등 결과 요건이 함께 필요하다.</desc>
