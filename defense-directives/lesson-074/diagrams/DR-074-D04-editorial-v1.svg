<text x="1034" y="741.24" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">장기 추가 요건</text>
<text x="1034" y="783.24" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">심의 결과에 장성급 지휘관 승인</text>
<text x="1034" y="834.36" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">필요</text>
