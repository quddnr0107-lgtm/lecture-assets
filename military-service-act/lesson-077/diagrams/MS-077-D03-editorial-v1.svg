<text id="t19" x="888" y="642" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">빠진 기간의 5배 연장</text>
<text id="t20" x="888" y="704" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">통틀어 8일 이상</text>
<text id="t21" x="888" y="748" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">편입취소 사유</text>
<path d="M80 958 H1520" stroke="#DFDDD6" stroke-width="2"/>
<text id="t22" x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">35세 / 37세 · 휴업·휴직은 해당 기간 · 8일 미만 무단결근은 5배</text>
<text id="t23" x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-077 · 기존 제80회 원고</text>
<text id="t24" x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
