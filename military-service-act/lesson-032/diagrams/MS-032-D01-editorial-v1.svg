<text x="520" y="643.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">법 제21조제1항의 현역 복무기간을 마친 다음 날 예비역에</text>
<text x="520" y="696.3333333333334" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">편입시켜야 함</text>
<rect x="76" y="790.6666666666667" width="72" height="55" fill="#FFFEFC"/>
<text x="80" y="827.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">03</text>
<text x="164" y="826.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">상근예비역 소집</text>
<text x="1520" y="816.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제22조③</text>
<text x="520" y="816.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">각 군 참모총장</text>
<text x="520" y="872.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">예비역으로 편입된 날부터 소집하여야 함 — 법 제65조제3항의</text>
<text x="520" y="925.6666666666667" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">예비역 편입자 포함</text>
