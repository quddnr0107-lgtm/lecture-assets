<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">편입 청탁과 금품 수수의 처벌</title><desc id="desc">청탁 대가 취득: 병역지정업체의 장 편입 청탁을 받고 금품·재산상 이익 취득 등 부정행위: 3년 이하 징역; 업체의 장 아닌 사람 같은 목적의 청탁·이익 취득 등: 3년 이하 징역 또는 3천만원 이하 벌금 / 제공·몰수: 금품 제공자 제3항·제4항의 금품·이익 제공: 1년 이하 징역 또는 1천만원 이하 벌금; 취득한 이익 몰수. 몰수할 수 없는 경우 그 가액 추징</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-159</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   02 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">편입 청탁과 금품 수수의 처벌</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">특정인이 전문연구·산업기능요원으로 복무하도록 하는 청탁</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
