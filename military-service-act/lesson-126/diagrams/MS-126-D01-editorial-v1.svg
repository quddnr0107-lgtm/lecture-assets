<title id="title">공직자 등 병적 별도 관리</title><desc id="desc">관리 대상: 공직자·고소득자 법정 병역사항 신고의무자 및 자녀, 최고·차상위 세율 납세의무자 및 자녀; 선수·대중문화예술인 법정 선수등록·해외활동 요건에 해당하는 선수 및 용역계약 대중문화예술인 / 관리기간: 기본 병역준비역 편입부터 복무 종료·전시근로역 편입·병역면제까지 관리 가능; 추가 관리 법정 전시근로역·면제 처분 후 치료 기록 확인 필요 시 처분일부터 3년간 관리 가능</desc>
