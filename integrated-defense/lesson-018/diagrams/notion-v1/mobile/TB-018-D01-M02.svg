<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-018-D01 · 대피구역 결정과 명령 집행</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 18강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">대피구역 결정과 명령 집행</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위사태가 선포된 때, 작전지역 주민·체류자의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">인명·신체 보호</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">③ 작전지휘관 집행 (계속)</text>
<path d="M80 433L596.90625 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">주민·체류자</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">물자·장비의 적 이용 방지 조치 후 지시에 따라</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">신속히 대피</text>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 729L314.21875 729" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="783" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">작전지휘관이 제청·집행, 시·도지사등이 구역</text>
<text x="80" y="844" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">결정·공고·집행 요청</text>
<text x="80" y="931" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 941L285.046875 941" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1015" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">명령권자: 시·도지사 또는 시장·군수·구청장. 사태</text>
<text x="80" y="1076" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">선포 시 즉시 대피를 명할 수 있다.</text>
<text x="80" y="1163" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
