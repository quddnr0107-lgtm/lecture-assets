<text x="1102.6666666666665" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">질문·동행 때</text>
<text x="1102.6666666666665" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">신분·소속·직책·성명을 밝히고</text>
<text x="1102.6666666666665" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">질문·동행의 목적과 이유 설명</text>
<text x="1102.6666666666665" y="628" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">동행 요구 시</text>
<text x="1102.6666666666665" y="676" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">동행할 장소를 밝혀야 함</text>
<path d="M80 863 L1520 863" fill="none" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="908" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">검문에는 대상 요건이 있으며, 질문·동행 요구에는 신분과 목적·이유를 밝히는 의무가 따른다.</text>
<text x="84" y="964" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">법 제15조제5항에 따른 작전지역 안의 필요한 검문을 요약한 도식이다. 동행 요구 가능이라는 문언을 강제 체포나 임의의 구금 권한으로 확대하지</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">않는다. 흉기·총기 조사는 질문 시 할 수 있다. 일률적인 모든 물품 수색으로 표현하지 않는다. 세 섹션은 요건별 체크 항목이며 항상 정지 후 동행해야</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">한다는 일률적 절차가 아니다.</text>
