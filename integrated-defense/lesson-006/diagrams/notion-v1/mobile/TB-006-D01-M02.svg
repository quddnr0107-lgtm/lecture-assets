<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-006-D01 · 직장협의회, 언제 두어야 하는가</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 06강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">직장협의회, 언제 두어야 하는가</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의무 설치 2개 유형과 원하는 경우의 설치를 구분</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 372L314.21875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="426" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">소대급의 기준은 직장예비군 자원이 있다는 것이며,</text>
<text x="80" y="487" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">설치는 원하는 경우에 가능하다.</text>
<text x="80" y="574" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 584L285.046875 584" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의무·선택 설치 조건과 구성 관계를 나타내며 순차적</text>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">절차가 아니다.</text>
<text x="80" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직장협의회의 범위·운영은 법 제6조제2항에 따라</text>
<text x="80" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령령으로 정한다.</text>
<text x="80" y="948" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 958L270.0625 958" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1032" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제6조</text>
<text x="80" y="1113" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제9조·제10조제1항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제6조 · TB-006-D01 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
