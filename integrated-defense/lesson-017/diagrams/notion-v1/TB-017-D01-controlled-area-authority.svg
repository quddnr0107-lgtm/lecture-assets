<title id="title">TB-017-D01 · 통제구역 설정의 두 가지 요건</title><desc id="desc">요건 중 하나 충족 → 설정권자 → 비작전 관련자에 대한 통제 ① 두 요건 중 하나：사태 선포 통합방위사태가 선포된 경우；경계태세 1급 적의 침투·도발 징후가 확실하여 경계태세 1급이 발령된 경우 ② 설정권자·목적：시·도지사 등 시·도지사 또는 시장·군수·구청장이 설정할 수 있음；인명·신체 보호 인명·신체에 대한 위해를 막기 위해 필요한 구역 설정 ③ 통제 대상·내용：비작전 관련자 통합방위작전 또는 경계태세 발령에 따른 군·경 합동작전과 무관한 사람；출입·퇴거 통제 출입을 금지·제한하거나 통제구역에서 퇴거할 것을 명할 수 있음 설정 기준·절차·공고 방법은 대통령령으로 정한다.</desc>
