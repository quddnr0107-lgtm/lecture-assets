<text x="867.0" y="526" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">필요한 지역</text>
<text x="867.0" y="595.3333333333334" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">실무위원회</text>
<text x="867.0" y="639.3333333333334" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">통합방위 실무위원회의 심의를 거침</text>
