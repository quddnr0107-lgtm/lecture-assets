<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병무행정 권한의 위임</title><desc id="desc">국내 기관 위임: 병무청장 제78조제1항의 열거된 권한을 지방병무청장 또는 그 소속기관장에게 위임 가능; 지방병무청장 이 법에 따른 권한 일부를 소속기관장에게 위임 가능 / 재외공관장 위임: 병무청장의 권한 제70조제3항에 따른 권한 일부를 재외공관장에게 위임 가능; 지방병무청장의 권한 제60조제1항제2호에 따른 권한 일부를 재외공관장에게 위임 가능</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
