<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-012-D02 · 경계태세별 작전통제와 협조</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 12강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">경계태세별 작전통제와 협조</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제23조 | 1급은 관할별 통제, 2·3급은 상호</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">협조</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">1급 · 해상·지원 (계속)</text>
<path d="M80 433L543.203125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">지역 지원</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지자체장·읍면동장은 각 지원본부를 통해 작전 지원</text>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">2·3급과 평시</text>
<path d="M80 668L355.109375 668" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 709L80 884" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="744" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">2·3급</text>
<text x="104" y="806" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가방위요소가 상호 협조하여 적의 침투·도발에</text>
<text x="104" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대비</text>
<path d="M80 915L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="950" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">평시 계획</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역군·시도경찰·함대·지방해경 지휘관은 연계된</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전계획 수립</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1170L314.21875 1170" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1224" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">경계 1급의 군·경 상호통제는 위임받은 작전요소가</text>
<text x="80" y="1285" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">기준이며, 특정경비지역은 모든 요소가 대상이다.</text>
<text x="80" y="1372" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1382L285.046875 1382" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1456" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">이 도식의 통제는 작전통제를 뜻하며, 조직 전체의</text>
<text x="80" y="1517" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">일반 행정지휘를 뜻하지 않는다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제11조 · TB-012-D02 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
