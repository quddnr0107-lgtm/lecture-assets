<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역판정검사 자료 제출</title><desc id="desc">자료 제출 요구: 요구 주체·요건 지방병무청장은 전담의사·전문의사·파견 군의관 등이 질병·심신장애 확인에 필요하다고 인정하면 요구 가능; 요구 상대 의료기관의 장, 국민건강보험공단의 장, 학교의 장 등; 요구 자료 진료·치료 관련 기록, 학교생활기록부, 학생건강기록부 등 / 응답과 보호: 제출 의무 특별한 사유가 없으면 요구에 따라야 함; 목적 외 사용 금지 누구든지 취득한 정보·자료를 공개·누설·제공하는 등 병역판정검사 외 목적으로 사용 금지</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-014</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병역판정검사 자료 제출</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">제출 요구의 요건과 목적 외 사용 금지</text>
