<text x="607.3333333333333" y="482" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">정기: 분기 1회 원칙 / 임시: 필요시 의장이 소집</text>
