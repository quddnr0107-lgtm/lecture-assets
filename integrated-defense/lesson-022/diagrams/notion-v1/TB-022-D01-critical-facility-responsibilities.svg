<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-022-D01 · 국가중요시설의 네 가지 책임</title><desc id="desc">시설 지정·자체방호·방호지원·평시 지도감독의 담당자를 구분 시설 지정：국방부장관 국가중요시설을 지정；지정 전 협의 관계 행정기관의 장 및 국가정보원장과 협의 시설 관리자：경비·보안·방호 관리자에게 책임이 있으며 소유자도 관리자에 포함；자체방호계획 통합방위사태에 대비하여 수립 / 계획 수립에 필요시 협조 요청 가능 지원과 평시 감독：방호지원계획 시·도경찰청장 또는 지역군사령관이 수립·시행；평시 지도·감독 관계 행정기관의 장과 국가정보원장이 경비·보안활동 지도·감독 관리자의 협조 요청 상대는 시·도경찰청장 또는 지역군사령관이다.</desc>
