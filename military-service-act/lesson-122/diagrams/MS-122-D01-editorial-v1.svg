<title id="title">병역의무 불이행자 제재</title><desc id="desc">채용·재직: 제재 대상 병역판정·재병역판정·확인신체검사 기피, 징집·소집 기피 및 법정 복무이탈; 임용·채용 공무원 또는 임직원으로 임용·채용할 수 없음 / 관허업: 새 특허등 국가기관·지자체의 장은 특허·허가·인가·면허·등록·지정 등을 해서는 안 됨; 기존 특허등 이미 받은 특허등은 취소하여야 함</desc>
