<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">종합상황실</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지원본부 상황실 + 군·경합동상황실</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">설치 원칙</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군·경합동상황실은 각 지원본부에 설치</text>
<path d="M80 764L80 939" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="799" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">분리 설치</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지휘·통신·협조와 지역 특성을 고려한</text>
<text x="104" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군부대·경찰관서에 설치</text>
