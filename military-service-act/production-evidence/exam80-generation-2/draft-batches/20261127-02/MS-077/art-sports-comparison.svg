<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>두 대체복무의 편입취소 비교</title>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-077</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="60" font-weight="700" fill="#25241F" text-anchor="start">두 대체복무의 편입취소 비교</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">예술·체육요원 / 전문연구·산업기능요원</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z M1337 153 L1438 151 L1442 235 L1334 235 Z M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80 284 H1520 M800 334 V920 M80 1047 H1520" stroke="#DFDDD6" stroke-width="2" fill="none"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">공통점</text>
<path d="M80 386 Q175 394 270 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M105 429 Q89 429 89 451 V885 Q89 909 107 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text x="128" y="450" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">신분과 잔여 복무</text>
<text x="128" y="494" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">편입 전 신분으로 복귀</text>
<text x="128" y="534" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">현역 대상 잔여 6개월 미만은</text>
<text x="128" y="574" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">사회복무요원 소집 가능</text>
<text x="128" y="640" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">부정 편입</text>
<text x="128" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">원래 신분의 복무기간에서</text>
<text x="128" y="724" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">군사교육 기간만 공제</text>
<text x="128" y="790" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">그 밖의 취소</text>
<text x="128" y="834" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">대통령령 기준에 따른</text>
<text x="128" y="874" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">남은 복무기간</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">차이점</text>
<path d="M840 386 Q935 394 1030 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M865 429 Q849 429 849 451 V885 Q849 909 867 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text x="888" y="450" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">예술·체육요원</text>
<text x="888" y="494" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">부정 편입과 그 밖의 취소 구분</text>
<text x="888" y="534" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">해당 분야 미복무일의 5배 연장</text>
<text x="888" y="600" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">전문연구·산업기능요원</text>
<text x="888" y="644" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">부정 전직은 남은 기간 적용</text>
<text x="888" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">통틀어 8일 미만 무단결근</text>
<text x="888" y="724" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">해당 기간의 5배 연장</text>
<path d="M80 958 H1520" stroke="#DFDDD6" stroke-width="2"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">부정 편입은 처음부터 / 부정 전직은 남은 기간</text>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-077 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
