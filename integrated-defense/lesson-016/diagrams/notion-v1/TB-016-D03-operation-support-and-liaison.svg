<text x="84" y="939" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">작전은 지휘관이 책임지고, 지자체·시설 관리자·연락관이 각자의 지원과 협조 임무를 수행한다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">5급 이상은 연락관 임명의 직급 기준이다. 사태의 급수와 혼동하지 않는다. 사태가 선포되면 해당 지역의 모든 국가방위요소는 지휘·협조체계를</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">구축하여야 한다. 각 섹션은 병렬 역할이며 상하 서열이나 보고의 순서를 뜻하지 않는다.</text>
