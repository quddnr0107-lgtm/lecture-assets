<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-016-D02 · 사태 종류별 작전통제 범위</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 16강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">사태 종류별 작전통제 범위</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제25조제1항·제4항·제5항 | 누가 어떤</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가방위요소를 통제하는가</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위 (계속)</text>
<path d="M80 433L420.53125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="507" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군 작전지원은 경찰의 요청과 군사령관의 지원 가능</text>
<text x="80" y="568" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">규정이며, 요청을 즉시 지휘권 이전으로 해석하지</text>
<text x="80" y="629" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">않는다.</text>
<text x="80" y="710" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경계태세 1급의 함대사령관 통제 대상은</text>
<text x="80" y="771" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해양경찰이지만, 병종사태의 해역 통제 대상은 모든</text>
<text x="80" y="832" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가방위요소이다.</text>
<text x="80" y="919" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 929L270.0625 929" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1003" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제25조제1항·제4항·제5항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제15조 · TB-016-D02 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
