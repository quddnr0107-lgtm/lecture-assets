<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">산업기능요원 편입의 갈래</title><desc id="desc">지정업체 근무: 기간산업체 공업·광업·에너지·건설·수산·해운 분야. 수산·해운은 승선 복무자 또는 승선 복무 예정자.; 연구·방위산업체 법정 전문연구기관 또는 방위산업체 중 병역지정업체로 선정된 곳의 복무자. / 기능·농어업 등: 특수기능·후계농어업 국제적 기능의 법정 대상자 또는 관할 지방자치단체장의 추천을 받은 후계농어업경영인.; 농업기계·사후관리 농업회사법인 농업기계운전요원·사후관리업체 복무자로서 법정 추천을 받은 사람.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-073</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">산업기능요원 편입의 갈래</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">본인이 원하고 법정 대상·자격을 갖춘 경우</text>
