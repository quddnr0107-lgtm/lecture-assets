<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">지원자의 학교생활기록부</title><desc id="desc">병무청장의 요구: 목적·대상 현역병·임기제부사관 복무 지원자의 전형·선발을 위한 최종학교 학교생활기록부; 동의와 제출 경로 지원자 동의를 받아 학교의 장에게 정보시스템을 통한 제출 요구 가능 / 제출 의무·자료 보호: 제출 의무 요구받은 사람은 특별한 사유가 없으면 따라야 함; 목적 외 사용 금지 누구든지 공개·누설·제공하는 등 현역병 선발을 위한 전형 외 목적으로 사용 금지</desc>
