<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">가족 국외이주와 자녀 출산</title><desc id="desc">가족과 국외이주: 복무 중인 대상자 현역병·승선근무예비역·보충역은 법정 요건에 따라 보충역 편입 또는 사회복무 소집해제 가능.; 영주귀국 등 국내 영주 목적 귀국 등 대통령령상 사유가 생기면 그 처분을 취소하고 병역의무를 부과할 수 있다. / 자녀 출산: 상근예비역 희망 복무 중인 현역병이 자녀 출산으로 상근예비역 복무를 원하면 대통령령에 따라 예비역 편입 가능.; 전환복무 포함 제3항의 현역병에는 제25조에 따라 전환복무 중인 사람을 포함한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-102</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   02 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">가족 국외이주와 자녀 출산</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">복무 중인 사람에게 적용하는 병역처분 변경</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="800" y1="334" x2="800" y2="1006" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">가족과 국외이주</text>
<path d="M80 386 C162.8 393 292.9 380 387.7 386" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105 429 C91 429 89 439 89 453 L89 920.0 C89 937.0 95 943.0 107 943.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="752" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제65조②</text>
<text x="128" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">복무 중인 대상자</text>
<text x="128" y="509" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">현역병·승선근무예비역·보충역은</text>
<text x="128" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">법정 요건에 따라 보충역 편입 또는</text>
<text x="128" y="619" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">사회복무 소집해제 가능.</text>
<text x="752" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제65조⑥</text>
<text x="128" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">영주귀국 등</text>
<text x="128" y="820" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">국내 영주 목적 귀국 등 대통령령상</text>
<text x="128" y="875" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">사유가 생기면 그 처분을 취소하고</text>
<text x="128" y="930" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">병역의무를 부과할 수 있다.</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">자녀 출산</text>
<path d="M825 342 C857.4 315 982.9 314 1032.2 338 C1058.2 362 1026.2 390 970.7 397 C881.8 408 812 385 822 357 Z" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M865 429 C851 429 849 439 849 453 L849 865.0 C849 882.0 855 888.0 867 888.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1512" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제65조③</text>
<text x="888" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">상근예비역 희망</text>
<text x="888" y="509" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">복무 중인 현역병이 자녀 출산으로</text>
<text x="888" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">상근예비역 복무를 원하면 대통령령에</text>
<text x="888" y="619" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">따라 예비역 편입 가능.</text>
<text x="1512" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제65조③</text>
<text x="888" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">전환복무 포함</text>
<text x="888" y="820" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">제3항의 현역병에는 제25조에 따라</text>
<text x="888" y="875" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">전환복무 중인 사람을 포함한다.</text>
<line x1="80" y1="1052" x2="1520" y2="1052" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 제65조 · MS-102 · 핵심 구조</text>
<text x="1520" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
