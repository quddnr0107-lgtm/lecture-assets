<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무요원의 분할복무</title><desc id="desc">본인 질병치료: 구체적 요건 1개월 이상 본인의 질병치료가 필요한 경우; 통틀어 2년 질병치료에 따른 복무중단기간의 원칙적 상한; 추가 중단 가능 지방병무청장·병무지청장이 입원·거동 불편 등으로 복무 곤란을 인정하면 치료기간만큼 추가 / 가족·가사사정: 해당 사유 가족 간병 또는 재난·그 밖의 가사사정으로 본인의 지원이 필요한 경우; 통틀어 6개월 가족 간병과 재난·가사사정에 따른 복무중단기간의 상한</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-047</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">사회복무요원의 분할복무</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지방병무청장이 일정기간 중단 후 다시 복무하게 할 수 있음</text>
