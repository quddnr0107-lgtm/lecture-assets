<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">장애보상금 지급 절차</title><desc id="desc">청구·확인: 복무기관의 장 청구를 받아 공상·공무상 질병 여부를 확인하고 지방병무청장에게 등급 요청 / 신체검사: 지방병무청장 검사장 또는 지정 군병원 등에 검사 의뢰. 비용은 복무기관의 장이 부담 / 등급 결정: 지방병무청장 보상심의위원회 심의 후 등급 결정, 청구인·복무기관에 지체 없이 통보</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
