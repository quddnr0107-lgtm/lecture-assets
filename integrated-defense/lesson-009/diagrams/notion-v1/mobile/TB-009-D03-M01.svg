<text x="104" y="1005" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">통합 설치</text>
<text x="104" y="1067" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">인접 2개 이상 시·군·자치구를 같은</text>
<text x="104" y="1128" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군부대·경찰서가 관할하면 가능</text>
<text x="80" y="1215" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">운영</text>
