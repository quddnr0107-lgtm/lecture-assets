<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>의무복무기간 계산</title>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text id="t1" x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-077</text>
<text id="t2" x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<text id="t3" x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">의무복무기간 계산</text>
<text id="t4" x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시행령 제89조 · 기산일과 복무기간 제외</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z M1337 153 L1438 151 L1442 235 L1334 235 Z M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80 284 H1520 M800 334 V920 M80 1047 H1520" stroke="#DFDDD6" stroke-width="2" fill="none"/>
<text id="t5" x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">기산일과 제외 기간</text>
<path d="M80 386 Q180 394 320 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M105 429 Q89 429 89 451 V885 Q89 909 107 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text id="t6" x="128" y="452" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">기산일</text>
<text id="t7" x="128" y="496" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">원칙: 편입한 날</text>
<text id="t8" x="128" y="536" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">승선예정 산업기능: 승선일</text>
<text id="t9" x="128" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">복무기간에서 제외</text>
<text id="t10" x="128" y="642" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">박사과정 수학·휴직·정직</text>
<text id="t11" x="128" y="682" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">휴업·직장폐쇄·영업정지</text>
<text id="t12" x="128" y="722" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">해당 분야 미복무기간</text>
<text id="t13" x="128" y="784" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">휴직의 예외</text>
<text id="t14" x="128" y="828" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">업무상 부상·질병으로 휴직한</text>
<text id="t15" x="128" y="868" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">기간은 복무기간에 산입</text>
<text id="t16" x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">기간 기준</text>
<path d="M840 386 Q940 394 1080 384" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round"/>
<path d="M865 429 Q849 429 849 451 V885 Q849 909 867 909" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round"/>
<text id="t17" x="888" y="452" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">통틀어</text>
<text id="t18" x="888" y="496" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">3개월 초과 국외여행기간</text>
<text id="t19" x="888" y="536" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">30일 초과 질병휴가·휴직·결근</text>
<text id="t20" x="888" y="576" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">8일 미만 무단결근기간</text>
<text id="t21" x="888" y="638" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">해고 다툼</text>
<text id="t22" x="888" y="682" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">정당한 해고로 확정되면</text>
<text id="t23" x="888" y="722" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">다툼 진행기간 제외</text>
<text id="t24" x="888" y="784" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">전직 대기</text>
<text id="t25" x="888" y="828" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">3개월(일부 14일)을 넘는 기간</text>
<path d="M80 958 H1520" stroke="#DFDDD6" stroke-width="2"/>
<text id="t26" x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">국외여행 3개월 · 질병 30일 · 무단결근 8일 미만</text>
<text id="t27" x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-077 · 기존 제80회 원고</text>
<text id="t28" x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
