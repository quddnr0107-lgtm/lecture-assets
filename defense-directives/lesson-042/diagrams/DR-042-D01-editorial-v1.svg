<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제61조: 2024.1.1 / 교육훈련 훈령 제33조: 2027.1.1 (모두 매 3년).</text>
