<title id="title">검사 대리수검과 검사 기피</title><desc id="desc">대리수검: 다른 사람 대신 검사 검사를 받을 사람을 대리하여 해당 검사를 받은 사람; 법정형 1년 이상 3년 이하의 징역 / 본인의 검사 기피: 정당한 사유 없음 통지서를 받고 의무이행일에 해당 검사를 받지 않은 경우; 법정형 6개월 이하의 징역</desc>
