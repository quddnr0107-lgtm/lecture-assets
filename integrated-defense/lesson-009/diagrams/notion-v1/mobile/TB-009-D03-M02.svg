<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-009-D03 · 종합상황실의 구성·설치·운영</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 09강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">종합상황실의 구성·설치·운영</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제14조~제16조 | 종합상황실과</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군·경합동상황실을 구별</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">운영 (계속)</text>
<path d="M80 433L303.796875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">합동실 책임</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역 작전책임 군부대의 장 또는 해당 지역</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가경찰관서장</text>
<path d="M80 680L80 794" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">기타 운영</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역협의회 심의 → 지역협의회 의장이 정함</text>
<text x="80" y="864" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 874L314.21875 874" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="928" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">종합상황실은 두 상황실의 결합이며, 합동상황실은</text>
<text x="80" y="989" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">설치·운영의 별도 기준을 따른다.</text>
<text x="80" y="1076" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1086L285.046875 1086" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">분리 설치 시 군부대 또는 국가경찰관서 중 가장</text>
<text x="80" y="1221" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">효과적인 장소를 선택한다.</text>
<text x="80" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합 설치는 하나의 장소에 설치할 수 있다는 허용</text>
<text x="80" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">규정이다.</text>
<text x="80" y="1444" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">화살표는 기타 운영사항의 결정 절차를 뜻한다.</text>
<text x="80" y="1505" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">나머지 항목은 분류이다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제9조 · TB-009-D03 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
