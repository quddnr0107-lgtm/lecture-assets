<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전시업무를 위한 평시 준비</title><desc id="desc">지방자치단체: 평시 임명 전담 병무담당 직원은 평시 임명. 시·도지사는 차량·급식·수용시설 지원업무 한정; 업무 지원 통지서 교부·입영 독려·기피자 단속지원·차량·급식·시설지원 등; 비용 위임 전시업무 수행 및 병무담당 직원 경비는 국고부담 / 교육·점검: 평시 교육 지방병무청장이 평시 전시업무 수행능력 교육 실시 의무; 매년 3시간 이상 병무담당 직원은 전시업무교육을 매년 3시간 이상 이수; 연 1회 정기점검 병무청장은 교육 이수 여부 정기점검, 필요 시 수시점검 가능</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-141</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   03 / 04</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">전시업무를 위한 평시 준비</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지자체 병무담당 직원과 지방병무청장의 교육</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="800" y1="334" x2="800" y2="1006" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">지방자치단체</text>
<path d="M80 386 C148.0 393 254.9 380 334.9 386" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105 429 C91 429 89 439 89 453 L89 965.0 C89 982.0 95 988.0 107 988.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="752" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제83조⑤</text>
<text x="128" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">평시 임명</text>
<text x="128" y="507" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">전담 병무담당 직원은 평시 임명.</text>
<text x="128" y="560" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">시·도지사는 차량·급식·수용시설</text>
<text x="128" y="613" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">지원업무 한정</text>
<text x="752" y="685.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제83조③</text>
<text x="128" y="685.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">업무 지원</text>
<text x="128" y="741.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">통지서 교부·입영 독려·기피자</text>
<text x="128" y="794.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">단속지원·차량·급식·시설지원 등</text>
<text x="752" y="866.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제83조⑨</text>
<text x="128" y="866.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">비용</text>
<text x="128" y="922.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">위임 전시업무 수행 및 병무담당 직원</text>
<text x="128" y="975.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">경비는 국고부담</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">교육·점검</text>
<path d="M825 342 C858.8 315 994.1 314 1046.0 338 C1072.0 362 1040.0 390 981.0 397 C885.1 408 812 385 822 357 Z" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M865 429 C851 429 849 439 849 453 L849 965.0 C849 982.0 855 988.0 867 988.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1512" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제83조⑥</text>
<text x="888" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">평시 교육</text>
<text x="888" y="507" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">지방병무청장이 평시 전시업무</text>
<text x="888" y="560" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">수행능력 교육 실시 의무</text>
<text x="1512" y="658.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">영 제169조⑨</text>
<text x="888" y="658.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">매년 3시간 이상</text>
<text x="888" y="714.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">병무담당 직원은 전시업무교육을 매년</text>
<text x="888" y="767.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">3시간 이상 이수</text>
<text x="1512" y="866.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">영 제169조⑫</text>
<text x="888" y="866.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">연 1회 정기점검</text>
<text x="888" y="922.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">병무청장은 교육 이수 여부 정기점검,</text>
<text x="888" y="975.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">필요 시 수시점검 가능</text>
<line x1="80" y1="1052" x2="1520" y2="1052" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 제83조 · MS-141 · 핵심 구조</text>
<text x="1520" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
