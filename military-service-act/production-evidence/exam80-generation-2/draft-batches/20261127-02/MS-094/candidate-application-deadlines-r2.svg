<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko">
<title>사관후보생 지원 기한</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-094</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 L1520 105" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">사관후보생 지원 기한</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지원 분야에 따라 달라지는 날짜</text>
<path d="M80 280 L1520 280" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">의무·법무</text>
<path d="M80 389 Q240 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="128" y="440" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">의무</text>
<circle cx="98" cy="431" r="5" fill="#25241F"/>
<text x="128" y="485" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">군전공의요원으로 채용되는 해</text>
<text x="128" y="528" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">2월 10일까지</text>
<text x="128" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">법무</text>
<circle cx="98" cy="589" r="5" fill="#25241F"/>
<text x="128" y="643" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">사법연수원 입교 해 또는</text>
<text x="128" y="686" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">법학전문대학원 2학년 해</text>
<text x="128" y="729" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">3월 31일까지</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">수의·군종</text>
<path d="M840 389 Q1000 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="888" y="440" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">수의</text>
<circle cx="858" cy="431" r="5" fill="#25241F"/>
<text x="888" y="485" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">수의과대학 본과 3학년 해</text>
<text x="888" y="528" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">5월 31일까지</text>
<text x="888" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">군종</text>
<circle cx="858" cy="589" r="5" fill="#25241F"/>
<text x="888" y="643" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="400" fill="#25241F" text-anchor="start">국방부장관이 정하는 절차</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">장교 지원 후 후보생 지원 → 장교 지원서 철회 간주</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-094 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
