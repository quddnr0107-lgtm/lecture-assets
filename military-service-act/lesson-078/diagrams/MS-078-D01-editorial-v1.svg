<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무요원 등 복무기간 조정</title><desc id="desc">조정 사유: 병무청장의 요청 현역기간 변경으로 조정 필요, 나쁜 근무조건·환경으로 단축 필요 또는 병역자원 수급계획상 필요. / 사전 심의·승인: 국무회의 → 대통령 미리 국무회의 심의를 거쳐 대통령의 승인을 받아야 한다. / 1년 범위: 국방부장관 사회복무·예술체육·전문연구·산업기능요원의 복무기간을 1년 범위에서 조정할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-078</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">사회복무요원 등 복무기간 조정</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">병무청장 요청과 국방부장관의 조정 권한</text>
