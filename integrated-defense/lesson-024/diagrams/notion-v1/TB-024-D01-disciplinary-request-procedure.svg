<text x="607.3333333333333" y="486" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">실무위원회</text>
<text x="607.3333333333333" y="534" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">조사 결과 등을 보고받은 후</text>
