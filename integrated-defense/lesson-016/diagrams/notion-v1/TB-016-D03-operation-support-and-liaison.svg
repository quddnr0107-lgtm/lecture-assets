<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-016-D03 · 작전 지원·시설 방호·연락관</title><desc id="desc">시행령 제25조제2항·제3항·제6항·제7항 | 사태 선포 시 국가방위요소의 협조 계획·행정 지원：작전지휘관 작전 전반 책임, 국가방위요소를 통합·연계한 작전계획 수립·시행；지자체장 지역군·함대사령관·시도경찰청장과 협조하여 국민·방위요소 연계 및 지원 국가중요시설 방호：자체 강화 관리자는 경비·보안·방호를 강화하고 침투 대비책 수립·시행；협조 대상 대대 단위 지역책임 부대장 및 경찰서장과 협조하여 방호태세 확립 연락관 상주·파견：임명 주체 행정안전부장관·국가정보원장·경찰청장·해양경찰청장；직급·장소 5급 이상 공무원을 연락관으로 임명, 통합방위본부 군사상황실에 상주；그 밖의 기관 통합방위본부장이 요청하면 연락관 파견 5급 이상은 연락관 임명의 직급 기준이다. 사태의 급수와 혼동하지 않는다. 사태가 선포되면 해당 지역의 모든 국가방위요소는 지휘·협조체계를 구축하여야 한다. 각 섹션은 병렬 역할이며 상하 서열이나 보고의 순서를 뜻하지 않는다.</desc>
