<text x="607.3333333333333" y="439" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="32" font-weight="700" fill="#25241F" text-anchor="start">1 · 대비책</text>
<text x="607.3333333333333" y="485" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">통합방위 대비책</text>
<text x="607.3333333333333" y="553" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="32" font-weight="700" fill="#25241F" text-anchor="start">2 · 부처 간 조정</text>
