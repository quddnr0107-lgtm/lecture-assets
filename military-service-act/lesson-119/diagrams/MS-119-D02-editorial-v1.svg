<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">공상 치료와 검사 중 부상</title><desc id="desc">복무 중 공상·질병: 사회·대체복무 국가·지자체·공공단체 등의 부담으로 공상·공무상 질병 치료; 군사교육 군사교육소집·학생군사교육이 직접 원인인 사망·부상에도 준용 / 국가 부담 치료 가능: 검사·입영 검사가 직접 원인인 치료 필요자 및 징집·소집 입영 중 부상자; 검사 전후 이동 지정장소로 직접 이동 중 또는 검사 후 지체 없이 귀가 중 부상자</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
