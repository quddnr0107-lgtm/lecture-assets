<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-022-D02 · 자체방호와 지원계획의 결합</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 22강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">자체방호와 지원계획의 결합</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관리자·경찰·군은 계획을 세우고 역할을 나누며</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작성·변경 사실을 공유</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 433L314.21875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="487" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">자체방호계획 + 경찰서·대대 단위 지원계획 →</text>
<text x="80" y="548" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">역할분담 협정과 상호 통보</text>
<text x="80" y="635" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 645L285.046875 645" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각 계획의 수립·시행과 대비책 마련은 시행령상</text>
<text x="80" y="780" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의무다.</text>
<text x="80" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 877L270.0625 877" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="951" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제21조제1항·제2항·제5항</text>
<text x="80" y="1032" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제32조제1호~제3호</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제21조 · TB-022-D02 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
