<text x="607.3333333333333" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">침투</text>
<text x="607.3333333333333" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">특정 임무 수행을 위하여 대한민국</text>
<text x="607.3333333333333" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">영역을 침범한 상태</text>
<text x="607.3333333333333" y="608.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">도발</text>
<text x="607.3333333333333" y="656.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">특정 임무 수행을 위하여 국민 또는</text>
<text x="607.3333333333333" y="698.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">영역에 위해를 가하는 모든 행위</text>
<text x="607.3333333333333" y="775.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">위협</text>
<text x="607.3333333333333" y="823.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">대한민국 침투·도발이 예상되는</text>
<text x="607.3333333333333" y="865.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">적의 능력과 기도가 드러난 상태</text>
