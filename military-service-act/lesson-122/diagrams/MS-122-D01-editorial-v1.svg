<text x="84" y="1021" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#25241F" text-anchor="start">국외여행허가 위반자는 40세까지 준용하되 귀국하여 병역의무를 마친 경우 제외</text>
