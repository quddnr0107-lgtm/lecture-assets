<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역 통지서의 송달</title><desc id="desc">송달과 확인: 송달 주체·방법 지방병무청장·병무지청장이 우편·교부 또는 전자송달; 수령증 수령증을 받아야 함. 등기우편은 수령사실 확인 등으로 갈음 가능; 전자송달 수신자가 동의하는 경우에 한하여 송달 / 송달기한: 원칙 30일 전 병역의무 이행일 30일 전까지 송달되어야 함; 예외 7일 전 병력동원훈련·전시근로소집점검 등 대통령령이 정한 경우; 기한의 특례 천재지변·전시·사변 등 대통령령이 정한 경우에는 대통령령으로 달리 정할 수 있음</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-007</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병역 통지서의 송달</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">송달 방법·기한·수령 확인의 기본 구조</text>
