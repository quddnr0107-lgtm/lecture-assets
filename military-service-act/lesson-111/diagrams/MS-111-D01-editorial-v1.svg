<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역의무는 언제 끝나는가</title><desc id="desc">병·대체역: 종료 연령 현역·예비역·보충역의 병, 전시근로역 및 대체역은 40세까지; 기간을 마치면 병 및 대체역은 면역 / 장교·준사관·부사관: 종료 연령 예비역·보충역은 군인사법상 그 계급의 연령정년이 되는 해까지; 기간을 마치면 장교·준사관 및 부사관은 퇴역</desc>
