<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역의무 이행 준비 지원</title><desc id="desc">지원 주체: 병무청장·지방병무청장 병무지청장 포함. 병역의무 이행 준비 등을 지원할 수 있음; 지원시설 지방병무청장은 상담·교육·정보제공 등에 필요한 시설 설치·운영 가능 / 시설의 주요 업무: 상담·교육 군 특기 추천·병역진로설계 상담 및 병역의무 이행 절차·방법 교육; 정보제공 군복무 적응에 필요한 군생활·자기계발 관련 정보제공 등</desc>
