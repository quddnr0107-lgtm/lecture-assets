<text x="112" y="486" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="400" fill="#77756E" text-anchor="start">지원본부 상황실 + 군·경합동상황실</text>
<text x="112" y="557.3333333333334" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">설치 원칙</text>
<text x="112" y="600.3333333333334" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="400" fill="#77756E" text-anchor="start">군·경합동상황실은 각 지원본부에 설치</text>
<text x="112" y="671.6666666666667" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">분리 설치</text>
<text x="112" y="714.6666666666667" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="400" fill="#77756E" text-anchor="start">지휘·통신·협조와 지역 특성을 고려한 군부대·경찰관서에 설치</text>
<text x="112" y="786.0000000000001" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#25241F" text-anchor="start">통합 설치</text>
<text x="112" y="829.0000000000001" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="400" fill="#77756E" text-anchor="start">인접 2개 이상 시·군·자치구를 같은 군부대·경찰서가 관할하면</text>
<text x="112" y="866.0000000000001" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="400" fill="#77756E" text-anchor="start">가능</text>
