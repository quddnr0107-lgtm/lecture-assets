<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-010-D01 · 정보센터와 합동정보조사팀</title><desc id="desc">법 제9조의2 · 시행령 제18조의2 | 정보 지원과 현지 조사의 기능을 구분 정보센터：역할 대공정보업무 조정·분담, 첩보 수집·정보 판단으로 지역 작전부대 지원；구성·성격 국정원·군·경찰·지자체 등으로 구성하는 비상설 기구；설치 단위 시·도 / 시·군·자치구 합동정보조사팀：조사 개시 적 부대·요원 출현 또는 대공혐의 발생 시 현지 조사·분석；구성·신문 국정원·군·경찰 등 관계기관 정보원 참여, 체포 포로의 일차 신문；설치 단위 중앙 / 시·도 / 시·군·자치구 공통 운영 체계：설치·운영 설치·운영할 수 있으며, 담당자는 국가정보원장；간사기관 원칙: 국가정보원；간사 예외 서울특별시와 시·군·자치구는 대통령이 달리 정할 수 있음 정보센터의 첩보 대상은 적의 침투·도발 및 적정 관련 사항이다. 법 제9조의2제3항은 대통령령에 위임하고, 시행령 제18조의2제3항은 그 밖의 세부사항을 대통령이 정하도록 한다. 법문이 정보센터에 명시한 비상설이라는 속성을 조사팀에도 일괄 적용하지 않는다. 두 조직은 병렬 비교이며 상하 지휘관계를 뜻하지 않는다.</desc>
