<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-008-D03 · 대비태세 확인에서 포상 건의까지</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 08강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">대비태세 확인에서 포상 건의까지</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">유공 확인 → 실무위원회 심의 → 통합방위본부장의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정부 건의</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 433L285.046875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="507" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">화살표는 시행령 제12조제2항의 확인·심의·건의</text>
<text x="80" y="568" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">절차를 나타낸다.</text>
<text x="80" y="649" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부는 국가방위요소에 대해 정기검열 또는</text>
<text x="80" y="710" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지도방문을 매년 한 차례 실시한다. 필요시 수시검열</text>
<text x="80" y="771" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">또는 지도방문을 실시한다(시행령 제12조제1항).</text>
<text x="80" y="852" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">검열·지도방문과 작전 상황 종합 분석은 두 유공 확인</text>
<text x="80" y="913" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경로이며 모두 거쳐야 한다는 뜻이 아니다.</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1010L270.0625 1010" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1084" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제8조제3항제2호·제3호</text>
<text x="80" y="1165" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제12조</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제8조 · TB-008-D03 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
