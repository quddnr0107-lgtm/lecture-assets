<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-009-D03 · 종합상황실의 구성·설치·운영</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 09강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">종합상황실의 구성·설치·운영</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제14조~제16조 | 종합상황실과</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군·경합동상황실을 구별</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 433L285.046875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="507" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">분리 설치 시 군부대 또는 국가경찰관서 중 가장</text>
<text x="80" y="568" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">효과적인 장소를 선택한다.</text>
<text x="80" y="649" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합 설치는 하나의 장소에 설치할 수 있다는 허용</text>
<text x="80" y="710" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">규정이다.</text>
<text x="80" y="791" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">화살표는 기타 운영사항의 결정 절차를 뜻한다.</text>
<text x="80" y="852" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">나머지 항목은 분류이다.</text>
<text x="80" y="939" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 949L270.0625 949" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1023" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제14조·제15조·제16조</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제9조 · TB-009-D03 · 3/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
