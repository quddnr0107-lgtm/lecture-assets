<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-008-D02 · 통합방위 실무위원회는 무엇을 심의하나</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 08강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">통합방위 실무위원회는 무엇을</text>
<text x="80" y="243" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">심의하나</text>
<text x="80" y="330" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부에 설치 · 의장은 본부 부본부장</text>
<path d="M80 369L1000 369" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="443" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">심의사항 · 4개 호 (계속)</text>
<path d="M80 453L572.375 453" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 494L80 669" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="529" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">4 · 포상·문책</text>
<text x="104" y="591" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제12조제2항의 포상 및 법 제23조의</text>
<text x="104" y="652" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">문책요구</text>
<text x="80" y="739" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">회의와 운영</text>
<path d="M80 749L314.21875 749" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 790L80 965" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="825" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">회의 소집</text>
<text x="104" y="887" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정기: 분기 1회 원칙 / 임시: 의장이 필요하다고</text>
<text x="104" y="948" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">인정할 때</text>
<path d="M80 996L80 1110" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1031" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">의결 기준</text>
<text x="104" y="1093" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">재적위원 과반 출석 + 출석위원 과반 찬성</text>
<path d="M80 1141L80 1316" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1176" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">추가 운영사항</text>
<text x="104" y="1238" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령에서 정한 것 외의 조직·운영 사항은</text>
<text x="104" y="1299" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장이 정함</text>
<text x="80" y="1386" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1396L314.21875 1396" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1450" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">포상과 문책요구는 시행령 제13조제2항제4호에 함께</text>
<text x="80" y="1511" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">규정되어 있다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제8조 · TB-008-D02 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
