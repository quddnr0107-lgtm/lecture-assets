<text x="128" y="647" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">제67호서식</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">복무기록표</text>
