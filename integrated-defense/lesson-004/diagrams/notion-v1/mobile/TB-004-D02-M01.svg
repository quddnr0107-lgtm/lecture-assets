<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-004-D02 · 중앙협의회가 심의하는 사항</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 04강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">중앙협의회가 심의하는 사항</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법의 4개 호와, 제4호가 위임한 시행령의 3개 사항</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법 제4조제4항 · 4개 호</text>
<path d="M80 372L551.109375 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">1 · 정책</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 정책</text>
<path d="M80 558L80 672" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">2 · 작전·훈련</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전·훈련 및 그에 관한 지침</text>
<path d="M80 703L80 817" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="738" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">3 · 선포·해제</text>
<text x="104" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위사태의 선포 또는 해제</text>
<path d="M80 848L80 1023" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="883" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">4 · 위임사항</text>
<text x="104" y="945" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">그 밖에 통합방위에 관하여 대통령령으로 정하는</text>
<text x="104" y="1006" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사항</text>
<text x="80" y="1093" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">시행령 제6조 · 제4호의 내용</text>
<path d="M80 1103L655.265625 1103" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1144L80 1319" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1179" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">업무 조정</text>
<text x="104" y="1241" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정부 각 부처 및 관계 기관 간 통합방위 관련 업무의</text>
<text x="104" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">조정</text>
<path d="M80 1350L80 1464" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1385" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">동원 비용</text>
<text x="104" y="1447" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제4조에 따른 예비군 급식비 등 동원비용</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제4조 · TB-004-D02 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
