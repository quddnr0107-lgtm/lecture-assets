<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-011-D01 · 취재 지원과 작전정보 공개</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 11강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">취재 지원과 작전정보 공개</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제10조 · 시행령 제19조 | 지원 의무·설치</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">권한·비공개 범위를 구분</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">취재 지원</text>
<path d="M80 433L270.0625 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">지원 의무</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전지휘관은 대통령령에 따라 언론기관의</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">취재활동 지원</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">보도본부</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 진행 상황 및 대국민 협조사항 등을 알릴</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">필요가 있으면 설치·운영 가능</text>
<path d="M80 886L80 1061" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="921" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">상황 제공</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동보도본부를 통해 취재기자단에 통합방위작전의</text>
<text x="104" y="1044" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">진행 상황을 1일 한 차례 이상 제공하여야 함</text>
<text x="80" y="1131" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">작전정보 공개</text>
<path d="M80 1141L358.375 1141" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1182L80 1357" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1217" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">비공개 원칙</text>
<text x="104" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">병력·장비의 이동·배치·성능 및 작전계획 관련</text>
<text x="104" y="1340" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사항</text>
<path d="M80 1388L80 1563" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">공개 예외</text>
<text x="104" y="1485" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전에 지장 없는 범위 + 국민·지역주민에게 알릴</text>
<text x="104" y="1546" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">필요</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제10조 · TB-011-D01 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
