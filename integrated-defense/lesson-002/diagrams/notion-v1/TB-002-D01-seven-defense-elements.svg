<text x="1102.6666666666665" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">「예비군법」 제3조에 따른 예비군</text>
<text x="1102.6666666666665" y="586" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">민방위대</text>
