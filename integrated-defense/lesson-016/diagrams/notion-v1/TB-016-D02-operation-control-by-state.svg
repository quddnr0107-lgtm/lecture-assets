<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-016-D02 · 사태 종류별 작전통제 범위</title><desc id="desc">시행령 제25조제1항·제4항·제5항 | 누가 어떤 국가방위요소를 통제하는가 갑종·을종：갑종 통합방위본부장 또는 지역군사령관이 모든 국가방위요소 통제；을종 지역군사령관이 모든 국가방위요소 통제 병종 · 경찰관할지역：통제 범위 시도경찰청장: 민방위대 자원 + 지역군사령관에게 위임받은 군 작전요소；군 작전지원 필요시 지역군사령관에게 지원 요청; 군사령관은 군 작전지원반 편성·지원 가능 병종 · 군관할·해역：군·특정경비 지역군사령관이 관할지역 안 모든 국가방위요소 통제；특정·일반해역 함대사령관이 관할해역 안 모든 국가방위요소 통제 군·특정경비는 군관할지역 및 특정경비지역, 특정·일반해역은 특정경비해역 및 일반경비해역을 뜻한다. 군 작전지원은 경찰의 요청과 군사령관의 지원 가능 규정이며, 요청을 즉시 지휘권 이전으로 해석하지 않는다. 경계태세 1급의 함대사령관 통제 대상은 해양경찰이지만, 병종사태의 해역 통제 대상은 모든 국가방위요소이다.</desc>
