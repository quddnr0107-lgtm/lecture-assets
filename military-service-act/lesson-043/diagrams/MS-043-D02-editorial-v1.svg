<title id="title">형 선고 관련 정보의 제공</title><desc id="desc">법정 범죄의 형 선고: 아동·청소년 관련 아동·청소년성보호법 제2조제2호·제3호·제3호의2의 범죄; 개인정보 관련 개인정보 보호법 제70조부터 제73조까지의 범죄; 특정강력범죄 특정강력범죄의 처벌에 관한 특례법 제2조의 범죄 / 추가 대상·제공 기준: 상해·폭행·협박 형법 제257조·제258조·제258조의2·제259~265조 및 제283~286조의 죄; 마약류 관련 마약류관리법 제58조·제58조의2·제59~64조·제65조의2의 범죄; 절차·정보 범위 정보 제공 절차 및 제공되는 정보의 범위는 병무청장이 정함</desc>
