<text x="607.3333333333333" y="586" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">대비태세</text>
<text x="607.3333333333333" y="634" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">통합방위 대비태세의 확인 및 감독</text>
<text x="607.3333333333333" y="731" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">작전 상황</text>
