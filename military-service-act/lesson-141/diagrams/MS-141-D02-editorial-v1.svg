<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전시특례 조치의 주체 구별</title><desc id="desc">국방부장관: 복무·신분 현역병 복무기간 연장, 상근예비역소집 대상자 전역정지·소집된 사람의 현역병 전역; 전환·편입 전환복무 정지·해제 및 법정 공중보건의사 등 편입정지·소집대상 전환; 대체역·처분 대체역 편입절차·소집 정지, 병역처분변경·제적 정지 가능 / 병무청장: 검사·송달 통지서 송달을 공고로 갈음, 검사연령 변경·심리검사 생략 등; 소집·연기 사회복무 등 소집·편입 정지, 검사·징집·소집 연기 정지·제한; 국외체재 귀국명령 및 선포 전에 허가한 국외여행허가 취소 가능</desc>
