<line x1="808" y1="336" x2="808" y2="973" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">국방부장관</text>
<path d="M81 385 C165.017 391 233.841 381 297.422 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제1호</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">총괄·정책</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">예비군 업무 총괄, 조직·편성·운영</text>
<text x="144" y="580.12" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">정책수립 및 제도의 발전</text>
<text x="144" y="683.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">인사·승인</text>
<text x="144" y="725.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">업무담당자 임용·임명·해임과 추가 편성</text>
<text x="144" y="776.56" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">승인</text>
<text x="144" y="879.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">지정·해제</text>
<text x="144" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">수임군부대 지정 및 해제</text>
