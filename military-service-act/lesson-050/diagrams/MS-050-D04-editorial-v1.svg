<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">괴롭힘 조사와 피해자 보호</title><desc id="desc">조사상 비밀: 의무 대상자 조사한 사람, 조사 내용을 보고받은 사람, 그 밖의 조사 참여자; 누설 금지 조사 과정에서 알게 된 비밀을 피해자등의 의사에 반하여 다른 사람에게 누설 금지; 허용되는 예외 복무기관장 등에게 조사 내용 보고 또는 관계 기관 요청에 따른 필요한 정보 제공 / 불리한 처우 금지: 보호 대상 괴롭힘 발생 사실을 신고한 사회복무요원 및 피해사회복무요원등; 기관장의 의무 신고자·피해자등에게 불리한 처우를 하여서는 안 됨</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-050</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   04 / 04</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">괴롭힘 조사와 피해자 보호</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">비밀 누설 및 불리한 처우의 금지</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
