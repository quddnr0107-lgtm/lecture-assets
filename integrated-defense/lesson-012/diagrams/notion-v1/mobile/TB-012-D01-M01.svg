<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-012-D01 · 경계태세의 발령과 해제</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 12강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">경계태세의 발령과 해제</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제11조 · 시행령 제21조·제22조 | 적의 침투·도발</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">또는 위협이 예상될 때 발령 가능</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">발령권자·등급</text>
<path d="M80 433L373.359375 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">서울 외 군</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">연대장급 이상 지휘관 / 해·공군은 독립전대장급</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">이상</text>
<path d="M80 680L80 794" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">서울 외 경찰</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경찰서장급 이상 지휘관</text>
<path d="M80 825L80 939" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="860" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">서울특별시</text>
<text x="104" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령이 정하는 군부대의 장</text>
<path d="M80 970L80 1145" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1005" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">등급</text>
<text x="104" y="1067" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경계태세 3급·2급·1급 / 세부내용·조치는 대통령이</text>
<text x="104" y="1128" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정함</text>
<text x="80" y="1215" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">발령·해제 절차</text>
<path d="M80 1225L386.796875 1225" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1266L80 1441" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1301" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">원칙: 선보고</text>
<text x="104" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">차상급 지휘관 보고 후 발령·해제; 통신두절 등</text>
<text x="104" y="1424" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">불가피한 사유는 예외</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제11조 · TB-012-D01 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
