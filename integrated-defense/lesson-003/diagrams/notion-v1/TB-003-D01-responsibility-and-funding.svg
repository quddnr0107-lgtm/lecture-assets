<text x="607.3333333333333" y="434" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">발생 조건</text>
<text x="607.3333333333333" y="482" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">통합방위사태 선포에 따른</text>
<text x="607.3333333333333" y="524" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">국가방위요소 동원비용</text>
<text x="607.3333333333333" y="621" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">지원 방식</text>
<text x="607.3333333333333" y="669" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">정부가 대통령령에 따라 예산</text>
<text x="607.3333333333333" y="711" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">범위에서 해당 지방자치단체에</text>
<text x="607.3333333333333" y="753" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지원</text>
