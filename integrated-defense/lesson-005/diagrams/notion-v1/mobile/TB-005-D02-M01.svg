<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-005-D02 · 지역협의회와 지역실무위원회</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 05강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">지역협의회와 지역실무위원회</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역별 의장, 조례, 회의 운영을 구분</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">의장과 구성·운영 기준</text>
<path d="M80 372L532.703125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">시·도 협의회</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도지사 소속이며 의장도 시·도지사</text>
<path d="M80 558L80 672" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">시·군·구 협의회</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시장·군수·자치구 구청장 소속이며 해당 장이 의장</text>
<path d="M80 703L80 878" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="738" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">조례로 정함</text>
<text x="104" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령령으로 정하는 기준에 따라 구성·운영 사항을</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">조례로 정함</text>
<text x="80" y="948" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지역협의회 회의</text>
<path d="M80 958L402.53125 958" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 999L80 1113" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1034" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">소집</text>
<text x="104" y="1096" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정기: 분기 1회 원칙 / 임시: 필요시 의장이 소집</text>
<path d="M80 1144L80 1319" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1179" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">화상회의</text>
<text x="104" y="1241" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">전자투표 포함 가능. 참여자는 동일 회의장에 출석한</text>
<text x="104" y="1302" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">것으로 봄</text>
<path d="M80 1350L80 1464" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1385" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">일반 의결</text>
<text x="104" y="1447" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">재적위원 과반 출석 + 출석위원 과반 찬성</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제5조 · TB-005-D02 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
