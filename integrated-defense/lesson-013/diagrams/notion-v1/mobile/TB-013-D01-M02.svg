<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-013-D01 · 대통령·시도지사의 선포 절차</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 13강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">대통령·시도지사의 선포 절차</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제12조제1항~제5항 | 건의는 의무, 심의 후 선포는</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">권한</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">시도지사 선포 경로 (계속)</text>
<path d="M80 433L595.609375 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">즉시 건의</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시도경찰청장 또는 지역군사령관 또는 함대사령관</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">→ 시도지사</text>
<path d="M80 680L80 794" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">사전 심의</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시도지사는 건의를 받으면 시도협의회 심의를 거침</text>
<path d="M80 825L80 1000" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="860" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">선포 권한</text>
<text x="104" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">심의 후 시도지사가 을종·병종사태를 선포할 수</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">있음</text>
<text x="80" y="1070" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1080L314.21875 1080" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1134" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">갑종은 대통령 경로, 을·병종은 발생 범위에 따라</text>
<text x="80" y="1195" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">대통령 경로와 시도지사 경로를 구별한다.</text>
<text x="80" y="1282" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1292L285.046875 1292" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1366" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">광역은 이 도식에서 2개 이상의 시도에 걸친 상황을</text>
<text x="80" y="1427" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">줄여 부르는 표현이다.</text>
<text x="80" y="1508" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">화살표는 각 경로 안의 건의·심의·선포 절차이다.</text>
<text x="80" y="1569" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령과 시도지사 경로는 서로 다르다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제12조 · TB-013-D01 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
