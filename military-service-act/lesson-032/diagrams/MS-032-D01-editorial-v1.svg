<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">상근예비역 입영에서 소집까지</title><desc id="desc">현역병 입영: 지방병무청장 거주지별 필요인원에 따라 상근예비역소집 대상자를 현역병으로 입영시킴 / 예비역 편입: 각 군 참모총장 법 제21조제1항의 현역 복무기간을 마친 다음 날 예비역에 편입시켜야 함 / 상근예비역 소집: 각 군 참모총장 예비역으로 편입된 날부터 소집하여야 함 — 법 제65조제3항의 예비역 편입자 포함</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-032</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">상근예비역 입영에서 소집까지</text>
