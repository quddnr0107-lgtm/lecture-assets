<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">선거와 관련하여 금지되는 행위</title><desc id="desc">권유·서명·게시: 투표 권유 운동 투표를 하거나 하지 않도록 권유 운동을 하는 것; 서명 운동 서명 운동을 기도·주재하거나 권유하는 것; 문서·도서 게시 문서나 도서를 공공시설 등에 게시하거나 게시하게 하는 것 / 자금·정당 가입: 기부금·공공자금 기부금 모집 또는 모집하게 하기, 공공자금 이용 또는 이용하게 하기; 정당 가입 권유 타인의 정당 가입 또는 불가입을 권유하는 운동</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-053</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   02 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">선거와 관련하여 금지되는 행위</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">특정 정당 또는 특정인을 지지·반대하기 위한 행위</text>
