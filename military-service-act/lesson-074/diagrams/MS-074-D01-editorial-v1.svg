<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">대표이사와 4촌 이내 혈족</title><desc id="desc">제한 대상: 혈족 4촌 이내 병역지정업체 대표이사의 4촌 이내 혈족에 해당하는 사람.; 기업부설 연구기관 기업부설 연구기관이면 모기업의 대표이사를 기준으로 판단한다. / 제한과 확인: 편입·전직 불가 그 병역지정업체에 전문연구요원·산업기능요원 편입 또는 법정 전직을 할 수 없다.; 업체장의 확인 업체장은 제한대상자인지 확인하고, 해당하지 않는 사람의 신청서만 관할 지방병무청장에게 제출한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
