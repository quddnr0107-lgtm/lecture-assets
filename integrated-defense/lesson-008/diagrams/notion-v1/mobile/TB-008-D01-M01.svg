<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-008-D01 · 통합방위본부의 설치와 5개 사무</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 08강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">통합방위본부의 설치와 5개 사무</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동참모본부에 설치 · 본부장 1명과 부본부장 1명</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">설치와 본부장</text>
<path d="M80 372L358.375 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">설치 위치</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동참모본부에 통합방위본부를 둠</text>
<path d="M80 558L80 672" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">본부장</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동참모의장</text>
<path d="M80 703L80 878" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="738" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">부본부장</text>
<text x="104" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합참에서 군사작전 기획 등 작전 업무를 총괄하는</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">참모 부서의 장</text>
<text x="80" y="948" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">정책·태세·상황</text>
<path d="M80 958L401.78125 958" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 999L80 1113" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1034" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">정책</text>
<text x="104" y="1096" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 정책의 수립 및 조정</text>
<path d="M80 1144L80 1258" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1179" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">대비태세</text>
<text x="104" y="1241" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 대비태세의 확인 및 감독</text>
<path d="M80 1289L80 1403" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1324" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">작전 상황</text>
<text x="104" y="1386" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전 상황의 종합 분석 및 대비책 수립</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제8조 · TB-008-D01 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
