<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-004-D02 · 중앙협의회가 심의하는 사항</title><desc id="desc">법의 4개 호와, 제4호가 위임한 시행령의 3개 사항 법 제4조제4항 · 4개 호：1 · 정책 통합방위 정책；2 · 작전·훈련 통합방위작전·훈련 및 그에 관한 지침；3 · 선포·해제 통합방위사태의 선포 또는 해제；4 · 위임사항 그 밖에 통합방위에 관하여 대통령령으로 정하는 사항 시행령 제6조 · 제4호의 내용：업무 조정 정부 각 부처 및 관계 기관 간 통합방위 관련 업무의 조정；동원 비용 시행령 제4조에 따른 예비군 급식비 등 동원비용；위원 제출 안건 그 밖에 중앙협의회 위원이 제출하는 안건 오른쪽 3개 사항은 법 제4조제4항제4호를 구체화한 내용이며 법의 별도 제5~7호가 아니다. 심의사항의 포함 관계를 나타내며, 협의회가 직접 사태를 선포한다는 뜻이 아니다.</desc>
