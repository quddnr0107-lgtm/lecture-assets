<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-020-D01 · 발견한 누구든지, 지체 없이 신고</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 20강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">발견한 누구든지, 지체 없이 신고</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적의 침투·출현뿐 아니라 그 흔적의 발견도 신고 대상</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 372L314.21875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="426" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">발견자 누구든지 → 발견 사실을 지체 없이 → 군부대</text>
<text x="80" y="487" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">또는 행정기관</text>
<text x="80" y="574" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 584L285.046875 584" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">신고 수신기관은 “군부대 또는 행정기관”이다.</text>
<text x="80" y="745" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 755L270.0625 755" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="829" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제19조</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제19조 · TB-020-D01 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
