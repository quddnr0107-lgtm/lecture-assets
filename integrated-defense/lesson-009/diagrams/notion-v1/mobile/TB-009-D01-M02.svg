<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-009-D01 · 지원본부의 설치와 사무</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 09강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">지원본부의 설치와 사무</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제9조 · 시행령 제17조 | 지역별로 설치하고</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관할지역의 지원을 담당</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">시행령의 추가 사무</text>
<path d="M80 433L460.125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">동원 지원</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위작전 관련 동원 업무 지원</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">보도본부 지원</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역 합동보도본부 설치 지원</text>
<path d="M80 764L80 878" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="799" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">협의회 결정</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역협의회가 심의·의결한 사항 시행</text>
<text x="80" y="948" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 958L314.21875 958" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">지원본부는 지역별 지원조직이며, 각 본부가</text>
<text x="80" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">관할지역의 지원 사무를 맡는다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제9조 · TB-009-D01 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
