<text x="84" y="964" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">의결정족수는 중앙협의회와 시도협의회가 사태 선포 또는 해제를 심의·의결할 때 적용한다. 국무회의에 이 협의회 정족수를 그대로 적용하지 않는다.</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">게시판 공고 대상은 해당 지역 시·군·자치구·읍·면·동이다. 시도지사의 보고 경로에 있는 행정안전부장관과 국방부장관은 둘 다 포함한다. 의회의 해제</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">요구에 따른 심의 예외는 법 제14조를 따르며 TB015에서 다룬다.</text>
