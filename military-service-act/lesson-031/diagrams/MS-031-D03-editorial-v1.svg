<title id="title">승선근무예비역 군사교육</title><desc id="desc">군사교육 시점: 원칙 편입 후 최초 승선근무를 하기 전에 군사교육소집 실시; 이미 승선 중 시행령 제40조의2제1항의 선박에서 이미 근무 중이면 하선한 때 실시 / 통지서 송달: 관할 지방병무청장 본인에게 군사교육소집 통지서를 송달; 30일 전까지 군사교육소집 30일 전까지 송달하여야 함</desc>
