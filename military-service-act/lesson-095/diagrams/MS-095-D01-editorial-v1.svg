<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">기본병과 현역장교 편입</title><desc id="desc">법무 분야 미편입자: 법정 자격·과정 판사·검사·변호사 자격자 또는 법정 법무사관후보생과정 수료자 중 법무장교 미편입자.; 기본병과로 편입 법정 요건을 갖추고 본인이 원하면 기본병과 현역장교 병적에 편입할 수 있다. / 29세까지 편입: 국가·지방 5급 공채 국가 5급 공개경쟁 채용시험 또는 지방 5급 공개경쟁 임용시험 합격자.; 외무공무원 5등급 외무공무원법 제10조제1항 단서에 따라 5등급 외무공무원으로 채용이 결정된 사람.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-095</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">기본병과 현역장교 편입</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">현역병입영 대상자가 원할 경우</text>
