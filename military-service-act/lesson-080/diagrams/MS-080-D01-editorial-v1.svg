<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병력동원소집의 대상</title><desc id="desc">언제·왜 소집하나: 상황 전시·사변 또는 이에 준하는 국가비상사태.; 목적 부대편성이나 작전수요를 위하여 실시한다. / 세 가지 대상: 예비역 예비역을 대상으로 한다.; 보충역 군사교육소집을 마친 보충역 및 제66조에 따라 보충역에 편입된 사람.</desc>
