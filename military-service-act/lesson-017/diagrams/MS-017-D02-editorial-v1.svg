<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">적성을 변경할 수 있는 때</title><desc id="desc">자격·면허의 변화: 취득 자격 또는 면허를 받은 경우 적성 변경 가능; 취소 자격 또는 면허가 취소된 경우 적성 변경 가능 / 인원·전공의 변화: 입영인원 조정 적성별 입영인원의 조정이 필요한 경우; 전공학과 등 전공학과 이수 등으로 적성 재분류가 필요한 경우</desc>
