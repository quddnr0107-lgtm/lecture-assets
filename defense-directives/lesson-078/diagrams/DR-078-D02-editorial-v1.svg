<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">휴직·휴학과 외항선원 관리</title><desc id="desc">DR-078 · 교육훈련 훈령 제23조. 일을 쉬는 경우와 학업을 쉬는 경우의 보류 신분이 다르다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-078</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">교육훈련</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">휴직·휴학과 외항선원 관리</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">일을 쉬는 경우와 학업을 쉬는 경우의 보류 신분이 다르다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="1002" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">휴직과 휴학</text>
<path d="M81 385 C170.188 391 243.198 381 309.734 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">이미 동원·훈련을 보류받던 사람</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">휴직</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">휴직기간 동안 보류자로 관리</text>
<text x="144" y="688.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">학생 휴학</text>
<text x="144" y="730.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">보류자 신분에서 해제</text>
<path d="M116 459 C96 459 92 466 92 485 L92 740.4 C92 763.4 102 772.4 117 772.4" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">외항선원</text>
<path d="M844 341 C866 311 976.562 307 1030.56 331 C1051.56 346 1037.56 381 1008.56 393 C937.281 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제1항제4호사목</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">미재승선</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">하선 후 90일 되는 날까지 재승선하지 않으면</text>
<text x="860" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">해소</text>
<text x="860" y="661.233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">해소 기준일</text>
<text x="860" y="703.233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">하선일을 기준으로 보류해소 처리</text>
<text x="860" y="785.767" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">기간 중 훈련</text>
<text x="860" y="827.767" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">하선 후 해당 기간 부과훈련은 연기 처리</text>
<text x="860" y="910.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">해소 신고</text>
<text x="860" y="952.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">하선일로부터 90일이 되는 날부터 14일 이내</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">교육훈련 훈령 제23조 · DR-078-D02</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
