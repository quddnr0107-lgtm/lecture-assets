<text x="1102.6666666666665" y="623.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">해제 의무</text>
<text x="1102.6666666666665" y="671.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">상황 종료 또는 상급 지휘관 지시가</text>
<text x="1102.6666666666665" y="713.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">있으면 발령권자가 해제</text>
<text x="1102.6666666666665" y="806.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">해제 간주</text>
<text x="1102.6666666666665" y="854.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">법 제12조에 따라 통합방위사태가</text>
<text x="1102.6666666666665" y="896.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">선포되면 해제된 것으로 봄</text>
