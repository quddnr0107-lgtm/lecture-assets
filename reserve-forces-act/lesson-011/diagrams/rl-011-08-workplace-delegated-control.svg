<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">재위탁받은 지휘관의 업무</title>
<desc id="desc">RL-011 예비군법 제7조, 무장. 직장예비군부대의 지휘관과 경찰서장의 관계</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F4F4" stroke="none"/>
<rect x="64" y="38" width="7" height="29" rx="3" fill="#275AA3" stroke="none"/>
<text x="87" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#275AA3" text-anchor="start">제80회  ·  예비군법</text>
<text x="1536" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#545860" text-anchor="end">주체·기준 비교</text>
<text x="64" y="142" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="52" font-weight="700" fill="#202124" text-anchor="start">재위탁받은 지휘관의 업무</text>
<text x="67" y="190" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#545860" text-anchor="start">직장예비군부대의 지휘관과 경찰서장의 관계</text>
<rect x="64" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="64" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="64" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="106" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">지휘관이 수행</text>
<text x="106" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">무기·탄약·장비 등</text>
<text x="106" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">사용통제 및 보관 업무</text>
<line x1="106" y1="469" x2="742" y2="469" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="106" y="511" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">창고의 경비</text>
<text x="106" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">무기고·탄약고 및 장비고 등의 경비 업무</text>
<rect x="816" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="816" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="816" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="858" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">경찰서장의 통제</text>
<text x="858" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">통제 대상</text>
<text x="858" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">무기 및 탄약의 사용</text>
<line x1="858" y1="469" x2="1494" y2="469" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="858" y="511" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">지휘관의 의무</text>
<text x="858" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">무기 및 탄약을 사용할 때 경찰서장의 통제를</text>
<text x="858" y="601" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">받아야 함</text>
<rect x="64" y="760" width="1472" height="77" rx="12" fill="#E6EDF7" stroke="none"/>
<rect x="64" y="760" width="6" height="77" rx="3" fill="#275AA3" stroke="none"/>
<text x="92" y="807" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#275AA3" text-anchor="start">재위탁 후에도 무기·탄약 사용은 경찰서장 통제 아래 있음</text>
<text x="66" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#545860" text-anchor="start">예비군법 제7조</text>
<text x="1536" y="877" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#545860" text-anchor="end">RL-011  ·  08 / 14</text>
</svg>
