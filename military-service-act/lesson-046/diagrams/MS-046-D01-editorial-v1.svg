<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무 관리·감독의 주체</title><desc id="desc">복무관리 담당직원: 기관장의 지정 의무 복무하는 국가기관·지자체·공공단체·사회복지시설의 장이 담당직원을 지정하여야 함; 사회복지시설 예외 지방병무청장이 소속 직원 중 담당직원을 지정할 수 있음 / 병무청장의 관리: 전자적 복무관리 출퇴근·휴가·결근·지각·조퇴 등을 관리할 정보시스템을 구축·운영할 수 있음; 관리·감독과 협조 대통령령에 따라 관리·감독할 수 있으며 복무기관의 장은 협조하여야 함</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
