<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">승선근무예비역의 편입</title><desc id="desc">공통 요건: 면허 선박직원법에 따른 항해사·기관사 면허 보유; 지원 각 편입 경로에 해당하는 사람이 지원하여 편입 가능 / 편입 경로·병적: 예비역 장교 고교 이상 학교의 해군 학군 사관후보생 과정 수료 후 현역 장교 병적에 편입되지 않은 사람; 예비역 부사관 고교 이상 학교의 해군 학군 부사관후보생 과정 수료 후 현역 부사관 병적에 편입되지 않은 사람</desc>
