<text x="888" y="467" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">국외 거주 배우자, 본인·배우자의</text>
<text x="888" y="504" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">형제자매·직계존속·직계비속</text>
<circle cx="858" cy="548" r="5" fill="#25241F"/>
<text x="888" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">본인 질병</text>
<text x="888" y="594" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">국내에서 치료 곤란</text>
<circle cx="858" cy="638" r="5" fill="#25241F"/>
<text x="888" y="647" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">가사 정리</text>
<text x="888" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">입영·소집을 위한 경우</text>
<circle cx="858" cy="728" r="5" fill="#25241F"/>
<text x="888" y="737" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제한 조치의 주체</text>
<text x="888" y="774" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">병무청장</text>
<text x="80" y="990" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#25241F" text-anchor="start">복무 중인 사람의 제외 적용 범위는 원고상 불명확하여 별도 검토 보류</text>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>