<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역판정검사 대상자 조사</title><desc id="desc">조사 대상·업무: 다음 해 검사 대상 매년 다음 해 병역판정검사를 받아야 할 사람을 조사; 주민등록 오류 등 기재 내용이 명백히 잘못되거나 정정된 사람 중 검사 대상자도 조사; 데이터베이스 병적 데이터베이스를 작성하여 병역판정검사를 받게 하여야 함 / 조사 일정: 9월 15일까지 지방병무청장이 조사 후 결과 입력·정리, 대상자 현황서 작성·관리; 9월 30일까지 대상자 현황서를 병무청장에게 제출</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-012</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병역판정검사 대상자 조사</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지방병무청장이 조사하고 데이터베이스를 작성</text>
