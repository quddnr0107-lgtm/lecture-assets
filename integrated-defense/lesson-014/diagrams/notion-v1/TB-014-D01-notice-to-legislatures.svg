<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-014-D01 · 선포 후 의회 통고와 소집 요구</title><desc id="desc">법 제13조 | 선포권자가 해당 의회에 지체 없이 통고 대통령이 선포한 경우：통고 대상 국회；통고 시점 선포 후 지체 없이 시도지사가 선포한 경우：통고 대상 해당 시도의회；통고 시점 선포 후 지체 없이 폐회 중이면：소집 요구 통고할 때 국회 또는 시도의회가 폐회 중이면 소집 요구 의무；기구 구별 선포 전: 협의회 심의 / 선포 후: 국회·시도의회 통고 통고를 선포 전 동의·승인 절차로 바꾸어 표시하지 않는다. 협의회와 의회는 서로 다른 기구이다. 대통령의 선포 전 심의에는 국무회의도 포함된다. 두 선포권자의 통고 경로는 병렬 관계이다.</desc>
