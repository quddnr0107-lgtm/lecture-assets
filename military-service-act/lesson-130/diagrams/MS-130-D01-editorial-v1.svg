<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">여비 등 국고부담과 환수</title><desc id="desc">국고부담: 검사 관련 법정 검사 여비·진단서 및 보완서류 발급비용·위탁검사비; 전형·입영·귀가 현역병 선발 전형 응시 여비, 징집·소집·지원 입영 및 귀가 여비 / 전부 또는 일부 환수: 부정·잘못 지급 거짓·부정한 방법으로 받은 경우 또는 비용이 잘못 지급된 경우; 여비 수령 후 미입영 입영통지 취소·입영일 연기·입영기피로 입영하지 않은 경우</desc>
