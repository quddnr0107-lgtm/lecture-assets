<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-012-D02 · 경계태세별 작전통제와 협조</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 12강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">경계태세별 작전통제와 협조</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제23조 | 1급은 관할별 통제, 2·3급은 상호</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">협조</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">1급 · 지상</text>
<path d="M80 433L290.984375 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">경찰관할지역</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시도경찰청장이 지역군사령관에게 위임받은 군</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전요소 통제</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">군관할지역</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역군사령관이 시도경찰청장에게 위임받은 경찰</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전요소 통제</text>
<path d="M80 886L80 1061" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="921" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">특정경비지역</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역군사령관이 해당 지역의 모든 국가방위요소</text>
<text x="104" y="1044" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통제</text>
<text x="80" y="1131" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">1급 · 해상·지원</text>
<path d="M80 1141L407.71875 1141" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1182L80 1296" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1217" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">관할해역</text>
<text x="104" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">함대사령관이 특정·일반 경비해역의 해양경찰 통제</text>
<path d="M80 1327L80 1502" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">입출항 기관</text>
<text x="104" y="1424" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해안경계 부대장이 입출항 신고기관 근무 해양경찰</text>
<text x="104" y="1485" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통제</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제11조 · TB-012-D02 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
