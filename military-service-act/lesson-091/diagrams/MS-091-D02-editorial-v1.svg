<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">보충역 군사교육소집 시기</title><desc id="desc">소집·편입 초기: 사회복무요원 소집과 동시에 실시. 부득이한 경우 소집일부터 1년 이내에 실시한다.; 예술·체육요원 편입일부터 1년 이내에 실시한다. / 배치 전·복무 중: 의사·법무관·수의사 공중보건·전담의사·공익법무관·공중방역수의사는 복무기관 배치 전. 공익상 필요 시 협의해 배치 후 가능.; 전문연구·산업기능 의무복무기간 중 실시. 국외근무·승선 등으로 불가능하면 그 사유가 없어진 때 실시한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-091</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   02 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">보충역 군사교육소집 시기</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">복무 유형에 따라 교육하는 때가 다르다</text>
