<text x="1170.0666666666666" y="530" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">중앙협의회·국무회의 심의</text>
<text x="1170.0666666666666" y="572" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">없이 지체 없이 해제·공고</text>
<text x="1170.0666666666666" y="669" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">시도의회 요구</text>
<text x="1170.0666666666666" y="717" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시도지사는 시도협의회 심의</text>
<text x="1170.0666666666666" y="759" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">없이 지체 없이 해제·공고 및</text>
<text x="1170.0666666666666" y="801" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">보고</text>
