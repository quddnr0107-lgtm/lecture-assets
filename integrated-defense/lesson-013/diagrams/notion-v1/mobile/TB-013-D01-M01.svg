<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-013-D01 · 대통령·시도지사의 선포 절차</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 13강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">대통령·시도지사의 선포 절차</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제12조제1항~제5항 | 건의는 의무, 심의 후 선포는</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">권한</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">대통령 선포 경로</text>
<path d="M80 433L415.96875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">갑종·광역 을종</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">갑종 또는 2개 이상 시도에 걸친 을종: 국방부장관이</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">건의</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">광역 병종</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">2개 이상 시도에 걸친 병종: 행정안전부장관 또는</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국방부장관이 건의</text>
<path d="M80 886L80 1000" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="921" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">즉시 건의</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해당 장관 → 국무총리 경유 → 대통령</text>
<path d="M80 1031L80 1206" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1066" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">심의 후 선포</text>
<text x="104" y="1128" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">중앙협의회 + 국무회의 심의 → 대통령이 선포할 수</text>
<text x="104" y="1189" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">있음</text>
<text x="80" y="1276" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">시도지사 선포 경로</text>
