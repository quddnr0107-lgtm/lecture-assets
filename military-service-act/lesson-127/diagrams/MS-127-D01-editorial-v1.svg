<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역 정보의 기록과 증명</title><desc id="desc">기록·관리: 병무청장·지방병무청장 병역준비역 편입·검사·복무·입영·면제, 복무 완료자의 복무·교육·수련 기록 관리; 전자정보처리 병무청장은 체계적 기록·관리 프로그램을 구축·운영하여야 함 / 확인·증명: 정보 주체 자신의 병역 정보 확인·증명을 지방병무청장에게 신청 가능; 발급 의무 신청을 받으면 병적증명서 또는 병적기록표를 발급하여야 함</desc>
