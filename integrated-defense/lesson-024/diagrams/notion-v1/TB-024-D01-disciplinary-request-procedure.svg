<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">조사 결과 → 실무위원회 심의 → 본부장 결정 → 소속기관 조치 → 본부장에 결과 통보</text>
