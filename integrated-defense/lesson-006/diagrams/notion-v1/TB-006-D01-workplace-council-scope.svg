<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-006-D01 · 직장협의회, 언제 두어야 하는가</title><desc id="desc">의무 설치 2개 유형과 원하는 경우의 설치를 구분 두어야 하는 직장：중대급 이상 중대급 이상의 예비군 부대가 편성된 직장；국가중요시설 법 제21조제4항에 따라 지정된 국가중요시설인 직장 원하면 둘 수 있는 직장：소대급 자원 소대급의 직장예비군 자원이 있는 직장 의장과 위원：의장 직장의 장；예비군 부대장 해당 직장예비군 부대의 장이 위원이 됨；직장 간부 해당 직장의 간부 중 의장이 지명하는 사람 의무·선택 설치 조건과 구성 관계를 나타내며 순차적 절차가 아니다. 직장협의회의 범위·운영은 법 제6조제2항에 따라 대통령령으로 정한다.</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#FFFEFC"/>
<text x="80" y="73" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">무한회독  /  통합방위법</text>
<text x="1520" y="73" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#77756E" text-anchor="end">06강   ·   제6조   /   D01</text>
<text x="80" y="177" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="66" font-weight="700" fill="#25241F" text-anchor="start">직장협의회, 언제 두어야 하는가</text>
<text x="84" y="235" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">의무 설치 2개 유형과 원하는 경우의 설치를 구분</text>
