<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">지역·직장예비군 운용원칙</title><desc id="desc">DR-031 · 조직·편성 훈령 제31조. 기본 지휘권한을 확인한 뒤 지역과 직장의 임무를 비교한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-031</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">조직·편성·운영</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">지역·직장예비군 운용원칙</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">기본 지휘권한을 확인한 뒤 지역과 직장의 임무를 비교한다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="1002" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">지역예비군</text>
<path d="M81 385 C165.017 391 233.841 381 297.422 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">행정구역 단위 운용이 원칙</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제1항 · 지휘</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">수임군부대장에게 권한을 위임받은</text>
<text x="144" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">관리대대장 또는 위탁받은 경찰서장이</text>
<text x="144" y="628.4" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">지휘한다.</text>
<text x="144" y="700.1" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2항제1호</text>
<text x="144" y="742.1" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">중요시설·핵심노드를 방호하고 취약지역</text>
<text x="144" y="791.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">통제를 위해 일정지역에 배치한다.</text>
<text x="144" y="863.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제2항제2호</text>
<text x="144" y="905.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">필요 시 작전 우선순위가 높은 대대 내 다른</text>
<text x="144" y="955.2" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">지역으로 전환 운용할 수 있다.</text>
<path d="M116 459 C96 459 92 466 92 485 L92 964.9 C92 987.9 102 996.9 117 996.9" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">직장예비군</text>
<path d="M844 341 C866 311 1015.2 307 1069.2 331 C1090.2 346 1076.2 381 1047.2 393 C956.602 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">해당 시설 자체방호가 원칙</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제3항 · 원칙</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">해당 시설을 자체 방호한다.</text>
<text x="860" y="688.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제3항 · 지원</text>
<text x="860" y="730.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">필요 시 지역예비군을 지원할 수 있다.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제31조 · DR-031-D01</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
