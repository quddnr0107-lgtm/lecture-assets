<text x="104" y="860" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">신문·방송</text>
<text x="104" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각 신문·방송에 보도되도록 조치</text>
