<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-015-D01 · 평상 회복과 의회 요구의 해제</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 15강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">평상 회복과 의회 요구의 해제</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제14조 | 평상 회복 경로와 의회 요구 경로를 구별</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">평상 회복 · 시도지사 경로 (계속)</text>
<path d="M80 372L734.125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">해제 보고</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">행안부장관 및 국방부장관과 국무총리를 거쳐</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령에게 보고</text>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">의회의 해제 요구 · 예외</text>
<path d="M80 668L554.484375 668" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 709L80 884" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="744" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">국회 요구</text>
<text x="104" y="806" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령은 중앙협의회·국무회의 심의 없이 지체 없이</text>
<text x="104" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해제·공고</text>
<path d="M80 915L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="950" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">시도의회 요구</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시도지사는 시도협의회 심의 없이 지체 없이</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해제·공고 및 보고</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1170L314.21875 1170" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1224" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">평상 회복은 심의 후 해제, 의회 요구는 심의 없이</text>
<text x="80" y="1285" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">해제·공고.</text>
<text x="80" y="1372" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1382L285.046875 1382" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1456" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">평상 회복 경로는 건의 → 심의 → 해제·공고</text>
<text x="80" y="1517" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">순서이다. 심의와 해제의 순서를 뒤집지 않는다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제14조 · TB-015-D01 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
