<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-008-D03 · 대비태세 확인에서 포상 건의까지</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 08강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">대비태세 확인에서 포상 건의까지</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">유공 확인 → 실무위원회 심의 → 통합방위본부장의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정부 건의</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">01 유공 확인</text>
<path d="M80 433L337.578125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">검열·지도방문</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위태세 확립에 현저한 공이 있는</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">개인·부대·기관 확인</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">작전 상황 분석</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">종합 분석 결과 통합방위작전에 현저한 공이 있는</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">개인·부대·기관 확인</text>
<text x="80" y="925" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">02 통합방위 실무위원회</text>
<path d="M80 935L558.359375 935" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 976L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1011" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">포상 심의</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">확인된 유공 개인·부대·기관의 포상에 관하여 심의</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">03 통합방위본부장</text>
<path d="M80 1170L456.609375 1170" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1211L80 1325" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1246" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">정부에 건의</text>
<text x="104" y="1308" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">실무위원회의 심의를 거쳐 정부에 포상을 건의</text>
<text x="80" y="1395" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1405L314.21875 1405" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1459" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">포상 건의 주체는 통합방위본부장이며, 실무위원회의</text>
<text x="80" y="1520" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">심의를 거친다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제8조 · TB-008-D03 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
