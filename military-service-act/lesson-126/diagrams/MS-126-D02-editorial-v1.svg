<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병적 관리의 14일 의무</title><desc id="desc">계약 변동: 대중문화예술사업자 대중문화예술인과 계약을 새로 맺거나 계약이 종료된 경우; 14일 이내 사유 발생일부터 병무청장에게 변동사항 통보 / 요청받은 자료: 기관·단체의 장 병적 관리 대상·변동사항·질병·심신장애 확인을 위한 자료 요청; 14일 이내 요청받은 자료를 병무청장 또는 지방병무청장에게 제출</desc>
