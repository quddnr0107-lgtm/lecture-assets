<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-019-D01 · 검문소 설치권자와 사전 조치</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 19강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">검문소 설치권자와 사전 조치</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">일반 검문소·해경 설치 시 협의·경찰과 군의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동검문소를 구분</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">설치·운용</text>
<path d="M80 433L285.046875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">네 설치권자</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도경찰청장·지방해양경찰청장·지역군사령관·</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">함대사령관</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">설치 장소</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관할구역의 적 침투 예상 공항·항만 등 지상·해상</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">교통 요충지</text>
<path d="M80 886L80 1061" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="921" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">예비군 지원</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도경찰청장은 필요시 지역군사령관의 예비군</text>
<text x="104" y="1044" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지원을 받아 취약지역에 설치</text>
<text x="80" y="1131" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지방해양경찰청장 설치 시</text>
<path d="M80 1141L592.59375 1141" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1182L80 1296" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1217" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">사전 협의</text>
<text x="104" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">미리 관할 함대사령관과 협의하여야 함</text>
<path d="M80 1327L80 1502" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">법정 포함 범위</text>
<text x="104" y="1424" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지방해양경찰청장에는 대통령령으로 정하는</text>
<text x="104" y="1485" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해양경찰서장을 포함</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제18조 · TB-019-D01 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
