<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병력동원소집의 복무와 해제</title><desc id="desc">복무·처우: 현역과 같이 병력동원소집으로 입영한 사람의 복무와 처우는 현역과 같이 한다.; 해제 세부사항 소집해제에 필요한 사항은 대통령령으로 정한다. / 해제 명령: 국방부장관 법정 사유이면 각 군 참모총장으로 하여금 소집해제를 명하게 할 수 있다.; 해제 사유 전시·사변 종료, 동원령 해제 또는 정원 조정이 필요하다고 인정한 경우.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-084</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병력동원소집의 복무와 해제</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">현역과 같은 처우 및 해제 권한</text>
