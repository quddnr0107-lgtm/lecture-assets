<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-006-D02 · 직장협의회와 산업단지협의회</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 06강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">직장협의회와 산업단지협의회</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">심의 내용·설치 요건·회의 운영의 비교</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">직장협의회</text>
<path d="M80 372L300.78125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">방위대책</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직장 단위 방위대책 및 지원계획의 수립·시행을</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">심의</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">직장예비군</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">직장예비군 운영·육성·지원을 심의</text>
<path d="M80 764L80 939" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="799" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">회의 소집</text>
<text x="104" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">정기: 분기 1회 원칙 / 임시: 의장이 필요하다고</text>
<text x="104" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">인정할 때</text>
<path d="M80 970L80 1084" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1005" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">의결 기준</text>
<text x="104" y="1067" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">재적위원 과반 출석 + 출석위원 과반 찬성</text>
<text x="80" y="1154" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">산업단지협의회</text>
