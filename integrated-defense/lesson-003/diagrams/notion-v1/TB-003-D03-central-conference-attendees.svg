<title id="title">TB-003-D03 · 중앙 통합방위회의 참석 대상</title><desc id="desc">시행령 제3조제2항 · 법정 열거 1~9호 협의회·정부：1호 중앙협의회의 의장 및 위원；2호 방송미디어통신위원회위원장；3호 시·도 협의회의 의장；4호 국가정보원의 지부장 경찰·소방·해양경찰：5호 경찰청장 및 시·도경찰청장；6호 소방청장 및 소방본부장；7호 해양경찰청장 및 지방해양경찰청장 군 지휘관：8호 군단장급 이상의 군 지휘관；9호 지역군사령관 및 함대사령관 제10호의 추가 선정 및 지방회의 준비 관계는 D04에서 확인한다. 세 묶음은 학습용 편집 구분이며 법정 분류는 호 번호를 따른다.</desc>
