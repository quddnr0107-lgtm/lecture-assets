<text x="104" y="1095" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">통지·공고</text>
<text x="104" y="1157" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">관계 지자체장에게 서면통지, 게시판 공고 및</text>
<text x="104" y="1218" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">신문·방송 보도</text>
