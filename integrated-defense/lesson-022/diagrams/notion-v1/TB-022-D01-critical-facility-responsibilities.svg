<text x="84" y="970" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">지정은 국방부장관 / 자체방호는 관리자 / 지원은 경찰·군 / 평시 감독은 관계기관·국정원</text>
