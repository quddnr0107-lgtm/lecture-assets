<text x="607.3333333333333" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">관리자에게 책임이 있으며</text>
<text x="607.3333333333333" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">소유자도 관리자에 포함</text>
<text x="607.3333333333333" y="628" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">자체방호계획</text>
<text x="607.3333333333333" y="676" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">통합방위사태에 대비하여 수립 /</text>
<text x="607.3333333333333" y="718" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">계획 수립에 필요시 협조 요청 가능</text>
