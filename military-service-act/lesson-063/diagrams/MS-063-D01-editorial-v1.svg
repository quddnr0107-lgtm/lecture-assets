<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전담의사 신분 박탈의 구분</title><desc id="desc">박탈하여야 한다: 면허·자격 의사·치과의사 면허 취소 또는 자격 정지.; 교육명령 불응 정당한 사유 없이 임용 후 직무교육소집명령에 불응.; 통틀어 8일 이상 정당한 사유 없이 직장 이탈 또는 해당 업무에 미복무. / 박탈할 수 있다: 기소·업무상 부정 형사사건 기소로 신분 유지 부적당 또는 신체검사업무 관련 부정행위.; 장애·행방불명 장애로 1년 이내 또는 생사·행방불명 후 3개월 이내 복귀할 수 없거나 직무를 감당할 수 없는 경우.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
