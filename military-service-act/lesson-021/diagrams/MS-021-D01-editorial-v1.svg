<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">입영판정검사의 대상과 내용</title><desc id="desc">검사 대상: 통지서를 받은 사람 현역병입영 또는 군사교육소집 통지서를 교부받은 사람; 제외 대상 법 제55조제1항 단서 또는 제2항의 군사교육소집 대상자는 제외; 검사 의무 통지받은 사람은 지방병무청장이 지정한 일시·장소에서 검사받아야 함 / 세 가지 검사: 신체검사 신체검사 실시; 심리검사 심리검사 실시; 마약류 검사 마약류의 투약·흡연·섭취 여부에 관한 검사 실시</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-021</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 04</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">입영판정검사의 대상과 내용</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지방병무청장이 입영 전에 검사하고 통지</text>
