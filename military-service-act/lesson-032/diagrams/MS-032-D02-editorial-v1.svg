<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">상근예비역 입영계획 기한</title><desc id="desc">각 군 참모총장: 9월 30일까지 다음 해 충원 계획서를 병무청장과 입영·소집부대의 장에게 송부; 변경은 75일 전 입영일 75일 전까지 변경 계획서 송부; 정원조정 정원조정이 필요하면 국방부장관 승인 필요 / 배분·지역별 통보: 병무청장 입영 계획서를 지체 없이 각 군 참모총장·지방병무청장에게 송부. 변경은 입영일 60일 전까지; 소집부대의 장 지역별 필요인원을 10월 31일까지 지방병무청장에게 통보. 변경은 입영일 60일 전까지</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
