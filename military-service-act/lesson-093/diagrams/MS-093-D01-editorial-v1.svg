<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">학생군사교육과 학군 과정</title><desc id="desc">일반군사교육: 실시할 수 있음 고등학교 이상의 학교 학생에게 대통령령에 따라 일반군사교육을 할 수 있다.; 복무기간 단축 교육을 받은 사람의 현역병 또는 사회복무요원 복무기간을 단축할 수 있다. / 학군 후보생 과정: 사관·부사관후보생 고등학교 이상 학교에 과정을 둘 수 있고, 수료자는 현역 장교·부사관 병적에 편입할 수 있다.; 지원자 신체검사 군병원 또는 각 군 참모총장이 지정하는 병원에서 신체검사를 받아야 한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-093</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">학생군사교육과 학군 과정</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">고등학교 이상 학교 학생에 대한 제도</text>
