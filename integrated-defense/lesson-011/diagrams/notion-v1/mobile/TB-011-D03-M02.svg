<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-011-D03 · 취재지역별 허용과 제한</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 11강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">취재지역별 허용과 제한</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제19조제2항~제4항 | 명단·표지, 허용지역</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">안, 허용지역 밖</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">허용지역 밖 (계속)</text>
<path d="M80 433L449.703125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">대표자 한정</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">선정된 1명 또는 여러 명의 대표자에게만 승인할 수</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">있음</text>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 729L314.21875 729" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="783" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">허용지역 밖 취재는 승인과 안내가 필요하며, 승인</text>
<text x="80" y="844" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">대상을 대표자로 한정할 수 있다.</text>
<text x="80" y="931" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 941L285.046875 941" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1015" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">허용지역 안의 취재 보장에도 작전 지장 시 제한</text>
<text x="80" y="1076" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">가능이라는 예외가 있다.</text>
<text x="80" y="1157" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대표자 수를 1명으로만 고정하지 않는다.</text>
<text x="80" y="1238" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">세 섹션은 상황별 기준이며, 허용지역 밖으로 반드시</text>
<text x="80" y="1299" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">이동하는 순서가 아니다.</text>
<text x="80" y="1386" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1396L270.0625 1396" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1470" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제19조제2항~제4항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제10조 · TB-011-D03 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
