<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">중대의 편성 단위와 구성</title><desc id="desc">DR-009 · 조직·편성 훈령 제9조. 읍·면·동을 기준으로 다섯 갈래의 본부·소대를 둔다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-009</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">조직·편성·운영</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">중대의 편성 단위와 구성</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">읍·면·동을 기준으로 다섯 갈래의 본부·소대를 둔다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="1002" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">편성 단위</text>
<path d="M81 385 C153.185 391 212.43 381 269.25 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제2항제1호·제2호</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">원칙</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">읍·면·동 단위, 예비군자원·작전지역</text>
<text x="144" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">여건에 따라 분리·통합</text>
<text x="144" y="673.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">도서지역</text>
<text x="144" y="715.8" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">예비군자원·선박운항·연륙(도)교·작전여건</text>
<text x="144" y="765.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="400" fill="#25241F" text-anchor="start">고려, 내륙·인접도서 중대와 통합 가능</text>
<text x="144" y="860.6" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">도서 예외</text>
<text x="144" y="902.6" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">제주도는 도서지역 제외, 접적도서는 지역</text>
<text x="144" y="952.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">특수성 고려 독립 분·소대 가능</text>
<path d="M116 459 C96 459 92 466 92 485 L92 962 C92 985 102 994 117 994" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">중대 내부 구성</text>
<path d="M844 341 C866 311 1077.38 307 1131.38 331 C1152.38 346 1138.38 381 1109.38 393 C987.688 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제2항제3호</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">본부</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">5~6년차 특기 소지자로 2교대 근무 가능하게</text>
<text x="860" y="578.7" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">편성</text>
<text x="860" y="723.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">동원·지역</text>
<text x="860" y="765.5" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">동원예비군소대 및 지역예비군소대</text>
<text x="860" y="910.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">보류·기타</text>
<text x="860" y="952.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="35" font-weight="700" fill="#25241F" text-anchor="start">보류자소대 및 기타소대</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제9조 · DR-009-D02</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
