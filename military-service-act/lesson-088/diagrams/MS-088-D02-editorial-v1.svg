<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병력동원훈련의 재소집 사유</title><desc id="desc">복무 중 구속: 범죄로 인한 구속 병력동원훈련소집으로 입영한 사람이 복무 중 범죄로 인하여 구속된 경우.; 재소집 가능 법정 사유에 해당하면 재소집할 수 있다. / 훈련 미이수: 정당한 사유 없이 정당한 사유 없이 훈련을 받지 못한 경우에 적용한다.; 미이수 일수 기준 복무기간의 3분의 1 이상의 일수를 초과하여 훈련을 받지 못한 경우 재소집할 수 있다.</desc>
