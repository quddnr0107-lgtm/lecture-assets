<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병무행정 협조의 요청과 의무</title><desc id="desc">병무행정관서의 장: 요청 요건 직무를 수행할 때 필요하면 병무행정 협조를 요청할 수 있음; 대상기관 국가기관·지자체의 장 또는 정보처리·통신시설을 보유한 기관의 장 / 요청받은 기관의 장: 협조 의무 병무행정 협조 요청에 협조하여야 함; 거부 제한 정당한 사유 없이 거부하지 못함</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
