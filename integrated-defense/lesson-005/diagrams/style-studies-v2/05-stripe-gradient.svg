 <linearGradient id="stripe-panel" x1="0%" y1="0%" x2="100%" y2="0%"><stop stop-color="#1C3760"/><stop offset="1" stop-color="#241F52"/></linearGradient>
 <linearGradient id="stripe-band" x1="0%" y1="0%" x2="100%" y2="0%"><stop stop-color="#52DEDE"/><stop offset=".6" stop-color="#635BFF"/><stop offset="1" stop-color="#C66BE5"/></linearGradient>
 </defs>
