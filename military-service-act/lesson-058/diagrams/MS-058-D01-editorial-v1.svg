<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">예술·체육요원 신상변동 통보</title><desc id="desc">해당 분야 미복무: 통보 주체·상대 문화체육관광부장관 → 병무청장; 14일 이내 해당 분야에 복무하지 않은 사유가 발생한 날부터 14일 이내 그 사실을 통보한다. / 편입취소 사유 발생: 통보 주체·상대 문화체육관광부장관 → 지방병무청장; 지체 없이 법 제33조의10제4항 각 호의 사유가 발생하면 지체 없이 통보한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
