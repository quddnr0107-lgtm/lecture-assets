<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전담의사의 복무기간 연장</title><desc id="desc">허용되지 않는 업무: 다른 업무 금지 부여받은 신체검사업무 등 외의 업무에 종사해서는 안 된다.; 종사일수의 5배 위반하여 다른 업무에 종사한 경우 병무청장이 그 일수의 5배 연장근무를 명할 수 있다. / 직무 외 질병·부상: 1개월 이상 미근무 직무 외 사유로 1개월 이상 근무하지 못하면 그 기간에 상응하는 기간을 연장할 수 있다.; 신분 박탈 예외 법 제34조의3제4호의 사유로 신분이 박탈된 경우에는 위 연장을 적용하지 않는다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-064</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">전담의사의 복무기간 연장</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">위반 내용과 병무청장의 조치</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="800" y1="334" x2="800" y2="1006" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">허용되지 않는 업무</text>
<path d="M80 386 C177.6 393 330.9 380 440.5 386" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105 429 C91 429 89 439 89 453 L89 865.0 C89 882.0 95 888.0 107 888.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="752" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의4①</text>
<text x="128" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">다른 업무 금지</text>
<text x="128" y="509" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">부여받은 신체검사업무 등 외의</text>
<text x="128" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">업무에 종사해서는 안 된다.</text>
<text x="752" y="707" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의4②</text>
<text x="128" y="707" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">종사일수의 5배</text>
<text x="128" y="765" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">위반하여 다른 업무에 종사한 경우</text>
<text x="128" y="820" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">병무청장이 그 일수의 5배 연장근무를</text>
<text x="128" y="875" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">명할 수 있다.</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">직무 외 질병·부상</text>
<path d="M825 342 C873.4 315 1113.9 314 1192.1 338 C1218.1 362 1186.1 390 1090.5 397 C920.2 408 812 385 822 357 Z" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M865 429 C851 429 849 439 849 453 L849 920.0 C849 937.0 855 943.0 867 943.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1512" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의4③</text>
<text x="888" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">1개월 이상 미근무</text>
<text x="888" y="509" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">직무 외 사유로 1개월 이상 근무하지</text>
<text x="888" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">못하면 그 기간에 상응하는 기간을</text>
<text x="888" y="619" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">연장할 수 있다.</text>
<text x="1512" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제34조의4③ 단서</text>
<text x="888" y="762" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">신분 박탈 예외</text>
<text x="888" y="820" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">법 제34조의3제4호의 사유로 신분이</text>
<text x="888" y="875" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">박탈된 경우에는 위 연장을 적용하지</text>
<text x="888" y="930" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">않는다.</text>
<line x1="80" y1="1052" x2="1520" y2="1052" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 제34조의4 · MS-064 · 핵심 구조</text>
<text x="1520" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
