<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">건강보험료 지원 대상과 기간</title><desc id="desc">가입자별 범위: 직장가입자 휴직 등으로 보수 전부·일부가 지급되지 않는 가입자의 보수월액보험료; 지역가입자 해당 요원의 지역가입자 월별 보험료 / 기간·지급: 기본 지원기간 소집된 날부터 해제되는 날까지 지원할 수 있음; 지급 방식 매월 지급. 납입고지 유예 등 정해진 사유는 일시금 지급 가능</desc>
