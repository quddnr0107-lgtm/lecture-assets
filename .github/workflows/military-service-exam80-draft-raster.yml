name: Military service exam80 draft raster
on:
  push:
    branches: [main]
    paths:
      - 'military-service-act/production-evidence/exam80-generation-2/draft-batches/render-request-20261127.json'
permissions:
  contents: write
concurrency:
  group: military-service-exam80-draft-raster
  cancel-in-progress: false
jobs:
  raster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape fonts-noto-cjk
          python -m pip install Pillow
      - name: Render pinned draft assets
        run: python military-service-act/tools/render_exam80_draft_raster.py
      - name: Publish draft rasters only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'military-service-act/production-evidence/exam80-generation-2/draft-batches/20261127-01' 'military-service-act/production-evidence/exam80-generation-2/draft-batches/20261127-02' 'military-service-act/production-evidence/exam80-generation-2/draft-batches/render-receipt-20261127.json'
          git diff --cached --quiet && exit 0
          git commit -m 'Render exam80 military service draft WebP assets'
          git fetch origin main
          git rebase origin/main
          python military-service-act/tools/render_exam80_draft_raster.py --validate-only
          git push origin HEAD:main
