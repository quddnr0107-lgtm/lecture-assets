<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-024-D01 · 문책요구와 조치 결과 통보</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 24강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">문책요구와 조치 결과 통보</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">본부장의 조사·심의·결정과 소속기관 또는 직장의</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">조치를 구분</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">① 요건 확인·조사</text>
<path d="M80 433L445.6875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 649" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">대상자</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위 업무 담당 공무원 또는 통합방위작전·훈련</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">참여자</text>
<path d="M80 680L80 855" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="715" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">직무 태만 결과</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가안전보장이나 통합방위 업무에 중대한 지장을</text>
<text x="104" y="838" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">초래</text>
<path d="M80 886L80 1061" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="921" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">본부장 조사</text>
<text x="104" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">소속 공무원에게 조사하게 할 수 있음. 필요시</text>
<text x="104" y="1044" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">합동조사·자료 요청 가능</text>
<text x="80" y="1131" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">② 심의·결정·통보</text>
<path d="M80 1141L460.671875 1141" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1182L80 1357" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1217" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">실무위원회</text>
<text x="104" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">조사 결과 등을 보고받은 후 통합방위 실무위원회</text>
<text x="104" y="1340" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">심의</text>
<path d="M80 1388L80 1502" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">본부장 결정</text>
<text x="104" y="1485" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해당자에 대한 문책요구 여부 결정</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제23조 · TB-024-D01 · 1/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
