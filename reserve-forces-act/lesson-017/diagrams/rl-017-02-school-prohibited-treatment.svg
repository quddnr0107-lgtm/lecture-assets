<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">결석 처리와 불리한 처우 금지</title>
<desc id="desc">RL-017 예비군법 제10조의2, 예비군 동원 또는 훈련 관련 학업 보장. 법 제10조의2 · 두 행위를 각각 금지</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F4F4" stroke="none"/>
<rect x="64" y="38" width="7" height="29" rx="3" fill="#275AA3" stroke="none"/>
<text x="87" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#275AA3" text-anchor="start">제80회  ·  예비군법</text>
<text x="1536" y="63" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#545860" text-anchor="end">주체·기준 비교</text>
<text x="64" y="142" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="52" font-weight="700" fill="#202124" text-anchor="start">결석 처리와 불리한 처우 금지</text>
<text x="67" y="190" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#545860" text-anchor="start">법 제10조의2 · 두 행위를 각각 금지</text>
<rect x="64" y="248" width="720" height="492" rx="18" fill="#FFFFFF" stroke="none"/>
<rect x="64" y="248" width="720" height="83" rx="18" fill="#EAF0F8" stroke="none"/>
<rect x="64" y="309" width="720" height="22" rx="0" fill="#EAF0F8" stroke="none"/>
<text x="106" y="303" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#275AA3" text-anchor="start">학업 보장</text>
<text x="106" y="389" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#275AA3" text-anchor="start">결석 처리 금지</text>
<text x="106" y="435" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">동원·훈련 기간을 결석으로 처리하지 못함</text>
