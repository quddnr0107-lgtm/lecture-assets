<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">재해보상과 휴업보상의 구분</title><desc id="desc">사회·대체복무: 재해보상금 복무 중 순직·공상·공무상 질병에 사망보상금 또는 장애보상금 지급; 비용 부담 복무기관이 속한 국가·지방자치단체·공공단체가 부담; 중복 지급 조정 다른 법령에 따라 국가·지자체·공공단체가 부담한 같은 종류 보상금 상당액 공제 / 병력동원소집등: 재해보상금 임무·훈련 중 부상 또는 사망한 사람에게 지급; 휴업보상금 치료로 생업에 종사하지 못한 기간 지급. 예비군법 제8조의2 준용; 중복 지급 조정 다른 법률에 따라 국가·지자체가 부담한 같은 종류 보상금 상당액 공제</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-120</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">재해보상과 휴업보상의 구분</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">대상·비용 부담·중복 지급 조정</text>
