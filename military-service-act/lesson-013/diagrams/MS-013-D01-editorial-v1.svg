<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역판정검사의 시기</title><desc id="desc">검사받는 해: 원칙 19세 지방병무청장이 지정한 일시·장소에서 검사받아야 함; 일부는 20세 군 필요인원·병역자원 수급 상황 등을 고려하여 일부는 20세에 검사하게 할 수 있음; 미수검·연기 종료 받지 않은 사람과 연기사유가 소멸된 사람은 그 해 또는 다음 해에 검사 / 검사받은 것으로 간주: 현역병지원 검사 병역판정검사 미수검자가 병무청장의 현역병지원 신체검사를 받은 경우; 18세의 제한 18세는 신체등급 5급이나 6급으로 판정된 경우에만 해당</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-013</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병역판정검사의 시기</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">19세 원칙과 예외·검사 간주의 범위</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="800" y1="334" x2="800" y2="1006" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">검사받는 해</text>
<path d="M80 386 C140.1 393 234.6 380 306.7 386" fill="none" stroke="#25241F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105 429 C91 429 89 439 89 453 L89 965.0 C89 982.0 95 988.0 107 988.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="752" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제11조①</text>
<text x="128" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">원칙 19세</text>
<text x="128" y="507" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">지방병무청장이 지정한 일시·장소에서</text>
<text x="128" y="560" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">검사받아야 함</text>
<text x="752" y="632.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제11조①</text>
<text x="128" y="632.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">일부는 20세</text>
<text x="128" y="688.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">군 필요인원·병역자원 수급 상황 등을</text>
<text x="128" y="741.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">고려하여 일부는 20세에 검사하게 할 수</text>
<text x="128" y="794.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">있음</text>
<text x="752" y="866.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제11조②</text>
<text x="128" y="866.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">미수검·연기 종료</text>
<text x="128" y="922.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">받지 않은 사람과 연기사유가 소멸된</text>
<text x="128" y="975.0" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">사람은 그 해 또는 다음 해에 검사</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">검사받은 것으로 간주</text>
<path d="M825 342 C878.9 315 1159.0 314 1247.0 338 C1273.0 362 1241.0 390 1131.7 397 C933.4 408 812 385 822 357 Z" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M865 429 C851 429 849 439 849 453 L849 802.0 C849 819.0 855 825.0 867 825.0" fill="none" stroke="#25241F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1512" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제11조⑥</text>
<text x="888" y="451" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">현역병지원 검사</text>
<text x="888" y="507" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">병역판정검사 미수검자가 병무청장의</text>
<text x="888" y="560" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">현역병지원 신체검사를 받은 경우</text>
<text x="1512" y="703" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제11조⑥</text>
<text x="888" y="703" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">18세의 제한</text>
<text x="888" y="759" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">18세는 신체등급 5급이나 6급으로</text>
<text x="888" y="812" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">판정된 경우에만 해당</text>
<line x1="80" y1="1052" x2="1520" y2="1052" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 제11조 · MS-013 · 핵심 구조</text>
<text x="1520" y="1092" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
