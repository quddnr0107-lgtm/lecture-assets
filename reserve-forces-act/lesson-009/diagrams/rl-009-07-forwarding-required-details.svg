<text x="858" y="601" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="32" font-weight="400" fill="#202124" text-anchor="start">앞의 네 방법에 준하는 방법으로 주요 사항 전달</text>
