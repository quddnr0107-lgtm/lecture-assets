<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">운영계획과 실태조사의 주체</title><desc id="desc">매년 운영계획: 관계 중앙행정기관장 전문연구·산업기능요원 제도의 체계적 운영을 위해 매년 운영계획을 수립·시행하여야 한다.; 대상 제도 전문연구요원 및 산업기능요원 제도. / 실태조사 권한: 지방병무청장 등 사회복무·예술체육·전문연구·산업기능요원 복무기관·업체 등의 복무·관리를 조사할 수 있다.; 병무청장 합동 조사 관계 중앙행정기관장과 합동으로 공중보건의사·공익법무관·공중방역수의사·대체복무요원을 조사할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-079</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">운영계획과 실태조사의 주체</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">수립 의무와 조사 권한을 구분</text>
