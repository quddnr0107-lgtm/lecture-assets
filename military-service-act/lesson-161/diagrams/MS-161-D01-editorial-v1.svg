<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">고용금지·복학·복직보장 위반</title><desc id="desc">채용·복학·복직: 고용금지 위반 고용주가 제76조제1항·제5항 대상자를 채용하거나 해직하지 않음; 복학·복직 거부 학교장·고용주가 정당한 사유 없이 복학 또는 복직 거부; 같은 법정형 6개월 이하 징역 또는 200만원 이상 2천만원 이하 벌금 / 근무기간·불리한 처우: 고용주의 위반 정당한 사유 없이 의무복무기간 미산정 또는 병역이행을 이유로 불리한 처우; 법정형 300만원 이상 3천만원 이하의 벌금</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
