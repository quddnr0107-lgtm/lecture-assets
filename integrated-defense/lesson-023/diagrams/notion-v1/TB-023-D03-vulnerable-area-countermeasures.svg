<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-023-D03 · 취약지역 대비책과 출입제한</title><desc id="desc">시·도지사의 대비책 마련과 지역군사령관의 차단·출입제한 권한 시·도지사: 대비책：선정 경로 공통 시·도지사·본부장 중 누가 선정했든 시·도지사가 대비책 마련；시·도 조례 대통령령의 기준에 따라 필요한 사항을 시·도 조례로 정함；일반 대비 도로계획·통신망·주민신고망·계몽홍보·신고훈련·의료봉사 지형별 대비：탁 트인 곳 10년생 이상 입목·모래벙커·연못·이동식 장애물·구조물 중 하나 설치；장애물 규격 통합방위본부장이 정함 / 운용상 필요시 지역군사령관과 협의 가능；호수 자체 수상 순찰활동 등 대비책 시행 지역군사령관: 차단·제한：해안·강안 취약지역 중 방호 활동이 필요하다고 인정되는 해안·강안에 차단시설 설치；사전 통보·표지 미리 시·도지사에게 통보 / 차단시설에 300m 이내 간격으로 표지 부착；출입 확인 민간인의 인적사항·출입목적·출입지역 확인 후 출입제한 조치 가능 이동식 장애물 예: 바리케이드·철침·높이 1.5m 이상 와이어로프·효과 있는 차량.</desc>
