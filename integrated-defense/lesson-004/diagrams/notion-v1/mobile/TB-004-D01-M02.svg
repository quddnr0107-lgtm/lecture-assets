<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-004-D01 · 중앙협의회, 구성과 회의 운영</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 04강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">중앙협의회, 구성과 회의 운영</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국무총리 소속 · 국무총리 의장 · 본부 부본부장 간사</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">소집과 의결 기준</text>
<path d="M80 372L415.96875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">소집</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의장이 필요하다고 인정할 때</text>
<path d="M80 558L80 672" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">일반 의결</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">재적위원 과반 출석 + 출석위원 과반 찬성</text>
<path d="M80 703L80 817" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="738" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">선포·해제 심의</text>
<text x="104" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">재적위원 과반 출석 + 출석위원 3분의 2 이상 찬성</text>
<text x="80" y="887" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 897L314.21875 897" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="951" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">일반 안건과 통합방위사태 선포·해제는 찬성</text>
<text x="80" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">정족수가 다르다.</text>
<text x="80" y="1099" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1109L285.046875 1109" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1183" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">일반 의결은 시행령에 특별한 규정이 없는 경우</text>
<text x="80" y="1244" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적용한다(시행령 제7조제2항).</text>
<text x="80" y="1325" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사태 선포·해제의 특별 정족수는 법</text>
<text x="80" y="1386" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제12조제3항·제5항, 제14조제1항·제4항에 대한</text>
<text x="80" y="1447" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제24조제1항의 기준이다.</text>
<text x="80" y="1528" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법정 위원의 전체 기관명은 조문에서 확인하며, 이</text>
<text x="80" y="1589" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">도식은 구성 방식과 역할을 요약한다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제4조 · TB-004-D01 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
