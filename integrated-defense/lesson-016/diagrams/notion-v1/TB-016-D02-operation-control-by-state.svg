<text x="84" y="908" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">병종 경찰관할지역은 민방위대 자원과 위임받은 군 작전요소, 병종 군지역·해역은 관할 안 모든 요소이다.</text>
<text x="84" y="964" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">군·특정경비는 군관할지역 및 특정경비지역, 특정·일반해역은 특정경비해역 및 일반경비해역을 뜻한다. 군 작전지원은 경찰의 요청과 군사령관의 지원</text>
<text x="84" y="995" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">가능 규정이며, 요청을 즉시 지휘권 이전으로 해석하지 않는다. 경계태세 1급의 함대사령관 통제 대상은 해양경찰이지만, 병종사태의 해역 통제 대상은</text>
<text x="84" y="1026" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">모든 국가방위요소이다.</text>
