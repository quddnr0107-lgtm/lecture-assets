<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병력동원훈련소집의 주체</title><desc id="desc">일반 대상자: 지방병무청장 병력동원소집 대상자로 지정된 사람에 대하여 병력동원훈련소집을 한다.; 지정 일시·장소 소집 통지서를 받은 사람은 지정된 일시·장소에 입영하여야 한다. / 상비예비군·사전 통지: 입영부대의 장 상비예비군은 입영부대의 장이 병력동원훈련소집을 한다.; 병무청장 필요하면 지방병무청장에게 통지서를 미리 송달하게 할 수 있다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-086</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 02</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병력동원훈련소집의 주체</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">일반 대상자와 상비예비군을 구분</text>
