<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-002-D01 · 국가방위요소는 7개 법정 항목</title><desc id="desc">통합방위작전에 필요한 방위전력 또는 지원 요소의 구성 군·경·소방：국군 「국군조직법」 제2조에 따른 국군；경찰기관 경찰청·해양경찰청 및 그 소속 기관과 제주특별법상 자치경찰기구；소방대 「소방기본법」 제2조제5호에 따른 소방대 국가기관·지방자치단체：국가기관·지자체 국가기관 및 지방자치단체. 앞의 국군·경찰기관·소방대에 해당하는 경우 제외 예비군·민방위대·직장：예비군 「예비군법」 제3조에 따른 예비군；민방위대 「민방위기본법」 제17조에 따른 민방위대；해당 직장 법 제6조에 따라 통합방위협의회를 두는 직장 세 묶음은 학습을 위한 편집상 구분이며 법의 별도 분류가 아니다. 구성 관계를 나타내며 조직 간 지휘·보고 관계를 뜻하지 않는다.</desc>
