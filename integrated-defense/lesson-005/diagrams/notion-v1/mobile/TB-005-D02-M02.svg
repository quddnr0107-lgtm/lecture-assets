<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-005-D02 · 지역협의회와 지역실무위원회</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 05강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">지역협의회와 지역실무위원회</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역별 의장, 조례, 회의 운영을 구분</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지역협의회 회의 (계속)</text>
<path d="M80 372L538.015625 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">선포·해제 심의</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도: 재적위원 과반 출석 + 출석위원 3분의 2 이상</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">찬성</text>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">지역실무위원회</text>
<path d="M80 668L389.09375 668" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 709L80 884" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="744" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">담당 업무</text>
<text x="104" y="806" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">안건 사전 심의, 의장 위임사항 심의, 관계 행정기관</text>
<text x="104" y="867" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">간 업무 협조·조정</text>
<path d="M80 915L80 1090" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="950" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">소집·운영</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">분기 1회 이상 원칙. 구성·운영은 협의회 심의를</text>
<text x="104" y="1073" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">거쳐 의장이 정함</text>
<text x="80" y="1160" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1170L314.21875 1170" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1224" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">협의회는 분기 1회, 지역실무위원회는 분기 1회 이상</text>
<text x="80" y="1285" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">소집이 원칙이다.</text>
<text x="80" y="1372" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1382L285.046875 1382" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1456" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지방 통합방위회의의 연 1회 이상 개최 규정과</text>
<text x="80" y="1517" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">구분한다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제5조 · TB-005-D02 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
