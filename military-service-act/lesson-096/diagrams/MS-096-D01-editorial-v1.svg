<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">검사 연기와 징집·소집 연기</title><desc id="desc">병역판정검사 등: 국외 선원·체재자 국외 왕래 선박의 선원, 국외 체재 또는 거주자.; 구속·형 집행 범죄로 구속되거나 형의 집행 중인 사람. / 검사 후 징집·소집: 학생·연수생 고등학교 이상 학교 학생 또는 연수기관의 정해진 과정 이수 중인 사람.; 우수자 및 공통 대상 국위선양 체육·대중문화예술 우수자 및 제1항의 국외 선원·체재자·구속·형 집행 중인 사람.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-096</text>
