<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역 신고·출원의 방법</title><desc id="desc">신고·출원 방식: 원칙 문서로 하여야 하며 전자문서도 포함; 예외 병무청장이 정하는 경우 정보통신망·구술·전화·전신·팩스 이용 가능 / 대리 신고·출원: 허용 요건 질병이나 그 밖의 부득이한 사유로 본인이 직접 할 수 없는 경우; 대리인 범위 법정대리인, 세대주, 가족 중 성년자</desc>
