<text x="888" y="721" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">새 복무 업체의 장에게 송부</text>
<text x="80" y="990" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#25241F" text-anchor="start">제69호 관리현황서: 분기 말일 기준 → 다음 달 15일까지 병무청장 보고</text>
