<text x="1102.6666666666665" y="534" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">특별한 사유가 없으면 징계 등</text>
<text x="1102.6666666666665" y="576" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">적절한 조치를 하여야 함</text>
<text x="1102.6666666666665" y="673" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">결과 통보</text>
<text x="1102.6666666666665" y="721" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">조치 결과를 통합방위본부장에게</text>
<text x="1102.6666666666665" y="763" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">통보하여야 함</text>
