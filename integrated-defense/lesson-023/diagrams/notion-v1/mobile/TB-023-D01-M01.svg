<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-023-D01 · 취약지역 대상과 지형 수치</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 23강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">취약지역 대상과 지형 수치</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법률의 선정 대상에 시행령의 지형 기준을 함께 적용</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">선정 대상 4유형</text>
<path d="M80 372L397.578125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">오지·벽지</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">교통·통신시설 낙후로 즉각적인 통합방위작전이</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">어려운 지역</text>
<path d="M80 619L80 794" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">침투·은거 지역</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">간첩·무장공비 침투 사실이 있거나 숨어 활동하기</text>
<text x="104" y="777" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">쉬운 지역</text>
<path d="M80 825L80 939" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="860" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">탁 트인 곳·호수</text>
<text x="104" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적의 저공 침투 또는 저속 항공기 착륙이 쉬운 지역</text>
<path d="M80 970L80 1145" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1005" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">해역·해안·섬</text>
<text x="104" y="1067" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령이 추가한, 적의 침투 또는 은거 활동이 쉬운</text>
<text x="104" y="1128" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지역</text>
<text x="80" y="1215" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">탁 트인 곳·호수의 공통 규모</text>
<path d="M80 1225L647.890625 1225" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1266L80 1380" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1301" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">폭 30m 이상</text>
<text x="104" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">폭이 30미터 이상</text>
<path d="M80 1411L80 1525" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1446" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">길이 250m 이상</text>
<text x="104" y="1508" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">길이 방향 앞뒤에 장애물이 없으면 200미터 이상</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제22조 · TB-023-D01 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
