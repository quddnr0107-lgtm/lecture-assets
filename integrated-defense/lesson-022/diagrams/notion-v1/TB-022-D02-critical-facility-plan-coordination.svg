<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-022-D02 · 자체방호와 지원계획의 결합</title><desc id="desc">관리자·경찰·군은 계획을 세우고 역할을 나누며 작성·변경 사실을 공유 관리자: 자체방호：통합 자원 청원경찰·특수경비원·직장예비군·직장민방위대 등과 장애물·감시장비；교육·훈련 관리자·특수경비업자 책임의 직무교육 및 개인화기 실제 사격훈련 포함；상황·통신 자체방호를 위한 통합상황실과 지휘·통신망 구성 경찰·군: 방호지원：통합 요소 군·경찰·예비군·민방위대 등 국가방위요소 통합；경찰 계획 경찰서 단위의 방호지원계획 수립·시행；군 계획 대대 단위의 방호지원계획 수립·시행 세 주체의 상호협력：협정 당사자 관리자 + 대대 단위 지역책임 부대장 + 경찰서장；역할분담 협정 국가중요시설 방호를 위한 역할분담 등에 관한 협정 체결；작성·변경 통보 자체방호계획·방호지원계획의 작성 또는 변경 사실을 서로 통보 각 계획의 수립·시행과 대비책 마련은 시행령상 의무다.</desc>
