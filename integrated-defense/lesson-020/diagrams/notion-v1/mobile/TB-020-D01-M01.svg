<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-020-D01 · 발견한 누구든지, 지체 없이 신고</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 20강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">발견한 누구든지, 지체 없이 신고</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적의 침투·출현뿐 아니라 그 흔적의 발견도 신고 대상</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">① 발견</text>
<path d="M80 372L227.203125 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 527" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">발견한 사람</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">누구든지 신고 의무를 부담</text>
<path d="M80 558L80 672" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="593" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">발견 대상</text>
<text x="104" y="655" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">적의 침투 또는 출현이나 그러한 흔적</text>
<text x="80" y="742" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">② 지체 없이 신고</text>
<path d="M80 752L430.703125 752" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 793L80 907" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="828" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">신고 내용</text>
<text x="104" y="890" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">발견한 사실을 신고</text>
<path d="M80 938L80 1052" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="973" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">신고 시점</text>
<text x="104" y="1035" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지체 없이 신고하여야 함</text>
<text x="80" y="1122" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">③ 둘 중 한 기관</text>
<path d="M80 1132L399.984375 1132" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1173L80 1287" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1208" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">군부대</text>
<text x="104" y="1270" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군부대에 신고</text>
<path d="M80 1318L80 1432" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1353" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">행정기관</text>
<text x="104" y="1415" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">또는 행정기관에 신고</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제19조 · TB-020-D01 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
