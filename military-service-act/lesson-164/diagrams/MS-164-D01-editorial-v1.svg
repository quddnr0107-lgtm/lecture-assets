<text x="888" y="477" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="54" font-weight="700" fill="#25241F" text-anchor="start">500만원 이하</text>
<text x="888" y="533" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">법정 괴롭힘 조치 위반, 정당한 사유</text>
<text x="888" y="586" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">없는 병적관리 자료 거부·변동통보</text>
<text x="888" y="639" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">미이행</text>
<text x="1512" y="808" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="end">법 제95조④</text>
<text x="888" y="808" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="54" font-weight="700" fill="#25241F" text-anchor="start">300만원 이하</text>
<text x="888" y="864" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">고용주가 정당한 사유 없이</text>
<text x="888" y="917" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">제81조제3항 자료제출 요구·질문에</text>
<text x="888" y="970" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="38" font-weight="400" fill="#25241F" text-anchor="start">불응</text>
