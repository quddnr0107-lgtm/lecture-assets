<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">입영기피의 세 가지 요건</title><desc id="desc">통지서를 받음: 모집 통지서 포함 현역입영 또는 소집 통지서를 받은 사람. 모집에 의한 입영 통지서도 포함. / 정당한 사유 없음: 처벌의 조건 정당한 사유 없이 입영하지 않거나 소집에 응하지 않은 경우. / 정해진 기간 경과: 입영일·소집일부터 현역입영·사회복무·대체복무·군사교육 3일, 병력동원소집·전시근로소집 2일.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-149</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   03 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">입영기피의 세 가지 요건</text>
