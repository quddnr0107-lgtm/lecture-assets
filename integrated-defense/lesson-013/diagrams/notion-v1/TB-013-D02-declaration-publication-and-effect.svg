<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-013-D02 · 선포의 정족수·공고·효력</title><desc id="desc">법 제12조제6항~제8항 · 시행령 제24조 | 선포 결정의 기준과 선포 후 조치 협의회 의결정족수：출석 기준 재적 위원 과반수 출석；찬성 기준 출석 위원 3분의 2 이상 찬성 선포 후 조치·효력：시도지사 보고 지체 없이 행안부장관 및 국방부장관과 국무총리를 거쳐 대통령 보고；통지·공고 관계 지자체장에게 서면통지, 게시판 공고 및 신문·방송 보도；대통령 선포 같은 지역에 대통령이 선포하면 그때부터 시도지사 선포 효력 상실 공고에 담을 5가지：이유·종류 통합방위사태의 선포 이유와 종류；일시·구역 통합방위사태의 선포 일시와 구역；작전지휘관 통합방위작전의 지휘관 의결정족수는 중앙협의회와 시도협의회가 사태 선포 또는 해제를 심의·의결할 때 적용한다. 국무회의에 이 협의회 정족수를 그대로 적용하지 않는다. 게시판 공고 대상은 해당 지역 시·군·자치구·읍·면·동이다. 시도지사의 보고 경로에 있는 행정안전부장관과 국방부장관은 둘 다 포함한다. 의회의 해제 요구에 따른 심의 예외는 법 제14조를 따르며 TB015에서 다룬다.</desc>
