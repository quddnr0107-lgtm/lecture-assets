<text x="112" y="524" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">확립 시책을 마련</text>
<text x="112" y="604.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">지방자치단체장</text>
<text x="112" y="652.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">관할구역별 통합방위태세 확립</text>
<text x="112" y="694.5" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시책을 마련</text>
<text x="112" y="775.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">행정·군부대장</text>
<text x="112" y="823.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">각급 행정기관 및 군부대의 장은</text>
<text x="112" y="865.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">작전 수행을 위해 서로 지원·협조</text>
