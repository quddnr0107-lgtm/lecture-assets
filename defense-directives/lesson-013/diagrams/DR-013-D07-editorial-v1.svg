<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">대대</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">401~1,600명</text>
<text x="860" y="683.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">연대</text>
<text x="860" y="725.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">1,601~7,200명</text>
<text x="860" y="879.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">여단</text>
<text x="860" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">7,201명 이상</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">직장예비군 제대 목록에는 지역대가 없다. 통합부대 규모는 자원 수 또는 통합 직장의 제대 수를 고려한다.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">조직·편성 훈령 제13조 · DR-013-D07</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
