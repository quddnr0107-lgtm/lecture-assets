<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">팩스</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">수령증을 팩스로 회신할 수 있게 함</text>
<text x="860" y="683.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">이메일</text>
<text x="860" y="725.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">본인 동의, 전화·문자·SNS 추가 홍보</text>
<text x="860" y="879.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">기록</text>
<text x="860" y="921.88" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="700" fill="#25241F" text-anchor="start">수신동의 결과 유지</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">고발 연계 3차는 모바일 전자고지·등기·방문 등 입증 가능한 수단.</text>
