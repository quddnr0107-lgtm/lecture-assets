<text x="144" y="935.24" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="36" font-weight="400" fill="#25241F" text-anchor="start">추가훈련을 계획한 부대에 소집되면 Ⅰ형 실시</text>
