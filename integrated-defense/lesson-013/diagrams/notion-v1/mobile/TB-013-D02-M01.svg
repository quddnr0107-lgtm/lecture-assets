<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">출석 위원 3분의 2 이상 찬성</text>
<text x="80" y="803" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">선포 후 조치·효력</text>
<path d="M80 813L444.390625 813" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 854L80 1029" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="889" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">시도지사 보고</text>
<text x="104" y="951" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지체 없이 행안부장관 및 국방부장관과 국무총리를</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">거쳐 대통령 보고</text>
