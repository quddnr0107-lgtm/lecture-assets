<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">입영판정검사의 시기·연기</title><desc id="desc">검사 시기·제외: 입영 전 30일 입영일 30일 전부터 입영일 전일까지 실시; 6개월 미경과 병역판정·재병역판정·입영판정검사 또는 현역병지원 신체검사를 받은 날부터 6개월 미경과자는 제외; 본인이 원하면 최근 검사에 따른 제외자가 입영판정검사를 원하면 실시할 수 있음 / 검사 연기: 연기 조건 시행령 제129조제1항 사유가 있고 입영 전에 해소되어 검사 후 입영할 수 있는 사람; 검사일 전일까지 연기원서를 지방병무청장에게 제출</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-021</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   04 / 04</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">입영판정검사의 시기·연기</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">입영 전 30일과 최근 검사 후 6개월</text>
