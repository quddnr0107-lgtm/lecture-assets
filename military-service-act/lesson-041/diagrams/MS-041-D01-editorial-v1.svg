<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">사회복무요원 인원 배정</title><desc id="desc">2월 말일까지: 복무기관의 장 다음 해 필요인원 배정을 지방병무청장에게 요청하고 사회복무요원 활용 계획서 제출 / 3월 31일까지: 지방병무청장 공익상 필요성·근무조건 등을 조사하여 기관·분야·형태별 배정인원 결정 후 병무청장에게 보고 / 4월 20일까지: 지방병무청장 배정 결과를 복무기관의 장에게 통보</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
