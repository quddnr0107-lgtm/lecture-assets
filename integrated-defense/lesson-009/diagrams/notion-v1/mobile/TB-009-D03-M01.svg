<path d="M80 1266L80 1441" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1301" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">운영 시점</text>
<text x="104" y="1363" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위사태 선포 때 + 통합방위태세 확립을 위한</text>
