<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-009-D02 · 지원본부의 조직과 본부장</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 09강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">지원본부의 조직과 본부장</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제9조제3항 · 시행령 제18조 | 조직·운영은</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령령 기준에 따라 조례로 정함</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">본부장과 운영 기준 (계속)</text>
<path d="M80 433L595.609375 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">조직·운영</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">대통령령의 기준에 따라 조례로 정함</text>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 668L314.21875 668" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="722" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">시·도·시·군·자치구는 부기관장, 읍·면·동은</text>
<text x="80" y="783" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">읍장·면장·동장이 본부장이다.</text>
<text x="80" y="870" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 880L285.046875 880" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="954" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도에는</text>
<text x="80" y="1015" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">특별시·광역시·특별자치시·도·특별자치도를</text>
<text x="80" y="1076" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">포함한다.</text>
<text x="80" y="1157" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">이 도식의 구는 자치구를 뜻한다. 지원반은 시행령</text>
<text x="80" y="1218" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제18조의 명칭을 기준으로 구분한다.</text>
<text x="80" y="1305" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1315L270.0625 1315" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1389" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제9조제3항</text>
<text x="80" y="1470" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제18조제1항~제4항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제9조 · TB-009-D02 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
