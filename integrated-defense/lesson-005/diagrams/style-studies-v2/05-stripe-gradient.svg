<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">05 · Stripe — 지역협의회 심의사항</title><desc id="desc">Stripe의 사선 구성, 색의 흐름, 입체적인 제품 시각화에서 착안한 자체 디자인. 통합방위법 제5조제3항의 지역협의회 공통 네 사항과 시·도 협의회에 한정된 두 사항을 비교한 디자인 시안.</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#071D34" />
