<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-003-D02 · 중앙·지방 통합방위회의는 연 1회 이상</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 03강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">중앙·지방 통합방위회의는 연 1회 이상</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">개최 주체와 회의 준비 주체를 나누어 기억</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 372L314.21875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="426" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">연 1회 이상인 통합방위회의와, 별도 규정을 따르는</text>
<text x="80" y="487" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">협의회 회의를 구별한다.</text>
<text x="80" y="574" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 584L285.046875 584" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위회의는 시책의 국가방위요소별 추진 실적을</text>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">평가하고 통합방위태세를 확립하기 위한 회의다.</text>
<text x="80" y="800" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장은 지방 통합방위회의 준비·개최</text>
<text x="80" y="861" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지침을 하달한다(시행령 제3조제6항).</text>
<text x="80" y="942" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">참석자 전체 명단은 이 핵심 도식의 범위에서</text>
<text x="80" y="1003" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">제외했다.</text>
<text x="80" y="1090" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1100L270.0625 1100" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1174" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제3조제1항·제3항~제6항</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제3조 · TB-003-D02 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
