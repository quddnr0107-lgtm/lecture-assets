<text x="1102.6666666666665" y="854.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">경찰과 군의 각 지휘체계를 명확히</text>
<text x="1102.6666666666665" y="896.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">하고 상호 적극 협조</text>
