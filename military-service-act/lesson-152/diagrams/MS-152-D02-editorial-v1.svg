<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전문·산업기능요원의 복무위반</title><desc id="desc">해당 분야 미복무: 행위 편입 당시 병역지정업체의 해당 분야에 복무하지 않음; 취소 요건 그 사유로 전문연구요원·산업기능요원 편입이 취소된 사람 / 통틀어 8일 무단결근: 행위·취소 의무복무기간 중 통틀어 8일 이상 무단결근하여 편입이 취소된 사람; 법정형 두 경우 모두 3년 이하의 징역</desc>
