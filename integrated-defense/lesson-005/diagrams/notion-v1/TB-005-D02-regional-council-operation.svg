<title id="title">TB-005-D02 · 지역협의회와 지역실무위원회</title><desc id="desc">지역별 의장, 조례, 회의 운영을 구분 의장과 구성·운영 기준：시·도 협의회 시·도지사 소속이며 의장도 시·도지사；시·군·구 협의회 시장·군수·자치구 구청장 소속이며 해당 장이 의장；조례로 정함 대통령령으로 정하는 기준에 따라 구성·운영 사항을 조례로 정함 지역협의회 회의：소집 정기: 분기 1회 원칙 / 임시: 필요시 의장이 소집；화상회의 전자투표 포함 가능. 참여자는 동일 회의장에 출석한 것으로 봄；일반 의결 재적위원 과반 출석 + 출석위원 과반 찬성；선포·해제 심의 시·도: 재적위원 과반 출석 + 출석위원 3분의 2 이상 찬성 지역실무위원회：담당 업무 안건 사전 심의, 의장 위임사항 심의, 관계 행정기관 간 업무 협조·조정；소집·운영 분기 1회 이상 원칙. 구성·운영은 협의회 심의를 거쳐 의장이 정함 지방 통합방위회의의 연 1회 이상 개최 규정과 구분한다. 일반 의결은 시행령 제7조제2항 준용이며, 사태 선포·해제에는 시행령 제24조제1항의 특별 기준을 적용한다. 지역협의회 위원의 개별 직위 목록은 시행령 제8조제1항에 따르며 이 도식에는 열거하지 않는다. 국회 또는 시·도의회의 해제 요구에 따른 심의 생략은 법 제14조제2항·제5항 단서에 따른다.</desc>
