<text x="80" y="1247" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제17조제1항~제3항</text>
<text x="80" y="1328" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 시행령 제29조제1항~제4항</text>
