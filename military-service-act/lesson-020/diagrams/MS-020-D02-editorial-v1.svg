<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">재병역판정검사 제외 대상</title><desc id="desc">검사·소집 관계: 이미 검사 법 제14조의2제1항에 따른 재병역판정검사를 이미 받은 사람; 입영·소집일 확정 해당 해 법 제60조제3항의 연기가 끝나 입영·소집일이 결정된 사람. 그 날 징집·소집되지 않으면 제외 안 됨; 소집 후순위 법 제28조에 따라 병무청장이 소집 순서를 후순위로 조정한 사람 / 편입·선발 관계: 일부 보충역 학력에 따른 보충역 및 법 제62조제1항제2호·제65조제1항제2호에 따른 보충역; 군간부후보생 군간부후보생의 병적에 편입된 사람; 전문연구요원 법 제37조제2항에 따라 미리 전문연구요원 편입대상자로 선발된 사람</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
