<title id="title">임명 결격과 임명 주체</title>
<desc id="desc">RL-025 예비군법 제14조의2, 예비군부대 지휘관의 임무 및 결격사유. 법 제14조의2제2항 · 시행규칙 제12조제1항</desc>
