<title id="title">형 선고와 병적 제적</title><desc id="desc">복무 제한: 형 선고 사형, 무기 또는 6년 이상의 징역이나 금고를 선고받은 병역의무자; 법적 효과 병역에 복무할 수 없으며 병적에서 제적 / 제적처분 주체: 군복무 중 각 군 참모총장(전환복무자 포함); 그 밖의 사람 거주지 지방병무청장·병무지청장</desc>
