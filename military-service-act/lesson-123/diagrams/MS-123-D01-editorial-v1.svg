<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병무행정 주관과 처분 통제</title><desc id="desc">주관: 병무청장 징집·소집과 그 밖의 병무행정을 관장 / 명령·처분 통제: 위법·부당 인정 지방병무청장의 명령이나 처분을 중지 또는 취소할 수 있음 / 지체 없이 통보: 병무청장 중지·취소 사실을 지방병무청장에게 통보 / 지체 없이 통지: 지방병무청장 통보받은 사실을 해당 병역의무자에게 통지</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
