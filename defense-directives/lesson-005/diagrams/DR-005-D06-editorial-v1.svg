<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">특별감사: 장관 → 각 군 위임. 부대기·현판 수여: 장관 → 각 수임군부대 위임. 정기감사: 수임군부대장.</text>
