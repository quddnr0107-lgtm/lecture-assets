<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-016-D02 · 사태 종류별 작전통제 범위</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 16강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">사태 종류별 작전통제 범위</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제25조제1항·제4항·제5항 | 누가 어떤</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가방위요소를 통제하는가</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">병종 · 군관할·해역 (계속)</text>
<path d="M80 433L603.203125 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">특정·일반해역</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">함대사령관이 관할해역 안 모든 국가방위요소 통제</text>
<text x="80" y="658" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 668L314.21875 668" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="722" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">병종 경찰관할지역은 민방위대 자원과 위임받은 군</text>
<text x="80" y="783" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">작전요소, 병종 군지역·해역은 관할 안 모든</text>
<text x="80" y="844" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">요소이다.</text>
<text x="80" y="931" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 941L285.046875 941" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1015" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군·특정경비는 군관할지역 및 특정경비지역,</text>
<text x="80" y="1076" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">특정·일반해역은 특정경비해역 및 일반경비해역을</text>
<text x="80" y="1137" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">뜻한다.</text>
<text x="80" y="1218" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">군 작전지원은 경찰의 요청과 군사령관의 지원 가능</text>
<text x="80" y="1279" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">규정이며, 요청을 즉시 지휘권 이전으로 해석하지</text>
<text x="80" y="1340" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">않는다.</text>
<text x="80" y="1421" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">경계태세 1급의 함대사령관 통제 대상은</text>
<text x="80" y="1482" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">해양경찰이지만, 병종사태의 해역 통제 대상은 모든</text>
<text x="80" y="1543" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가방위요소이다.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제15조 · TB-016-D02 · 2/3</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
