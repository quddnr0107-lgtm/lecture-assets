<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" lang="ko" role="img"><title>국외여행허가 사유 11가지</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-109</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 L1520 105" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">국외여행허가 사유 11가지</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시행령 제146조제1항 · 어느 하나에 해당하는 경우만</text>
<path d="M80 280 L1520 280" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M800 330 L800 925" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">회의·교류·직무</text>
<path d="M80 389 Q230 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="98" cy="436" r="5" fill="#25241F"/>
<text x="128" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">01  국제회의·국제경기 (전지훈련 포함)</text>
<circle cx="98" cy="512" r="5" fill="#25241F"/>
<text x="128" y="522" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">02  훈련·연수·견학·문화교류</text>
<circle cx="98" cy="588" r="5" fill="#25241F"/>
<text x="128" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">03  수출시장 개척·수출입계약</text>
<circle cx="98" cy="664" r="5" fill="#25241F"/>
<text x="128" y="674" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">04  국외 왕래 선박의 선원</text>
<circle cx="98" cy="740" r="5" fill="#25241F"/>
<text x="128" y="750" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">05  항공기 승무원</text>
<circle cx="98" cy="816" r="5" fill="#25241F"/>
<text x="128" y="826" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">06  국외파견 공무원·취재기자</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">취업·치료·거주·학업</text>
<path d="M840 389 Q990 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="858" cy="436" r="5" fill="#25241F"/>
<text x="888" y="446" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">07  국외취업</text>
<circle cx="858" cy="512" r="5" fill="#25241F"/>
<text x="888" y="522" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">08  국내에서 치료 곤란한 질병의 치료</text>
<circle cx="858" cy="588" r="5" fill="#25241F"/>
<text x="888" y="598" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">09  국외이주</text>
<circle cx="858" cy="664" r="5" fill="#25241F"/>
<text x="888" y="674" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">10  유학 (고등학교 수학 제외)</text>
<circle cx="858" cy="740" r="5" fill="#25241F"/>
<text x="888" y="750" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">11  병무청장이 특히 필요하다고 인정</text>
<text x="888" y="792" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="31" font-weight="400" fill="#55534E" text-anchor="start">예: 친척·친지 방문</text>
<path d="M80 950 L1520 950" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1009" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="700" fill="#25241F" text-anchor="start">국제경기에는 전지훈련 포함 / 유학에는 고등학교 수학 제외</text>
<path d="M80 1040 L1520 1040" stroke="#D8D5CE" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
