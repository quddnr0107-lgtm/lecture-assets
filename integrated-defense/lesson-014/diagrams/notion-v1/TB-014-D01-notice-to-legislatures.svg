<path d="M595.3333333333333 411 Q575.3333333333333 411 575.3333333333333 433 L575.3333333333333 846 Q575.3333333333333 868 595.3333333333333 868" fill="none" stroke="#25241F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="607.3333333333333" y="441" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">통고 대상</text>
