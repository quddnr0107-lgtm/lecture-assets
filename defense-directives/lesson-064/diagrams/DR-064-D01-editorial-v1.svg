<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전국단위훈련의 신청과 입소</title><desc id="desc">DR-064 · 교육훈련 훈령 제20조. 전국의 훈련장을 선택하되 사전 신청한 사람만 입소한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-064</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">교육훈련</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">전국단위훈련의 신청과 입소</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">전국의 훈련장을 선택하되 사전 신청한 사람만 입소한다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="973" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">공시와 신청</text>
<path d="M81 385 C170.188 391 243.198 381 309.734 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제2항·제3항·제5항</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">훈련부대</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">연간 계획을 홈페이지·앱에 공시</text>
<text x="144" y="603.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">학급·일정 공시</text>
<text x="144" y="645.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">훈련개시 30일 전 14시 전후 15분 이내부터</text>
<text x="144" y="692.62" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">신청 가능</text>
<text x="144" y="767.38" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">인터넷 신청</text>
<text x="144" y="809.38" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">훈련실시 3일 전까지 홈페이지·앱</text>
<text x="144" y="884.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">방문 신청</text>
<text x="144" y="926.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">원소속 또는 인근 중대 · 별지 제3호 참고</text>
<path d="M116 459 C96 459 92 466 92 485 L92 933 C92 956 102 965 117 965" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">대상·입소·불참</text>
<path d="M844 341 C866 311 1103.56 307 1157.56 331 C1178.56 346 1164.56 381 1135.56 393 C1000.78 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제1항·제6항·제7항</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">대상</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">본인 희망 시 전국 훈련장</text>
<text x="860" y="603.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제외</text>
<text x="860" y="645.76" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">동원훈련Ⅰ형·작계훈련 / 간부·공군 병은</text>
<text x="860" y="692.62" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">제13조제4항</text>
<text x="860" y="767.38" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">입소</text>
<text x="860" y="809.38" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">인터넷·방문 신청자에 한함</text>
<text x="860" y="884.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">신청 후 불참</text>
<text x="860" y="926.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">소속 예비군중대가 차수 증가 후 차후 훈련 부과</text>
<text x="80" y="1000" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">별지 제3호: 이미 부과된 훈련이 없으면 해당 칸은 공란. 강의 원고 제20조 설명 기준.</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">교육훈련 훈령 제20조 · DR-064-D01</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
