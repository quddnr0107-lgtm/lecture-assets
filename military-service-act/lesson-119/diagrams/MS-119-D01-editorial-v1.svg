<text x="84" y="1021" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#25241F" text-anchor="start">국가유공자법 또는 보훈보상대상자법이 정하는 바에 따라 보상 가능</text>
