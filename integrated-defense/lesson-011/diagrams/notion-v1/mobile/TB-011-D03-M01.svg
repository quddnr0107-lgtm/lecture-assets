<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-011-D03 · 취재지역별 허용과 제한</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 11강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">취재지역별 허용과 제한</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시행령 제19조제2항~제4항 | 명단·표지, 허용지역</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">안, 허용지역 밖</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">취재 준비</text>
<path d="M80 433L270.0625 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 474L80 588" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="509" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">명단 통보</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">언론기관이 작전지휘관에게 취재기자 명단 통보</text>
<path d="M80 619L80 733" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="654" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">식별표지</text>
<text x="104" y="716" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">특별한 사정이 없으면 작전지휘관이 기자에게 제공</text>
<text x="80" y="803" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">허용지역 안</text>
<path d="M80 813L314.21875 813" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 854L80 1029" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="889" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">취재 보장</text>
<text x="104" y="951" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">식별표지 착용 기자는 정해진 허용지역 안에서</text>
<text x="104" y="1012" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">자유롭게 취재</text>
<path d="M80 1060L80 1235" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1095" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">제한 가능</text>
<text x="104" y="1157" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전에 지장을 준다고 인정되는 경우 취재활동 제한</text>
<text x="104" y="1218" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">가능</text>
<text x="80" y="1305" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">허용지역 밖</text>
<path d="M80 1315L314.21875 1315" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 1356L80 1531" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1391" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">승인·안내</text>
<text x="104" y="1453" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">작전지휘관의 사전 승인 후 제공된 안내요원의</text>
<text x="104" y="1514" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">안내에 따라 취재</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제10조 · TB-011-D03 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
