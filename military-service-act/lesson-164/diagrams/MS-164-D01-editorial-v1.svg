<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역법 과태료 금액 비교</title><desc id="desc">2천만·1천만원: 2천만원 이하 특정 전문연구요원 관리업체장(고용주 제외)이 해당 분야에 복무시키지 않거나 정당한 사유 없이 신상통보 위반; 1천만원 이하 복무기관장이 사회복무요원에게 복무기관 내 괴롭힘 / 500만·300만·100만: 500만원 이하 법정 괴롭힘 조치 위반, 정당한 사유 없는 병적관리 자료 거부·변동통보 미이행; 300만원 이하 고용주가 정당한 사유 없이 제81조제3항 자료제출 요구·질문에 불응</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-164</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 03</text>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">병역법 과태료 금액 비교</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">법정 상한과 대상 행위를 연결</text>
