<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">입영·소집 기피의 3일과 2일</title><desc id="desc">3일: 현역입영 입영일부터 3일 경과; 사회·대체복무요원 소집일부터 3일 경과; 군사교육소집 소집일부터 3일 경과 / 2일: 병력동원소집 소집일부터 2일 경과; 전시근로소집 소집일부터 2일 경과</desc>
