<text x="867.0" y="451" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">운영 시점</text>
<text x="867.0" y="505" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">통합방위사태 선포 때 + 통합방위태세 확립을</text>
<text x="867.0" y="553" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">위한 주요 훈련 때</text>
<text x="867.0" y="630" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">합동실 책임</text>
<text x="867.0" y="684" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">지역 작전책임 군부대의 장 또는 해당 지역</text>
<text x="867.0" y="732" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">국가경찰관서장</text>
<text x="867.0" y="809" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#25241F" text-anchor="start">기타 운영</text>
<text x="867.0" y="863" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="33" font-weight="400" fill="#77756E" text-anchor="start">지역협의회 심의 → 지역협의회 의장이 정함</text>
