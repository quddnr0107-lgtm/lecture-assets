<text x="112" y="649.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">직무 태만 결과</text>
<text x="112" y="693.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">국가안전보장이나 통합방위 업무에</text>
<text x="112" y="731.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">중대한 지장을 초래</text>
<text x="112" y="815.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#25241F" text-anchor="start">본부장 조사</text>
<text x="112" y="859.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">소속 공무원에게 조사하게 할 수 있음.</text>
<text x="112" y="897.0" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="400" fill="#77756E" text-anchor="start">필요시 합동조사·자료 요청 가능</text>
