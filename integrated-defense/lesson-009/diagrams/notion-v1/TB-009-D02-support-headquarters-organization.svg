<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">TB-009-D02 · 지원본부의 조직과 본부장</title><desc id="desc">법 제9조제3항 · 시행령 제18조 | 조직·운영은 대통령령 기준에 따라 조례로 정함 조직 구성：기본 구조 상황실 + 분야별 지원반；지원 분야 ① 총괄 / 인력·재정 동원 / 산업·수송·장비 동원；지원 분야 ② 의료·구호 / 보급·급식 / 통신·전산 / 홍보；지역별 조정 분야별 지원반은 지역 특성에 맞게 조정 가능 본부장과 운영 기준：시·도·시군구 본부장: 해당 지방자치단체의 부기관장；읍·면·동 본부장: 각각 읍장·면장·동장；설치 위치 각 지방자치단체 및 읍·면·동의 주사무소；조직·운영 대통령령의 기준에 따라 조례로 정함 시·도에는 특별시·광역시·특별자치시·도·특별자치도를 포함한다. 이 도식의 구는 자치구를 뜻한다. 지원반은 시행령 제18조의 명칭을 기준으로 구분한다.</desc>
