<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-004-D04 · 중앙협의회 법정 위원과 추가 위원</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 04강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">중앙협의회 법정 위원과 추가 위원</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법 제4조제2항 · 시행령 제5조</text>
<path d="M80 288L1000 288" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="362" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법률 직접 열거 · 장관 외</text>
<path d="M80 372L567.921875 372" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 413L80 771" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="448" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">기관장 5개</text>
<text x="104" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국무조정실장</text>
<text x="104" y="571" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">법제처장</text>
<text x="104" y="632" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">식품의약품안전처장</text>
<text x="104" y="693" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">국가정보원장</text>
<text x="104" y="754" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위본부장</text>
<text x="80" y="841" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">대통령령에 따른 추가 위원</text>
<path d="M80 851L606.03125 851" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 892L80 1006" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="927" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">제1호 · 지방자치단체장</text>
<text x="104" y="989" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">지방자치단체의 장 중 중앙협의회 의장이 위촉</text>
<path d="M80 1037L80 1212" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="104" y="1072" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="44" fill="#25241F">제2호 · 식견·경험</text>
<text x="104" y="1134" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위에 관한 식견과 경험이 풍부한 사람 중</text>
<text x="104" y="1195" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">중앙협의회 의장이 임명하거나 위촉</text>
<text x="80" y="1282" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 1292L314.21875 1292" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1346" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">지자체장: 위촉 / 식견·경험자: 임명 또는 위촉.</text>
<text x="80" y="1433" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 1443L285.046875 1443" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1517" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">의장은 국무총리이다. 장관 직위는 D03 참조.</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제4조 · TB-004-D04 · 1/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
