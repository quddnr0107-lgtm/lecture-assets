<text x="607.3333333333333" y="489" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">시도경찰청장: 민방위대 자원 +</text>
<text x="607.3333333333333" y="531" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">지역군사령관에게 위임받은 군</text>
<text x="607.3333333333333" y="573" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">작전요소</text>
<text x="607.3333333333333" y="670" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#25241F" text-anchor="start">군 작전지원</text>
<text x="607.3333333333333" y="718" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">필요시 지역군사령관에게 지원</text>
<text x="607.3333333333333" y="760" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">요청; 군사령관은 군 작전지원반</text>
<text x="607.3333333333333" y="802" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">편성·지원 가능</text>
