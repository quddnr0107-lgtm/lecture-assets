<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">현역병 모집과 선발</title><desc id="desc">지원·선발: 대상 18세 이상으로 군 복무를 지원한 사람; 선발 주체 병무청장이나 각 군 참모총장이 육군·해군·공군 현역병으로 선발 가능; 검사 현역병지원 신체검사를 거침 — 법 제14조의3제1항제3호의 마약류 검사 포함 / 전형·입영: 추가 전형 병무청장은 각 군 참모총장과 협의하여 체력검사·면접·필기·실기 등을 실시 가능; 입영일 지정 병무청장이나 각 군 참모총장은 선발자에게 날짜를 정하여 입영하게 함; 선발 취소 입영 전 본인이 원하더라도 대통령령이 정한 사유가 있는 경우에만 허가 가능</desc>
