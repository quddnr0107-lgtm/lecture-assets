<title id="title">창설 때의 수여와 대행</title>
<desc id="desc">RL-029 예비군법 시행령 제29조와 시행규칙 제24조부터 제29조까지, 예비군부대기. 시행규칙 제25조: 원칙과 필요한 경우의 예외</desc>
