<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">보류원서 제출과 직권처리</title><desc id="desc">DR-067 · 교육훈련 훈령 제23조. 본인 신청과 자료에 근거한 직권 보류의 절차다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">훈령  /  DR-067</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">교육훈련</text>
<text x="80" y="181" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="64" font-weight="700" fill="#25241F" text-anchor="start">보류원서 제출과 직권처리</text>
<text x="84" y="233" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="400" fill="#77756E" text-anchor="start">본인 신청과 자료에 근거한 직권 보류의 절차다.</text>
<path d="M1364 142 L1458 130 L1484 211 L1380 229 Z" fill="#F1EFEA" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1337 153 L1438 151 L1442 235 L1334 235 Z" fill="#FFFEFC" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1356 175 L1416 174 M1355 191 L1416 190 M1354 207 L1392 207" fill="none" stroke="#25241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="80" y1="284" x2="1520" y2="284" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<line x1="808" y1="336" x2="808" y2="1002" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="44" font-weight="700" fill="#25241F" text-anchor="start">보류원서</text>
<path d="M81 385 C148.014 391 203.072 381 256.938 386" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">제출·결정</text>
<text x="144" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">제출</text>
<text x="144" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">보류원서·관련서류를 소속 예비군지휘관에게</text>
<text x="144" y="575.86" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">제출</text>
<text x="144" y="660.287" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">방법</text>
<text x="144" y="702.287" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">방문·FAX·홈페이지·앱·전자전송·문자 등</text>
<text x="144" y="786.713" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">대리 제출</text>
<text x="144" y="828.713" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">같은 세대의 세대주·가족 중 성년자·고용주</text>
<text x="144" y="913.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">결정 후</text>
<text x="144" y="955.14" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="400" fill="#25241F" text-anchor="start">예비군에게 통보하고 국방동원정보체계 입력</text>
<path d="M116 459 C96 459 92 466 92 485 L92 962 C92 985 102 994 117 994" fill="none" stroke="#25241F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856" y="372" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="42" font-weight="700" fill="#25241F" text-anchor="start">자료 확인·직권처리</text>
<path d="M844 341 C866 311 1167.75 307 1221.75 331 C1242.75 346 1228.75 381 1199.75 393 C1032.88 413 866 400 843 375 C830 363 834 349 844 341" fill="none" stroke="#25241F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="426" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="27" font-weight="400" fill="#77756E" text-anchor="start">신청서 생략 등</text>
<text x="860" y="487" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">재직·재학증명</text>
<text x="860" y="529" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">직장예비군부대 미편성 직장·학교 예비군에</text>
<text x="860" y="575.86" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">한함</text>
<text x="860" y="644.72" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">대학 직장부대</text>
<text x="860" y="686.72" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">학적자료로 지휘관 직권처리</text>
<text x="860" y="755.58" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">출입국</text>
<text x="860" y="797.58" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">병무청 명부; 복수국적 외국여권 조회 누락 시</text>
<text x="860" y="844.44" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">지방병무청 확인</text>
<text x="860" y="913.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">직권 처리</text>
<text x="860" y="955.3" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="33" font-weight="700" fill="#25241F" text-anchor="start">본인 또는 대리수령 가능자에게 통보·증빙 유지</text>
<line x1="80" y1="1051" x2="1520" y2="1051" stroke="#DFDDD6" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="22" font-weight="400" fill="#77756E" text-anchor="start">교육훈련 훈령 제23조 · DR-067-D03</text>
<text x="1520" y="1091" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>
