<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">병역의무기피공개심의위원회</title><desc id="desc">11명 구성: 위원장 1명 관할 지방병무청 병역판정관 또는 징집·소집 담당 과장급 중 지명; 위원 10명 소속 공무원 4명 + 학식·경험이 풍부한 위촉위원 6명 / 임기·회의: 위촉위원 2년 민간 위촉위원의 임기는 2년; 의결 기준 재적위원 과반수 출석, 출석위원 과반수 찬성</desc>
