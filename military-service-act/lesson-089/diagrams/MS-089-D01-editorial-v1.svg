<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전시근로소집의 대상</title><desc id="desc">보충역·군사교육 제외: 동원지정 제외 보충역 군사교육소집을 마친 보충역 중 병력동원소집 지정에서 제외된 사람.; 군사교육소집 제외자 법 제55조제3항에 따라 군사교육소집에서 제외된 사람. / 전시근로역·대체역: 전시근로역 법정 기술면허·자격 취득자 등 제1항제2호 괄호의 제외대상은 제외한다.; 대체역 대체역 중 대체복무요원은 제외한다.</desc>
<rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법  /  MS-089</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">개념·핵심 도식   01 / 01</text>
