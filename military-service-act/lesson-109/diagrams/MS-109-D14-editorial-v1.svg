<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" lang="ko"><title>허가 위임과 통보의 구분</title><rect width="1600" height="1120" fill="#FFFEFC"/>
<text x="80" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#25241F" text-anchor="start">병역법 / MS-109</text>
<text x="1520" y="74" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="end">제80회 · 스크립트 도식</text>
<path d="M80 105 H1520 M80 280 H1520 M800 330 V925 M80 950 H1520 M80 1040 H1520" stroke="#D8D5CE" stroke-width="2" fill="none"/>
<text x="80" y="182" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="58" font-weight="700" fill="#25241F" text-anchor="start">허가 위임과 통보의 구분</text>
<text x="84" y="241" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="29" font-weight="400" fill="#77756E" text-anchor="start">본법 제70조 제4·5·7항 / 시행령 제147·148조</text>
<text x="80" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">대통령령으로 정함</text>
<path d="M80 389 Q240 382 360 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="98" cy="421" r="5" fill="#25241F"/>
<text x="128" y="430" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제4항</text>
<text x="128" y="467" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">제1항의 국외여행허가 및 제3항의</text>
<text x="128" y="504" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">기간연장허가 범위·절차</text>
<circle cx="98" cy="548" r="5" fill="#25241F"/>
<text x="128" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">제7항</text>
<text x="128" y="594" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">허가 취소 사유</text>
<text x="840" y="371" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="700" fill="#25241F" text-anchor="start">통보 방향과 방법</text>
<path d="M840 389 Q1000 382 1120 390" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="858" cy="421" r="5" fill="#25241F"/>
<text x="888" y="430" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">허가·연장허가 사실</text>
<text x="888" y="467" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">병무청장 → 법무부장관</text>
<circle cx="858" cy="511" r="5" fill="#25241F"/>
<text x="888" y="520" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">시행령 제148조</text>
<text x="888" y="557" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">정보통신망 등을 이용하여 통보</text>
<circle cx="858" cy="601" r="5" fill="#25241F"/>
<text x="888" y="610" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#77756E" text-anchor="start">국외 연장허가 결과</text>
<text x="888" y="647" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">재외공관의 장에게 지체 없이 알려 본인에게</text>
<text x="888" y="684" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="400" fill="#25241F" text-anchor="start">전달</text>
<text x="80" y="990" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#25241F" text-anchor="start">제4항은 1항 및 3항 / 통보 대상은 법무부장관</text>
<text x="80" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="400" fill="#77756E" text-anchor="start">병역법 · MS-109 · 기존 제80회 원고</text>
<text x="1520" y="1090" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#25241F" text-anchor="end">무한회독</text>
</svg>