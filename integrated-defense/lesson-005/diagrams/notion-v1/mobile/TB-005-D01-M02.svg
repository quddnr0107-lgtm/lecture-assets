<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" lang="ko">
<title>TB-005-D01 · 지역협의회의 심의사항</title>
<rect width="1080" height="1800" fill="#FFFEFC"/>
<text x="80" y="65" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">무한회독 / 통합방위법 · 05강</text>
<text x="80" y="162" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="56" fill="#25241F">지역협의회의 심의사항</text>
<text x="80" y="249" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도와 시·군·구 지역협의회 비교 · 각 협의회가</text>
<text x="80" y="310" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">각각 심의</text>
<path d="M80 349L1000 349" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="423" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">기억할 문장</text>
<path d="M80 433L314.21875 433" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="487" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">시·군·구의 4개 공통 심의사항에, 시·도는</text>
<text x="80" y="548" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="42" fill="#25241F">1호·3호를 더하여 심의한다.</text>
<text x="80" y="635" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">조건·범위</text>
<path d="M80 645L285.046875 645" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="719" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">시·도만이라는 제한은 법 제5조의 두 지역협의회</text>
<text x="80" y="780" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">사이의 구분이다. 중앙협의회의 심의 범위를 제한하는</text>
<text x="80" y="841" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">뜻은 아니다.</text>
<text x="80" y="922" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">취약지역의 선정·해제와 취약지역 대비책은 서로</text>
<text x="80" y="983" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">다른 사항이다.</text>
<text x="80" y="1064" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">협의회별 심의 권한의 비교이며 상하 지휘관계를</text>
<text x="80" y="1125" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">뜻하지 않는다.</text>
<text x="80" y="1212" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="48" fill="#25241F">법령 근거</text>
<path d="M80 1222L270.0625 1222" stroke="#25241F" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1296" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="42" fill="#25241F">통합방위법 제5조제3항 본문·단서</text>
<path d="M80 1655L1000 1655" stroke="#DFDDD6" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="80" y="1709" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" font-size="35" fill="#25241F">제5조 · TB-005-D01 · 2/2</text>
<text x="80" y="1757" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="34" fill="#77756E">근거: 마지막 페이지 및 모바일 목록</text>
</svg>
