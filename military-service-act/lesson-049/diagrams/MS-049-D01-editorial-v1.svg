<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">복무기관 내 괴롭힘의 금지</title><desc id="desc">행위의 요건: 행위자 복무기관의 장 또는 소속 직원; 우위의 이용 지위 또는 관계 등의 우위를 이용; 업무상 범위 초과 업무상 적정범위를 넘어서는 행위 / 결과 중 하나: 신체적·정신적 고통 사회복무요원에게 신체적·정신적 고통을 주는 행위; 근무환경 악화 사회복무요원의 근무환경을 악화시키는 행위</desc>
