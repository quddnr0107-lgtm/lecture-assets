<text x="128" y="564" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">면접·실기·필기·서류심사 등. 선발</text>
<text x="128" y="619" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="40" font-weight="400" fill="#25241F" text-anchor="start">결정권은 제외</text>
